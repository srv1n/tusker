schema: tusker.docs-map/v5

domains:
  work-model:
    label: Work model
    owner_epic: ARC
    description: Epic/task/schema/status contract.
  docs-system:
    label: Documentation system
    owner_epic: DOC
    description: Diátaxis docs, docs-map, freshness gates, doc nodes.
  publishing:
    label: Publishing
    owner_epic: MRK
    description: Optional Markdoc/rendering/plain Markdown export.
  media:
    label: Media
    owner_epic: MED
    description: Video, screenshot, demo, promo, transcript, and claim assets.
  evals:
    label: Evals
    owner_epic: EVAL
    description: Docs and agent task-success evaluations.
  cli:
    label: CLI
    owner_epic: CLI
    description: Tusker command surface.
  validator:
    label: Validator
    owner_epic: VAL
    description: Deterministic validation rules.
  skill:
    label: Skill
    owner_epic: SKL
    description: Agent skill and progressive-disclosure instructions.
  orchestration:
    label: Orchestration
    owner_epic: ORC
    description: Daemon, runs, events, scheduling, locks.
  obsidian:
    label: Obsidian
    owner_epic: OBS
    description: Obsidian vault, Bases, dashboards, mobile-readable views.

nodes:
  tusker/model:
    title: Tusker model
    path: tusker/docs/concepts/tusker-model.md
    domain: work-model
    mode: explanation
    audience: developer
    agent_layer: capsule
    role: canon
    covers: [work-model]
    source_of_truth: [SPEC/TUSKER_V5_FINAL_SPEC.md]
    stale_when:
      paths: [skill/references/SCHEMA.md, cmd/tusker/**]
    evals: [tusker-model-retrieval]

  tusker/tasks:
    title: Task schema and workflow
    path: tusker/docs/reference/task-schema.md
    domain: work-model
    mode: reference
    audience: developer
    agent_layer: capsule
    role: canon
    covers: [work-model]
    source_of_truth: [templates/task.feature.md, templates/task.bug.md]
    stale_when:
      paths: [skill/references/SCHEMA.md, skill/references/WORKFLOW.md]
    evals: [task-schema-reference]

  tusker/docs-system:
    title: Documentation freshness system
    path: tusker/docs/concepts/docs-freshness.md
    domain: docs-system
    mode: explanation
    audience: developer
    agent_layer: capsule
    role: canon
    covers: [docs-system]
    source_of_truth: [_config/docs-map.yaml]
    stale_when:
      paths: [cmd/tusker/**, skill/references/DOCS_PUBLICATION.md]
    evals: [docs-impact-staleness]

  tusker/cli:
    title: Tusker CLI reference
    path: tusker/docs/reference/cli.md
    domain: cli
    mode: reference
    audience: developer
    agent_layer: capsule
    role: canon
    covers: [cli]
    source_of_truth: [cmd/tusker/**]
    stale_when:
      paths: [cmd/tusker/**]
    evals: [cli-reference-lookup]

  tusker/migration:
    title: Migrating to Tusker v5
    path: tusker/docs/guides/migrate-to-v5.md
    domain: work-model
    mode: how-to
    audience: developer
    agent_layer: capsule
    role: procedure
    covers: [work-model, docs-system]
    source_of_truth: [SPEC/MIGRATION_PLAN.md]
    stale_when:
      paths: [cmd/tusker/**, skill/references/SCHEMA.md]
    evals: [migration-dry-run]

  tusker/daemon:
    title: Dispatcher and orchestration
    path: tusker/docs/reference/daemon.md
    domain: orchestration
    mode: reference
    audience: developer
    agent_layer: capsule
    role: canon
    covers: [orchestration]
    source_of_truth: [cmd/tusker/**]
    stale_when:
      paths: [cmd/tusker/**]

  tusker/obsidian:
    title: Obsidian vault and dashboards
    path: tusker/docs/guides/obsidian.md
    domain: obsidian
    mode: how-to
    audience: user
    agent_layer: none
    role: procedure
    covers: [obsidian]
    source_of_truth: [tusker/_system/views/**]
    stale_when:
      paths: [tusker/_system/views/**]

  tusker/media:
    title: Media assets and review evidence
    path: tusker/docs/reference/media.md
    domain: media
    mode: reference
    audience: developer
    agent_layer: capsule
    role: canon
    covers: [media]
    source_of_truth: [_config/media-map.yaml]
    stale_when:
      paths: [_config/media-map.yaml, media/**]
    evals: [media-transcript-check]

  tusker/evals:
    title: Documentation evals
    path: tusker/docs/reference/docs-evals.md
    domain: evals
    mode: reference
    audience: developer
    agent_layer: capsule
    role: canon
    covers: [evals]
    source_of_truth: [evals/**]
    stale_when:
      paths: [evals/**, cmd/tusker/**]
    evals: [docs-eval-runner]

  tusker/markdoc:
    title: Optional Markdoc publishing layer
    path: tusker/docs/reference/markdoc.md
    domain: publishing
    mode: reference
    audience: developer
    agent_layer: none
    role: canon
    covers: [publishing]
    source_of_truth: [site/**]
    stale_when:
      paths: [site/**]

  agents/tusker-skill:
    title: Agent recipe: using Tusker
    path: tusker/docs/agents/use-tusker.md
    domain: skill
    mode: how-to
    audience: agent
    agent_layer: standalone
    role: procedure
    covers: [skill, work-model, docs-system]
    source_of_truth: [skill/SKILL.md, AGENTS.md]
    stale_when:
      paths: [skill/**, AGENTS.md]
    evals: [agent-use-tusker]
