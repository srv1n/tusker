schema: tusker.validator-rules/v5

phase_1_hard_rules:
  UNKNOWN_DOMAIN:
    description: Task, doc, media, or eval references a domain not defined in docs-map.yaml.
  UNKNOWN_DOC_NODE:
    description: Task, doc, media, or eval references a doc_node not defined in docs-map.yaml.
  DOCS_IMPACT_UNRESOLVED:
    description: Task has doc_nodes but lacks docs update, verification, or waiver at close.
  MISSING_STRUCTURED_KNOWLEDGE_DELTA:
    description: Required knowledge delta is missing or lacks before/after or added/removed shape.
  INVALID_DOC_MODE_OR_AGENT_LAYER:
    description: Doc map or doc page uses an unknown mode, audience, or agent_layer.

phase_2_hard_rules:
  VIDEO_WITHOUT_TRANSCRIPT:
    description: Media asset of kind video lacks transcript and chapter list.
  PROMO_CLAIM_WITHOUT_EVIDENCE:
    description: Promo claim has no source task, eval, media, or doc evidence.
  MARKDOC_FORBIDDEN_CONTEXT:
    description: Markdoc custom tag appears in task, AGENTS.md, WORKFLOW.md, llms.txt, agent runbook, or canonical internal doc.
  RISK_SECTION_MISSING:
    description: Required section for task risk tier is missing.
