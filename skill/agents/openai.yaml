interface:
  display_name: "Tusker"
  short_description: "Agent-first work tracking in an Obsidian vault: epics, stories, bugs, docs as markdown with risk-scaled sections, evidence, AI disclosure, and explicit canon selection."
  icon_small: "./assets/icons/obsidian-vault-small.svg"
  icon_large: "./assets/icons/obsidian-vault-large.svg"
  brand_color: "#7C3AED"
  default_prompt: "Plan, scope, document, or execute work in an Obsidian vault. Use `tusker` CLI for create/lifecycle/docs/validate. Read `site/public/canon-manifest.json` before old docs; approved canon is safe, draft needs verification, deprecated/historical is archaeology."
policy:
  allow_implicit_invocation: true
