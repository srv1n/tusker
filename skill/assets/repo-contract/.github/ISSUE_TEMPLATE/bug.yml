name: Bug report
description: Report a bug with enough detail to reproduce it.
title: "[Bug]: "
labels:
  - bug
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened?
      placeholder: Give the bug in one or two sentences.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      placeholder: What should have happened?
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true

  - type: textarea
    id: env
    attributes:
      label: Environment
      description: App version, OS, browser, device, config, or any other relevant environment data.
      placeholder: List the environment details.

  - type: textarea
    id: evidence
    attributes:
      label: Logs, screenshots, or minimal repro
      placeholder: Paste logs, link assets, or describe the minimal repro.

  - type: dropdown
    id: severity
    attributes:
      label: Severity
      options:
        - blocker
        - high
        - medium
        - low

  - type: dropdown
    id: implementation_intent
    attributes:
      label: Do you want to implement the fix?
      options:
        - yes
        - no
        - maybe
