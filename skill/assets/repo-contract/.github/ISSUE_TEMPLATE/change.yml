name: Change request
description: Start work on a feature, refactor, migration, security improvement, or notable docs change.
title: "[Change]: "
labels:
  - change
body:
  - type: dropdown
    id: change_type
    attributes:
      label: Change type
      description: Pick the closest type.
      options:
        - feature
        - docs
        - refactor
        - migration
        - security
        - chore
        - research
    validations:
      required: true

  - type: dropdown
    id: tier
    attributes:
      label: Risk tier
      description: Use the lightest tier that is honest.
      options:
        - t0
        - t1
        - t2
        - t3
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is missing or wrong? Why does this matter?
      placeholder: Describe the problem clearly.
    validations:
      required: true

  - type: textarea
    id: desired_outcome
    attributes:
      label: Desired outcome
      description: What should be true after this ships?
      placeholder: Describe the result, not the implementation.
    validations:
      required: true

  - type: textarea
    id: scope
    attributes:
      label: Scope and non-goals
      description: State what is in scope, out of scope, and any explicit non-goals.
      placeholder: |
        In scope:
        Out of scope:
        Non-goals:
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: List concrete checks or behaviors that define done.
      placeholder: |
        - [ ]
        - [ ]
    validations:
      required: true

  - type: textarea
    id: risks
    attributes:
      label: Risks and constraints
      description: Mention obvious risks, invariants, migrations, or rollback concerns.
      placeholder: Note the main risks and constraints.

  - type: dropdown
    id: ai_help
    attributes:
      label: AI assistance planned
      options:
        - none
        - partial
        - heavy
    validations:
      required: true

  - type: textarea
    id: implementation_intent
    attributes:
      label: Do you want to implement this?
      description: Say whether you plan to work on it yourself.
      placeholder: yes / no / maybe
