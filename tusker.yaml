schema: tusker.config/v1
project_id: tusker
project_name: Tusker

storage:
  root: .tusker
  generated_root: .tusker/_generated
  evidence_root: .tusker/evidence
  events_root: .tusker/events
  attempts_root: .tusker/attempts

branches:
  default_branch: main
  control:
    - main
  state_branch: tusker/state
  implementation_patterns:
    - "agent/*"
    - "task/*"
    - "feature/*"

validation:
  task_body_warn_lines: 120
  task_body_fail_lines: 220
  frontmatter_warn_lines: 80
  capsule_token_budget: 80
  require_acceptance_proof: true
  forbid_work_log_section: true
  forbid_raw_logs_in_task: true
  protect_state_fields: true
  strict_proof_policy: true

runtime:
  lease_backend: local
  lease_ttl_minutes: 120
  mutation_mode: single_user_local

automation:
  enabled: true
  trigger_states:
    - ready
    - rework
  default_runner: codex_exec
  enabled_runners:
    - codex_exec
    - claude-code
  workspace:
    strategy: worktree
    root: workspaces
  concurrency:
    max_active_runs: 2
    max_active_runs_per_project: 2
    max_continuation_retries: 3
    max_concurrent_by_state:
      rework: 1
  budget:
    enabled: true
    per_attempt_input_tokens: 2000000
    per_attempt_output_tokens: 100000
    per_task_input_tokens: 6000000
    per_task_output_tokens: 300000
    daily_input_tokens: 20000000
    daily_output_tokens: 1000000
  validation:
    commands:
      - make build-go
      - make vet
      - make test
  runners:
    codex_exec:
      kind: codex_exec
      command: codex exec --json --skip-git-repo-check -
    claude-code:
      kind: claude-code
      command: claude -p --output-format stream-json --input-format stream-json --permission-mode bypassPermissions
  fanout:
    enabled: false
    max_children: 0
    allowed_child_types: []
    merge_rule: manual_review

close_policy:
  low:
    required_acceptor: reviewer_agent
  medium:
    required_acceptor: reviewer_agent
  high:
    required_acceptor: human
  critical:
    required_acceptor: human
    required_gates:
      - release
      - security
