automation:
    completion_reactor:
        mode: authoritative
    concurrency:
        max_active_runs: 4
        max_active_runs_per_project: 2
        max_concurrent_by_state:
            rework: 1
    default_profile: execute-standard
    default_runner: codex_exec
    dispatch_scope: armed_waves
    # Explicit dogfood opt-in. Dispatch remains limited to human-armed waves.
    enabled: true
    enabled_runners:
        - codex_exec
        - claude-code
    fanout:
        allowed_child_types: []
        enabled: false
        max_children: 0
        merge_rule: manual_review
    lane_profiles:
        execute: execute-standard
        review: review-independent
    profiles:
        execute-complex:
            effort: high
            harness: codex_exec
            model: gpt-5.6-terra
            permission_preset: workspace-write-offline
            sandbox:
                mode: workspace-write
                network: false
            subagents:
                allowed: false
                max_concurrent: 0
        execute-fast:
            effort: low
            harness: codex_exec
            model: gpt-5.6-luna
            permission_preset: workspace-write-offline
            sandbox:
                mode: workspace-write
                network: false
            subagents:
                allowed: false
                max_concurrent: 0
        execute-frontier:
            effort: high
            harness: codex_exec
            model: gpt-5.6-terra
            permission_preset: workspace-write-offline
            sandbox:
                mode: workspace-write
                network: false
            subagents:
                allowed: false
                max_concurrent: 0
        execute-standard:
            effort: medium
            harness: codex_exec
            model: gpt-5.6-terra
            permission_preset: workspace-write-offline
            sandbox:
                mode: workspace-write
                network: false
            subagents:
                allowed: false
                max_concurrent: 0
        implementation-terra:
            effort: medium
            harness: codex_exec
            model: gpt-5.6-terra
            permission_preset: workspace-write-offline
            sandbox:
                mode: workspace-write
                network: false
            subagents:
                allowed: false
                max_concurrent: 0
        planner:
            effort: high
            harness: codex_exec
            model: gpt-5.6-sol
            permission_preset: workspace-write-offline
            sandbox:
                mode: workspace-write
                network: false
            subagents:
                allowed: false
                max_concurrent: 0
        repair-complex:
            effort: high
            harness: codex_exec
            model: gpt-5.6-terra
            permission_preset: workspace-write-offline
            sandbox:
                mode: workspace-write
                network: false
            subagents:
                allowed: false
                max_concurrent: 0
        review-independent:
            effort: high
            harness: codex_exec
            model: gpt-5.6-terra
            permission_preset: read-only
            sandbox:
                mode: read-only
                network: false
            subagents:
                allowed: false
                max_concurrent: 0
        reviewer-terra:
            effort: high
            harness: codex_exec
            model: gpt-5.6-terra
            permission_preset: read-only
            sandbox:
                mode: read-only
                network: false
            subagents:
                allowed: false
                max_concurrent: 0
    runners:
        claude-code:
            command: claude -p --output-format stream-json --input-format stream-json --permission-mode bypassPermissions
            kind: claude-code
        codex_exec:
            command: codex exec --json --skip-git-repo-check -
            kind: codex_exec
    trigger_states:
        - ready
        - rework
    workspace:
        root: workspaces
        strategy: worktree
project_id: tusker
branches:
    # Temporary immutable dogfood base. Restore `main` after the isolated wave.
    default_branch: srv1nc/factory-dogfood-base
runtime:
    lease_backend: local
    lease_ttl_minutes: 120
    mutation_mode: single_user_local
schema: tusker.config/v1
storage:
    attempts_root: .tusker/attempts
    events_root: .tusker/events
    evidence_root: .tusker/evidence
    generated_root: .tusker/_generated
    root: .tusker
