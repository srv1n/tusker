schema: tusker.config/v1
project_id: tusker

storage:
  root: .tusker
  generated_root: .tusker/_generated
  evidence_root: .tusker/evidence
  events_root: .tusker/events
  attempts_root: .tusker/attempts

runtime:
  lease_backend: local
  lease_ttl_minutes: 120
  mutation_mode: single_user_local

automation:
  # Automation is opt-in. Registration keeps status projections fresh; only
  # an explicit operator change may authorize daemon dispatch.
  enabled: false
  dispatch_scope: armed_waves
  completion_reactor:
    mode: disabled
  trigger_states: [ready, rework]
  default_runner: codex_exec
  enabled_runners: [codex_exec, claude-code]
  profiles:
    implementation-terra:
      harness: codex_exec
      model: gpt-5.6-terra
      effort: medium
      permission_preset: workspace-write-offline
      sandbox:
        mode: workspace-write
        network: false
      subagents:
        allowed: false
        max_concurrent: 0
    reviewer-terra:
      harness: codex_exec
      model: gpt-5.6-terra
      effort: high
      permission_preset: read-only
      sandbox:
        mode: read-only
        network: false
      subagents:
        allowed: false
        max_concurrent: 0
  default_profile: implementation-terra
  lane_profiles:
    execute: implementation-terra
    review: reviewer-terra
  workspace:
    strategy: worktree
    root: workspaces
  concurrency:
    max_active_runs: 2
    max_active_runs_per_project: 1
    max_concurrent_by_state:
      rework: 1
  runners:
    codex_exec:
      kind: codex_exec
      command: codex exec --json --skip-git-repo-check -
    claude-code:
      kind: claude-code
      command: claude -p --output-format stream-json --input-format stream-json --permission-mode bypassPermissions
  fanout:
    enabled: false
    max_children: 0
    allowed_child_types: []
    merge_rule: manual_review
