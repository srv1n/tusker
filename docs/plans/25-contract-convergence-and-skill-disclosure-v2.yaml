schema: tusker.delivery-plan/v2
scope: contract-convergence/v2
title: Contract convergence and skill disclosure
epic: ORC
spec_refs:
  - docs/specs/25-contract-convergence-and-skill-disclosure.md
context_fingerprint: sha256:43a4667a73144c629f58eb61c735c66331bdf1076f91864d8a351bd1f8f952d9
factory_intake_contract_schema: tusker.factory-intake-contract/v1
factory_intake_contract_version: 1.1.0
factory_intake_contract_fingerprint: sha256:15ec23480f22cb10b83bc945465abedd279e3954e777dcecb0815571799fbe18
summary: >-
  Separate inert planning, interactive ownership, unattended execution, fleet
  health, optional integrations, and skill disclosure into explicit typed
  contracts so operators never need to enable or arm unrelated authority to
  make progress.
non_goals:
  - >-
    Context, doctor, review, dry-run, and import are inert. This plan does not
    enable automation, arm a wave, start or install a daemon, dispatch a model,
    invoke a provider, move a ref, land, release, spend, or change credentials.
  - >-
    This plan does not repair the currently registered project fleet while
    authoring or importing its tasks.
  - >-
    This plan does not weaken unattended Start, wave authorization, runner,
    workspace, integration, release, or spending controls.
  - >-
    This plan does not replace the runtime store, universal work-session
    ownership, delivery-plan schema, or project knowledge skill.
requirements:
  - id: R1
    outcome: >-
      One typed readiness and blocker contract represents semantic validity,
      held import, interactive ownership, unattended configuration, wave
      authorization, runtime health, and optional integration health without
      guessing causes from prose.
  - id: R2
    outcome: >-
      Delivery review and held import remain usable with automation disabled
      and the daemon off, while Start alone owns unattended operational
      preflight.
  - id: R3
    outcome: >-
      User-opened interactive work ignores daemon-only authorization while
      retaining dependency, genuine human gate, ownership, revision, terminal,
      and workspace safety.
  - id: R4
    outcome: >-
      Fleet doctor and repair expose independent health dimensions, keep
      optional integration failures local, and never widen authority outside
      an explicit repair scope.
  - id: R5
    outcome: >-
      Binary capabilities, workflow support, operator skill source, generated
      installs, and factory contracts share machine-readable compatibility and
      provenance.
  - id: R6
    outcome: >-
      The always-loaded Tusker skill is a dense mode router, while plan, work,
      operate, and rare specialized guidance load only when selected.
  - id: R7
    outcome: >-
      Hermetic mixed-project fixtures prove the converged contract and its
      no-authority side effects across disabled, stale, missing, legacy, and
      partially configured states.
concurrency: 2
runner_profile: implementation-terra
tasks:
  - source_key: typed-readiness-contract
    requirement_refs: [R1]
    title: Define one typed readiness and blocker contract
    outcome: >-
      CLI and internal callers share a versioned readiness projection whose
      independent dimensions and structured blockers replace overloaded
      booleans and string-matched refusal codes.
    acceptance:
      - id: A1
        outcome: The contract independently reports contract, import, interactive, automation, authorization, runtime, and optional-integration readiness with provenance and no derived all-purpose project-ready boolean.
      - id: A2
        outcome: Every blocker has a stable kind, authority domain, affected task, gate, wave, project, or integration IDs, bounded reason, and exact safe remedy; dependency and human-gate causes are never inferred from substrings.
      - id: A3
        outcome: Compatibility adapters preserve existing CLI and Serve fields during migration while new consumers use the typed contract as the source of truth.
      - id: A4
        outcome: Constructing and projecting readiness is read-only and cannot mutate registry, automation, authorization, runtime, provider, Git, release, or spending state.
    verification:
      - covers: A1,A2,A3,A4
        check: "command: go test ./cmd/tusker -run '^TestReadinessContract$' -count=1"
    artifact:
      kind: request_response
      path: cmd/tusker/readiness_contract_test.go
      summary: Versioned JSON fixtures for every readiness dimension, blocker kind, legacy projection, provenance, and no-side-effect boundary.
      acceptance_ids: [A1, A2, A3, A4]
    owned_paths:
      - cmd/tusker/readiness_contract.go
      - cmd/tusker/readiness_contract_test.go
      - cmd/tusker/errors.go
    concurrency_group: contract-foundation
    risk: critical
    priority: p0
    size: m
    domains: [project]

  - source_key: delivery-phase-separation
    requirement_refs: [R2]
    title: Separate delivery review, held import, and Start readiness
    outcome: >-
      A valid plan can be reviewed and imported held without unattended
      infrastructure, while Start remains the only transaction that requires
      operational readiness and exact human-confirmed authority.
    acceptance:
      - id: A1
        outcome: Delivery review returns a successful read-only projection for a semantically valid plan and reports planValid, importReady, and startReady separately even when the project is disabled, the daemon is off, the runner is unavailable, the wave is disarmed, or the integration lane is dirty.
      - id: A2
        outcome: Dry-run and held import validate only contract, bounded context, stable scope, existing held lineage, and atomic write safety, and they create or reconcile held disarmed records without requiring automation or daemon readiness.
      - id: A3
        outcome: Invalid plans and unsafe import material still fail with typed contract or import blockers, while operational Start blockers never masquerade as review or import failure.
      - id: A4
        outcome: Start revalidates the exact plan and context fingerprints and retains project, daemon, runner, approval, workspace, integration, and authorization preflight with transactional refusal and replay behavior.
      - id: A5
        outcome: CLI JSON and Serve consume the same phase projection and no review or import path enables, arms, starts, dispatches, calls a provider, moves a ref, releases, or spends.
    verification:
      - covers: A1,A2,A3,A4,A5
        check: "command: go test ./cmd/tusker -run '^TestDeliveryPhaseReadinessSeparation$' -count=1"
    dependencies:
      - task: typed-readiness-contract
        kind: hard
    artifact:
      kind: behavior_matrix
      path: cmd/tusker/delivery_phase_readiness_test.go
      summary: Valid, invalid, disabled, daemon-off, runner-blocked, disarmed, dirty-integration, held-import, Start-refusal, replay, and no-side-effect phase matrix.
      acceptance_ids: [A1, A2, A3, A4, A5]
    owned_paths:
      - cmd/tusker/delivery_review_cmd.go
      - cmd/tusker/delivery_cmd.go
      - cmd/tusker/delivery_start_cmd.go
      - cmd/tusker/serve_delivery.go
      - cmd/tusker/serve_types.go
      - cmd/tusker/delivery_phase_readiness_test.go
      - cmd/tusker/delivery_review_cmd_test.go
      - cmd/tusker/delivery_start_cmd_test.go
      - cmd/tusker/delivery_v2_test.go
    concurrency_group: delivery-phases
    risk: critical
    priority: p0
    size: l
    domains: [project]

  - source_key: interactive-readiness-separation
    requirement_refs: [R3]
    title: Isolate interactive work admission from daemon dispatch authority
    outcome: >-
      The universal work-session protocol admits user-directed work using
      interactive safety facts only and returns typed dependency, gate,
      ownership, terminal, and workspace refusals.
    acceptance:
      - id: A1
        outcome: Interactive work start ignores registry polling state, automation enablement, daemon liveness, wave authorization, and automated critical-risk dispatch policy while still requiring ready or rework task state and a safe exact workspace.
      - id: A2
        outcome: Unsatisfied dependencies, genuine open human gates, terminal state, healthy owners, owned-path conflicts, stale revisions, and unsafe workspaces each return their exact typed cause, affected IDs, and remedy.
      - id: A3
        outcome: A dependency message that contains the words gate or human remains a dependency blocker, and no blocker code depends on prose ordering or substring matching.
      - id: A4
        outcome: Opening or refusing an interactive session cannot enable automation, arm a wave, start a daemon, launch a worker, authorize another task, move a ref, release, call a provider, or spend.
      - id: A5
        outcome: Existing work-session owner, revision, lease, identity, heartbeat, submit, fail, release, and dead-holder reclaim semantics remain unchanged.
    verification:
      - covers: A1,A2,A3,A4,A5
        check: "command: go test ./cmd/tusker -run '^TestInteractiveWorkReadinessSeparation$' -count=1"
    dependencies:
      - task: typed-readiness-contract
        kind: hard
    artifact:
      kind: behavior_matrix
      path: cmd/tusker/interactive_work_readiness_test.go
      summary: Disabled, daemon-off, disarmed, critical, dependency, human-gate, owner, revision, terminal, workspace, reclaim, and no-spawn admission matrix.
      acceptance_ids: [A1, A2, A3, A4, A5]
    owned_paths:
      - cmd/tusker/automation_commands.go
      - cmd/tusker/commands_v7.go
      - cmd/tusker/work_session_cmd.go
      - cmd/tusker/work_session_cmd_test.go
      - cmd/tusker/interactive_work_readiness_test.go
    concurrency_group: interactive-admission
    risk: critical
    priority: p0
    size: m
    domains: [project]

  - source_key: fleet-health-and-scoped-repair
    requirement_refs: [R4]
    title: Split fleet health and repair into explicit authority scopes
    outcome: >-
      Setup and rollout diagnostics preserve every finding but quarantine only
      incompatible core state, and repair changes only the explicitly selected
      core, automation, service, or integration scope.
    acceptance:
      - id: A1
        outcome: Fleet output reports core compatibility, interactive readiness, automation configuration, wave authorization, runtime health, and optional integrations independently for every registered project and once for the managed service.
      - id: A2
        outcome: Missing vaults and incompatible core schemas may quarantine core work, while stale or missing optional handoff and provider contracts block only workflows that require those integrations.
      - id: A3
        outcome: Core repair is the default and changes only deterministic core files or generated installs; automation, service, and integration repair require their explicit scopes.
      - id: A4
        outcome: No repair scope enables project automation, arms a wave, changes credentials, invokes a provider, moves a ref, releases, or spends, and service start remains a separate explicit operation.
      - id: A5
        outcome: Repeated doctor and repair converge idempotently across healthy, disabled, missing-vault, missing-skill, legacy-runner, stale-optional-provider, stale-service, and mixed sibling fixtures without one project blocking unrelated siblings.
    verification:
      - covers: A1,A2,A3,A4,A5
        check: "command: go test ./cmd/tusker -run '^TestFleetHealthDimensions$' -count=1"
      - covers: A3,A4,A5
        check: "command: go test ./cmd/tusker -run '^TestScopedFleetRepair$' -count=1"
    dependencies:
      - task: typed-readiness-contract
        kind: hard
    artifact:
      kind: request_response
      path: cmd/tusker/delivery_rollout_scope_test.go
      summary: Doctor and repair JSON fixtures for every health dimension, quarantine boundary, scope, idempotent repair, sibling isolation, and no-authority side effect.
      acceptance_ids: [A1, A2, A3, A4, A5]
    owned_paths:
      - cmd/tusker/setup_doctor.go
      - cmd/tusker/setup_doctor_test.go
      - cmd/tusker/delivery_rollout.go
      - cmd/tusker/delivery_rollout_test.go
      - cmd/tusker/delivery_rollout_scope_test.go
      - cmd/tusker/project_loader.go
    concurrency_group: fleet-convergence
    risk: high
    priority: p0
    size: l
    domains: [project]

  - source_key: skill-contract-and-progressive-disclosure
    requirement_refs: [R5, R6]
    title: Ship lockstep compatibility and a compact progressive-disclosure skill
    outcome: >-
      Tusker publishes one machine-readable compatibility contract and installs
      a small trigger-complete router whose plan, work, operate, and rare
      specialized guidance loads only when selected.
    acceptance:
      - id: A1
        outcome: Capabilities expose one versioned compatibility fingerprint covering binary command/schema support, workflow range, factory contracts, canonical skill source, and generated install provenance without relying on prose frontmatter metadata.
      - id: A2
        outcome: Skill sync, copy, bundle, setup doctor, and rollout doctor distinguish current, stale, missing, incompatible, and locally modified installs and provide one deterministic repair without changing project knowledge or authority.
      - id: A3
        outcome: SKILL.md frontmatter contains only name and a trigger-complete description, and its body is at most 900 words and 140 lines while retaining capability check, mode routing, universal authority boundaries, hard stop, and one compact loop.
      - id: A4
        outcome: PLAN.md owns planning, review, import, and Start guidance; WORK.md owns interactive and dispatched implementation, proof, and human-wait guidance; OPERATE.md owns daemon, wave, review, integration, and recovery guidance; rare topics remain direct one-hop routes.
      - id: A5
        outcome: Every normative rule has one owning file, removed legacy references leave no broken links, primary mode guides do not require recursive reference loading, and generated installs exactly match canonical source.
      - id: A6
        outcome: Representative planning, interactive, dispatched-worker, dispatched-reviewer, human-wait, onboarding, and Xcode prompts select only the required guides and stay within recorded word and loaded-context budgets without losing safety behavior.
    verification:
      - covers: A1,A2
        check: "command: go test ./cmd/tusker -run '^TestSkillContractCompatibility$' -count=1"
      - covers: A3,A4,A5,A6
        check: "command: go test ./cmd/tusker -run '^TestTuskerSkillProgressiveDisclosure$' -count=1"
      - covers: A2,A3,A4,A5,A6
        check: "command: make skill-doctor"
    dependencies:
      - task: fleet-health-and-scoped-repair
        kind: hard
    artifact:
      kind: benchmark
      path: skills/tusker/testdata/progressive-disclosure-budget.json
      summary: Router size, one-hop route, duplicated-rule, broken-link, generated-install, and representative-prompt loaded-context results.
      acceptance_ids: [A1, A2, A3, A4, A5, A6]
    owned_paths:
      - cmd/tusker/capabilities_cmd.go
      - cmd/tusker/skill_lifecycle.go
      - cmd/tusker/skill_lifecycle_test.go
      - skills/tusker/SKILL.md
      - skills/tusker/references
      - skills/tusker/testdata/progressive-disclosure-budget.json
    concurrency_group: skill-disclosure
    risk: high
    priority: p0
    size: l
    domains: [project]

  - source_key: contract-convergence-e2e
    requirement_refs: [R7]
    title: Prove contract convergence across disabled and mixed project states
    outcome: >-
      A hermetic fleet scenario proves inert review/import, direct interactive
      ownership, strict unattended Start, scoped repair, compatible skill
      distribution, and complete no-authority boundaries together.
    acceptance:
      - id: A1
        outcome: A valid plan reviews and imports held in a registered disabled project with no daemon, while unattended Start remains blocked until exact project, daemon, runner, workspace, integration, and authorization facts pass.
      - id: A2
        outcome: Interactive work opens on a disarmed critical wave without daemon authority, exact dependency and human-gate blockers remain distinct, and ownership, revision, workspace, submit, fail, release, and reclaim behavior stays correct.
      - id: A3
        outcome: A mixed fleet containing missing vault, missing skill, legacy runner, stale optional provider, disabled project, and stale service reports independent dimensions and core-only repair leaves optional, automation, and service state untouched.
      - id: A4
        outcome: Symlink, copy, bundle, stale, locally modified, and incompatible binary-skill fixtures converge through the exact supported repair and load only the selected skill guides.
      - id: A5
        outcome: The complete fixture proves no automation enablement, daemon start or install, wave arm, model dispatch, provider invocation, secret read, credential change, ref movement, landing, release, or spending side effect.
      - id: A6
        outcome: System documentation and project canon describe the phase, readiness, repair-scope, compatibility, and progressive-disclosure boundaries without duplicating the operator guides.
    verification:
      - covers: A1,A2,A3,A4,A5
        check: "command: go test ./e2e/contractconvergence -run '^TestContractConvergence$' -count=1"
      - covers: A6
        check: "command: tusker skill doctor --strict --json && tusker validate --json"
    dependencies:
      - task: delivery-phase-separation
        kind: hard
      - task: interactive-readiness-separation
        kind: hard
      - task: skill-contract-and-progressive-disclosure
        kind: hard
    artifact:
      kind: reliability_timeline
      path: e2e/contractconvergence/contract_convergence_test.go
      summary: Disabled review/import, direct work, strict Start, mixed-fleet doctor/repair, skill provenance, loaded-context, and no-authority convergence timeline.
      acceptance_ids: [A1, A2, A3, A4, A5, A6]
    owned_paths:
      - e2e/contractconvergence
      - docs/system/orchestration.md
      - docs/system/cli.md
      - docs/agent-workflow.md
      - .tusker/knowledge/domains/project/CANON.md
    concurrency_group: contract-e2e
    risk: critical
    priority: p0
    size: l
    domains: [project]
