schema: tusker.delivery-plan/v2
scope: cross-scope-factory-convergence/v1
title: Cross-scope factory convergence
epic: ORC
spec_refs:
  - docs/specs/16-cross-scope-factory-convergence.md
context_fingerprint: sha256:034b902acefd0de297de11bc605e2b5e7704bd32042c9e3de1541ac68d3fb414
factory_intake_contract_schema: tusker.factory-intake-contract/v1
factory_intake_contract_version: 1.1.0
factory_intake_contract_fingerprint: sha256:0704d5ee907d738c496512b5ae948e96590a7b732c4ab774bee1de1429b5b13c
summary: >-
  Add scope-qualified V2 dependencies that converge into ordinary durable
  task-ID edges, validate globally and atomically, remain reviewable, and do
  not grant automation, runtime, release, or human authority.
non_goals:
  - This delivery does not enable automation, arm a wave, start a daemon, dispatch work, or modify task state merely by planning or import.
  - V1 plans and V1 dependency semantics remain untouched.
  - This delivery does not add cross-project or cross-vault dependencies, automatic producer imports, arbitrary task-ID authoring, release, runtime setup, or paid authority.
requirements:
  - id: R1
    outcome: V2 plans can name a stable producer task in another scope without replacing the durable task-ID dependency model.
  - id: R2
    outcome: Cross-scope import globally validates and atomically converges under concurrent producer/consumer changes without cycles, stale targets, inbound stranding, or partial writes.
  - id: R3
    outcome: Preflight, eligibility, and gate ordering retain default-off authority boundaries while correctly projecting cross-scope dependency state.
  - id: R4
    outcome: Review and Serve show an operator both the semantic producer and durable task target with one actionable blocker or repair.
  - id: R5
    outcome: Plans 12, 14, and 15 retain independent shadow implementation while a new Plan 17 convergence scope composes their producer shadow tasks into an explicit, human-gated authority and release path.
  - id: R6
    outcome: A temporary-vault end-to-end fixture proves convergence, failure handling, and no-side-effect boundaries without a live daemon or external runtime.
concurrency: 2
runner_profile: implementation-terra
tasks:
  - source_key: cross-scope-import-core
    requirement_refs: [R1, R2]
    title: Resolve qualified V2 dependencies into atomic durable edges
    outcome: >-
      V2 accepts an optional hard dependency scope, resolves the exact
      scope/source-key producer before consumer import, writes the ordinary
      durable ID edge plus provenance, and atomically protects the global graph
      against cycles, inbound removal, stale targets, and material-epoch races.
    acceptance:
      - id: A1
        outcome: A missing dependency scope preserves local hard/soft V2 behavior, while a qualified edge must be hard and resolves exactly one non-obsolete same-vault producer by delivery plan scope and source key; V1 decode and behavior are unchanged.
      - id: A2
        outcome: Imported consumer records retain a normal task-ID edge for runtime eligibility plus a `delivery_cross_scope_dependencies` projection containing scope, source key, task ID, hard kind, and target contract fingerprint, and re-import is idempotent without dynamic rebinding or persisted target state revision.
      - id: A3
        outcome: Producer-before-consumer import, global all-edge cycle detection, inbound-removal refusal, stale-target detection, lock/CAS material epochs, rollback, and crash/replay leave no dangling, partial, or silently rebound edge.
    verification:
      - covers: A1,A2,A3
        check: "command: go test ./cmd/tusker -run '^(TestDeliveryCrossScopeImport|TestDeliveryCrossScopeAtomicity|TestDeliveryPlanV1)' -count=1"
    artifact:
      kind: reliability_summary
      path: cmd/tusker/delivery_cross_scope_import_test.go
      summary: Local/qualified resolution, durable/provenance projection, producer ordering, global cycles, inbound removal, stale epoch, rollback, and replay matrix.
      acceptance_ids: [A1, A2, A3]
    owned_paths:
      - cmd/tusker/delivery_cmd.go
      - cmd/tusker/delivery_v2.go
      - cmd/tusker/delivery_cross_scope.go
      - cmd/tusker/delivery_cross_scope_import_test.go
      - cmd/tusker/delivery_doctor.go
      - cmd/tusker/delivery_doctor_test.go
      - cmd/tusker/v7_dependencies.go
      - cmd/tusker/v7_document_write.go
      - cmd/tusker/commands_v7.go
      - internal/v7schema/schema.go
    concurrency_group: cross-scope-core
    risk: critical
    priority: p0
    size: xl
    domains: [project]

  - source_key: cross-scope-preflight-gates
    requirement_refs: [R3]
    title: Preserve cross-scope preflight, eligibility, and gate boundaries
    outcome: >-
      Valid waves can arm with incomplete cross-scope producers while the exact
      consumer remains blocked, setup gates stay usable, and auth or release
      gates cannot be satisfied ahead of their hard dependency closure.
    acceptance:
      - id: A1
        outcome: Wave preflight validates qualified-edge integrity and may arm an otherwise healthy wave even when its producer is incomplete, but no blocked consumer can claim until its ordinary hard edge is satisfied.
      - id: A2
        outcome: Producer failure, discard, stale target material, and recovery project stable cross-scope blockers only through affected consumers, without changing unrelated eligibility.
      - id: A3
        outcome: Every CLI/API/Serve gate path refuses auth and release satisfaction before hard dependencies complete, invalidates affected authority receipts after material drift, and still permits non-authorizing setup gates.
    verification:
      - covers: A1,A2,A3
        check: "command: go test ./cmd/tusker -run '^(TestCrossScopeWavePreflight|TestCrossScopeDependencyEligibility|TestCrossScopeGateOrdering)' -count=1"
    dependencies:
      - task: cross-scope-import-core
        kind: hard
    artifact:
      kind: behavior_matrix
      path: cmd/tusker/cross_scope_preflight_gate_test.go
      summary: Armed-but-blocked, producer terminal paths, unaffected frontier, setup, auth, release, stale-receipt, and no-authority-escalation matrix.
      acceptance_ids: [A1, A2, A3]
    owned_paths:
      - cmd/tusker/v7_wave_authorization.go
      - cmd/tusker/v7_dependencies.go
      - cmd/tusker/v7_control_cmd.go
      - cmd/tusker/delivery_start_cmd.go
      - cmd/tusker/cross_scope_preflight_gate_test.go
    concurrency_group: cross-scope-policy
    risk: critical
    priority: p0
    size: l
    domains: [project]

  - source_key: cross-scope-review-surface
    requirement_refs: [R4]
    title: Show semantic and durable cross-scope targets in review
    outcome: >-
      Delivery review, status, packets, and Serve expose the producer scope and
      source key alongside the durable target ID, its state, and one exact
      structural or lifecycle repair.
    acceptance:
      - id: A1
        outcome: Delivery review and preflight render every qualified hard edge as semantic scope/source-key plus durable task ID, kind, persisted contract provenance, live producer state, and producer-before-consumer implications.
      - id: A2
        outcome: Status, packet, JSON, and Serve distinguish missing/corrupt structural targets from incomplete/failed lifecycle targets and expose one stable actionable remedy without raw frontmatter.
      - id: A3
        outcome: Review and projection remain read-only and never arm waves, satisfy gates, enable automation, or otherwise change authority.
    verification:
      - covers: A1,A2,A3
        check: "command: go test ./cmd/tusker -run '^(TestDeliveryCrossScopeReview|TestServeCrossScopeDependencies|TestCrossScopeStatusProjection)' -count=1"
    dependencies:
      - task: cross-scope-import-core
        kind: hard
    artifact:
      kind: behavior_matrix
      path: cmd/tusker/delivery_cross_scope_review_test.go
      summary: CLI, JSON, packet, and Serve fixtures for resolved, incomplete, missing, corrupt, stale, and no-side-effect cross-scope dependency projections.
      acceptance_ids: [A1, A2, A3]
    owned_paths:
      - cmd/tusker/delivery_review_cmd.go
      - cmd/tusker/serve_delivery.go
      - cmd/tusker/serve_types.go
      - cmd/tusker/v7_migration_cmd.go
      - cmd/tusker/commands_show.go
      - cmd/tusker/delivery_cross_scope_review_test.go
      - internal/serve/ui/src
      - internal/serve/ui/tests/cross-scope-dependencies.test.ts
    concurrency_group: cross-scope-review
    risk: high
    priority: p0
    size: l
    domains: [project]

  - source_key: rewire-program-cutover-convergence
    requirement_refs: [R5]
    title: Rewire independent shadow plans into Plan 17 program convergence
    outcome: >-
      Existing scheduled-promotion, full-gate-provider, and factory-control
      plans retain independent shadow implementation while a new Plan 17,
      imported last, composes their producers into explicit human-gated dogfood
      and release handoff without changing default-off policy.
    acceptance:
      - id: A1
        outcome: Plans 12 and 14 expose independent default-off shadow producers, and plan 15 exposes provider-doctor shadow readiness without a runtime while retaining provider-live-smoke as setup-gated promote readiness rather than a misleading shadow-ready node.
      - id: A2
        outcome: New Plan 17 contains producer shadow tasks to shadow-convergence to low-risk-authoritative-dogfood with the human auth gate to production-promotion-handoff with the human release gate, and provider-live-smoke hard-gates the dogfood task.
      - id: A3
        outcome: Plans 12, 14, and 15 are reviewed/imported before Plan 17, old plan-12/plan-14 authority gates move or become obsolete only in that reviewed migration, all four plans doctor clean under the new schema, and plan edits are serialized because this task owns their shared delivery contracts.
    verification:
      - covers: A1,A2,A3
        check: "command: go test ./cmd/tusker -run '^TestCrossScopePlanRewiring' -count=1"
    dependencies:
      - task: cross-scope-preflight-gates
        kind: hard
      - task: cross-scope-review-surface
        kind: hard
    artifact:
      kind: diff_summary
      path: docs/plans/17-program-cutover-convergence-v2.yaml
      summary: Serialized independent-shadow and Plan-17-last convergence topology with exact hard qualified dependencies, provider live-smoke gating, and preserved default-off gates.
      acceptance_ids: [A1, A2, A3]
    owned_paths:
      - docs/plans/12-opt-in-scheduled-promotion-v2.yaml
      - docs/plans/14-opt-in-factory-execution-control-v2.yaml
      - docs/plans/15-opt-in-full-gate-lifecycle-provider-v2.yaml
      - docs/specs/17-program-cutover-convergence.md
      - docs/plans/17-program-cutover-convergence-v2.yaml
      - cmd/tusker/cross_scope_plan_rewiring_test.go
    concurrency_group: cross-scope-plan-rewire
    risk: critical
    priority: p0
    size: m
    domains: [project]

  - source_key: cross-scope-temp-vault-e2e
    requirement_refs: [R6]
    title: Prove cross-scope convergence end to end in a temporary vault
    outcome: >-
      A hermetic temporary-vault scenario proves producer-first composition,
      durable convergence, global failure handling, wave/gate ordering, review
      projection, and all default-off no-side-effect guarantees.
    acceptance:
      - id: A1
        outcome: A two- and three-scope fixture imports producers before consumers, converges repeated imports to one durable graph, arms valid waves with blocked consumers, and unlocks only the affected hard closure after integration.
      - id: A2
        outcome: Cross-scope soft-kind rejection, cycle, missing/duplicate producer, inbound removal, stale epoch, concurrent import, crash/replay, discarded producer, auth/release-before-hard-dependency, and setup-before-hard-dependency fixtures each yield the exact safe result.
      - id: A3
        outcome: CLI/JSON/Serve fixtures show semantic and durable targets, while the entire fixture proves no daemon start, automation enablement, wave arm outside the explicit fixture action, runtime setup, release, ref movement, or paid action.
    verification:
      - covers: A1,A2,A3
        check: "command: go test ./e2e/... -run '^TestCrossScopeFactoryConvergence$' -count=1"
    dependencies:
      - task: rewire-program-cutover-convergence
        kind: hard
    artifact:
      kind: reliability_timeline
      path: e2e/cross_scope_factory_convergence_test.go
      summary: Hermetic producer/import/arm/block/unlock/re-import/failure/gate/review timeline with explicit no-authority side-effect assertions.
      acceptance_ids: [A1, A2, A3]
    owned_paths:
      - e2e/cross_scope_factory_convergence_test.go
      - cmd/tusker/testdata/cross_scope_factory
    concurrency_group: cross-scope-e2e
    risk: critical
    priority: p0
    size: l
    domains: [project]
