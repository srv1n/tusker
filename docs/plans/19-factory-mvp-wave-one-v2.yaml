schema: tusker.delivery-plan/v2
scope: factory-mvp-wave-one/v2
title: Factory MVP wave one
epic: ORC
spec_refs:
  - docs/specs/19-factory-mvp-wave-one.md
context_fingerprint: sha256:199e5ebd355919b38f2f6bef273355abe9f3def31251c99f8e3aa672d128057e
factory_intake_contract_schema: tusker.factory-intake-contract/v1
factory_intake_contract_version: 1.1.0
factory_intake_contract_fingerprint: sha256:0704d5ee907d738c496512b5ae948e96590a7b732c4ab774bee1de1429b5b13c
summary: >-
  Keep authoring and import inert, then—only after separately approved isolation
  and activation—run one Terra-medium implementation task through bounded,
  read-only Terra-high review and authoritative staging completion.
non_goals:
  - >-
    Authoring, context, doctor, review, dry-run, and import are inert. They do
    not enable/register a project, alter global registry state, arm a wave,
    start/install a daemon, dispatch or claim a worker, move a ref, release,
    spend, configure provider credentials, or push.
  - >-
    The worker never enables either automation toggle, disables/restores an
    unrelated project, arms its wave, starts/stops a daemon or service, installs
    a binary, changes completion or promotion configuration, or imports this
    plan. Those are explicit human/coordinator actions outside task work.
  - >-
    No all_eligible dispatch, second project, extra implementation/triage/
    provider/release attempt, provider credential, release, or default-ref
    promotion is in scope. Scheduled promotion remains disabled.
requirements:
  - id: R1
    outcome: One separately approved `implementation-terra` (Terra medium) attempt, under an explicit launch-count and token ceiling, writes the durable first-run report and records passing focused operations and execution-control tests.
  - id: R2
    outcome: The report records the exact separately approved one-project enable/arm/start tuple, pre-run isolation audit, both automation toggles, authoritative staging configuration, and read-only operations/automation/daemon/wave state.
  - id: R3
    outcome: The attempt is followed only by separately approved, configured bounded `reviewer-terra` (Terra high, read-only) review cycles, capped at three; deterministic authoritative staging completion, including any integration-ref advance, is observed only by a separate coordinator after review. `main` never moves.
concurrency: 1
runner_profile: implementation-terra
tasks:
  - source_key: capture-first-run-readiness
    requirement_refs: [R1, R2, R3]
    title: Capture factory MVP first-run readiness
    outcome: >-
      Once the human-approved cutover sequence has enabled only the Tusker
      project, started a managed daemon that is alive and reconciling while all
      existing waves remain disarmed, then armed the exact singleton wave, one
      Terra-medium implementation attempt writes the durable report from
      focused checks and read-only state. It submits for configured bounded
      Terra-high read-only review; it neither completes nor stages itself.
    acceptance:
      - id: A1
        outcome: The worker-owned report records passing focused `TestFactoryOperationsProjection` and `TestFactoryExecutionControl` commands from exactly one Terra-medium implementation attempt and the configured Terra-high read-only review cap (at most three cycles).
      - id: A2
        outcome: The report records the approved enable/arm/start/dispatch tuple for only prospective `ORC-T-0051` in prospective `W-0005`, the one-time global isolation diagnostics, both automation toggles, authoritative completion-reactor staging, disabled scheduled promotion, and repository-built read-only setup/skill/validate/projects/factory/automation/daemon/service/wave surfaces.
      - id: A3
        outcome: The report proves no broad dispatch, unrelated claim/project, provider credential, release, default-ref movement, or extra implementation/triage/provider/release attempt occurred during worker work. `main` snapshots are mandatory; `integration/W-0005` snapshots are optional worker context only. Actual review verdict, deterministic completion, and any staging-ref advance belong exclusively to a later coordinator check.
    verification:
      - covers: A1
        check: "command: go test ./cmd/tusker -run '^TestFactoryOperationsProjection$' -count=1 && go test ./cmd/tusker -run '^TestFactoryExecutionControl$' -count=1"
      - covers: A2,A3
        check: |-
          command: sh -ceu '
          dry=$(go run ./cmd/tusker delivery import --plan docs/plans/19-factory-mvp-wave-one-v2.yaml --dry-run --json)
          printf "%s" "$dry" | grep -F '"waveId":"W-0005"' >/dev/null
          printf "%s" "$dry" | grep -F '"capture-first-run-readiness":"ORC-T-0051"' >/dev/null
          before_main=$(git rev-parse main)
          before_integration=""
          if git show-ref --verify --quiet refs/heads/integration/W-0005; then before_integration=$(git rev-parse integration/W-0005); fi
          before_run=$(go run ./cmd/tusker runs inspect ORC-T-0051 --json)
          before_queue=$(go run ./cmd/tusker automation queue --repo . --json)
          go run ./cmd/tusker setup doctor --repo . --json
          go run ./cmd/tusker skill doctor --strict --json
          validate_rc=0; go run ./cmd/tusker validate --json || validate_rc=$?
          go run ./cmd/tusker projects list --json
          go run ./cmd/tusker factory operations --json
          go run ./cmd/tusker automation status --json
          go run ./cmd/tusker daemon status --json
          go run ./cmd/tusker daemon service status --json
          go run ./cmd/tusker wave brief W-0005 --json
          preflight=$(go run ./cmd/tusker wave preflight W-0005 --json)
          printf "%s" "$preflight" | grep -F '"ok":true' >/dev/null
          after_run=$(go run ./cmd/tusker runs inspect ORC-T-0051 --json)
          after_queue=$(go run ./cmd/tusker automation queue --repo . --json)
          after_main=$(git rev-parse main)
          test "$before_main" = "$after_main"
          after_integration=$(git rev-parse --verify integration/W-0005 2>/dev/null || true)
          test "$before_integration" = "$after_integration"
          printf "%s\n%s" "$before_run" "$after_run" | grep -F 'ORC-T-0051' >/dev/null
          ! printf "%s" "$before_queue" | grep -F 'all_eligible' >/dev/null
          ! printf "%s" "$after_queue" | grep -F 'all_eligible' >/dev/null
          printf "%s" "$before_queue" | grep -F '"effective":"armed_waves"' >/dev/null
          printf "%s" "$after_queue" | grep -F '"effective":"armed_waves"' >/dev/null
          printf "%s" "$before_queue" | grep -F '"active_runs":1' >/dev/null
          printf "%s" "$after_queue" | grep -F '"active_runs":1' >/dev/null
          printf "validate_exit=%s\n" "$validate_rc"
          '
    artifact:
      kind: document
      path: docs/reports/factory-mvp-first-run.md
      summary: Exact V2 dry-run mapping; approved isolation/activation tuple; focused proof; read-only state; worker-only ref boundary; configured review policy; and coordinator-only completion handoff.
      acceptance_ids: [A1, A2, A3]
    owned_paths:
      - docs/reports/factory-mvp-first-run.md
    concurrency_group: factory-mvp-wave-one
    risk: low
    priority: p1
    size: s
    domains: [project]
