schema: tusker.delivery-plan/v2
scope: scheduled-promotion/v1
title: Opt-in scheduled promotion
epic: ORC
spec_refs:
  - docs/specs/12-opt-in-scheduled-promotion.md
context_fingerprint: sha256:582f6ab2768bc69e164d9175c2236ba8f72d227d314b15940784ef88b7d48c00
factory_intake_contract_schema: tusker.factory-intake-contract/v1
factory_intake_contract_version: 1.1.0
factory_intake_contract_fingerprint: sha256:0704d5ee907d738c496512b5ae948e96590a7b732c4ab774bee1de1429b5b13c
summary: Migrate the default-off scheduled-promotion delivery wave to a requirement-traceable V2 contract without granting release, spending, notification, or production authority.
non_goals:
  - This migration does not enable scheduled promotion, release, paid model triage, notifications, or default-branch movement.
  - Release credentials, spending, and notification delivery remain separately opt-in contracts.
requirements:
  - id: R1
    outcome: Scheduled-promotion policy, planning, and timetabling remain default-off, explainable, and incapable of widening authority.
  - id: R2
    outcome: Delivery staging and promotion preserve exact candidate, recovery, and resource safety without duplicate effects.
  - id: R3
    outcome: Paid failure triage and release remain explicitly configured capabilities with bounded authority and no implicit turn-on.
  - id: R4
    outcome: Operators and agents receive truthful scheduled-promotion status, notification, and guidance without granting operational authority.
  - id: R5
    outcome: Shadow parity, rollback readiness, and an explicit human authority transfer bound legacy-conductor replacement.
concurrency: 2
runner_profile: implementation-terra
tasks:
  - source_key: opt-in-policy
    requirement_refs: [R1]
    title: Define the default-off scheduled-promotion policy
    outcome: A versioned workflow contract exposes monotone disabled, shadow, stage, and promote modes while release and paid triage remain separately authorized.
    acceptance:
      - id: A1
        outcome: Absent scheduled-promotion configuration preserves current behavior and causes no scheduling, Git access, model launch, ref mutation, release, or feature-generated runtime record.
      - id: A2
        outcome: The configured mode grants only its documented monotone permissions, and enabling promotion cannot enable release or paid model triage.
      - id: A3
        outcome: Invalid or contradictory combinations fail validation with a stable cause and actionable remedy.
      - id: A4
        outcome: Fresh initialization and migration preserve a disabled default and expose effective mode provenance through configuration inspection.
    verification:
      - covers: A1,A2,A3,A4
        check: "command: go test ./cmd/tusker -run '^TestScheduledPromotionPolicy' -count=1"
    artifact:
      kind: behavior_matrix
      path: cmd/tusker/workflow_validate_test.go
      summary: Default-off and permission-mode behavior matrix covering absent, disabled, shadow, stage, promote, release, and triage combinations.
      acceptance_ids: [A1, A2, A3, A4]
    owned_paths:
      - cmd/tusker/workflow.go
      - cmd/tusker/workflow_validate.go
      - cmd/tusker/workflow_validate_test.go
      - cmd/tusker/config.go
      - cmd/tusker/config_test.go
    concurrency_group: foundation
    risk: high
    priority: p0
    size: l
    domains: [project]

  - source_key: departure-runtime-store
    requirement_refs: [R2]
    title: Persist restart-safe departure runs
    outcome: The runtime store owns first-class idempotent departure records instead of representing scheduled system work as fake task attempts.
    acceptance:
      - id: A1
        outcome: A departure record captures project, policy, scheduled window, state, candidate fingerprints, gate, promotion, release, skip or block reason, and model invocation count.
      - id: A2
        outcome: A uniqueness constraint prevents duplicate departure creation for the same project, policy, and scheduled window across concurrent triggers and daemon restarts.
      - id: A3
        outcome: State transitions use compare-and-swap semantics and reject stale writers without losing the winning terminal result.
      - id: A4
        outcome: Startup reconciliation classifies incomplete states as safely resumable or explicitly blocked and never repeats an already committed ref or release action.
    verification:
      - covers: A1,A2,A3,A4
        check: "command: go test ./cmd/tusker -run '^TestDepartureRunStore' -count=1"
    artifact:
      kind: reliability_summary
      path: cmd/tusker/departure_store_test.go
      summary: Persistence, duplicate-trigger, stale-writer, and restart-recovery reliability proof for departure runs.
      acceptance_ids: [A1, A2, A3, A4]
    owned_paths:
      - cmd/tusker/runtime_store.go
      - cmd/tusker/departure_store.go
      - cmd/tusker/departure_store_test.go
    concurrency_group: foundation
    risk: high
    priority: p0
    size: l
    domains: [project]

  - source_key: shadow-planner-cli
    requirement_refs: [R1]
    title: Build the deterministic shadow planner and CLI
    outcome: Operators can inspect an immutable, model-free departure decision with typed reasons before authorizing staging or promotion.
    acceptance:
      - id: A1
        outcome: The planner snapshots task state revisions, source SHAs, wave authorization, integration and default refs, proof fingerprints, gate intent, resource needs, and release eligibility.
      - id: A2
        outcome: Disabled mode returns a clear disabled decision without Git fetch, mutation, model invocation, or a durable departure run.
      - id: A3
        outcome: Shadow mode may refresh configured remote refs under a bounded timeout but cannot mutate Git refs, task or wave records, gates, external systems, or launch paid work.
      - id: A4
        outcome: Offline or failed fetch is indeterminate or blocked, never reported as empty cargo.
      - id: A5
        outcome: Check, status, and bounded history commands emit stable JSON and concise product-language terminal output.
    verification:
      - covers: A1,A2,A3,A4
        check: "command: go test ./cmd/tusker -run '^TestDeparturePlanner' -count=1"
      - covers: A5
        check: "command: go test ./cmd/tusker -run '^TestDepartureCLI' -count=1"
    dependencies:
      - task: opt-in-policy
        kind: hard
      - task: departure-runtime-store
        kind: hard
    artifact:
      kind: behavior_matrix
      path: cmd/tusker/departure_planner_test.go
      summary: Planner decision matrix for disabled, empty, cargo, held, offline, stale authorization, already gated, and release-ineligible states.
      acceptance_ids: [A1, A2, A3, A4, A5]
    owned_paths:
      - cmd/tusker/cli.go
      - cmd/tusker/departure_commands.go
      - cmd/tusker/departure_planner.go
      - cmd/tusker/departure_planner_test.go
    concurrency_group: planner
    risk: high
    priority: p0
    size: xl
    domains: [project]

  - source_key: implicit-singleton
    requirement_refs: [R2]
    title: Make standalone tasks invisible singleton delivery units
    outcome: A lone finished task follows the same staging and promotion path as a wave without requiring the operator to understand or manipulate wave mechanics.
    acceptance:
      - id: A1
        outcome: In stage or promote mode, a standalone task receives an implicit one-member delivery unit before landing while disabled and shadow modes create none and explicit multi-task wave behavior remains unchanged.
      - id: A2
        outcome: Finish, review, staging, and scheduled promotion require no explicit wave create, add, or arm command for the singleton path.
      - id: A3
        outcome: Automatic wrapping inherits existing task execution provenance and repository landing policy but cannot authorize new implementation work or release.
      - id: A4
        outcome: Existing task branches and detached completed worktrees can be adopted safely with exact source binding and idempotent repeated reconciliation.
      - id: A5
        outcome: Basic human surfaces describe staging and scheduled landing without exposing the synthetic wave ID unless the operator drills into diagnostics.
    verification:
      - covers: A1,A2,A3,A4,A5
        check: "command: go test ./cmd/tusker -run '^TestImplicitSingleton' -count=1"
    dependencies:
      - task: opt-in-policy
        kind: hard
    artifact:
      kind: behavior_matrix
      path: cmd/tusker/v7_delivery_unit_test.go
      summary: Standalone and explicit-wave lifecycle comparison proving zero-ceremony delivery without authorization widening.
      acceptance_ids: [A1, A2, A3, A4, A5]
    owned_paths:
      - cmd/tusker/v7_delivery_unit.go
      - cmd/tusker/v7_delivery_unit_test.go
      - cmd/tusker/v7_wave_cmd.go
      - cmd/tusker/v7_finish_cmd.go
      - cmd/tusker/v7_land_cmd.go
      - cmd/tusker/v7_land_recovery_test.go
      - cmd/tusker/workspace_manager.go
    concurrency_group: task-lifecycle
    risk: high
    priority: p0
    size: xl
    domains: [project]

  - source_key: daemon-timetable
    requirement_refs: [R1, R2]
    title: Run opt-in timetables, holds, and misfire policy in the daemon
    outcome: The resident daemon evaluates only opted-in projects at the nearest due window and produces one idempotent departure decision.
    acceptance:
      - id: A1
        outcome: Opted-out projects add no departure wakeups, polling work, Git access, records, or dispatch capacity consumption.
      - id: A2
        outcome: Daily windows and timezone behavior share one scheduling primitive with existing batch gates rather than creating a second clock implementation.
      - id: A3
        outcome: Global, project, and release-only holds are durable, attributable, instantly effective for future actions, and expose the exact resume action.
      - id: A4
        outcome: Staging windows default to skip-on-misfire and full promotion coalesces at most one ungated missed window; no policy replays every missed departure.
      - id: A5
        outcome: Concurrent triggers and restarts converge on the unique departure record without launching duplicate work.
    verification:
      - covers: A1,A2,A3,A4,A5
        check: "command: go test ./cmd/tusker -run '^TestDepartureScheduler' -count=1"
    dependencies:
      - task: shadow-planner-cli
        kind: hard
    artifact:
      kind: reliability_timeline
      path: cmd/tusker/departure_scheduler_test.go
      summary: Clock, hold, sleep/wake, duplicate-trigger, and restart event timelines with one durable outcome per window.
      acceptance_ids: [A1, A2, A3, A4, A5]
    owned_paths:
      - cmd/tusker/cli.go
      - cmd/tusker/departure_commands.go
      - cmd/tusker/daemon.go
      - cmd/tusker/batch_gate.go
      - cmd/tusker/departure_scheduler.go
      - cmd/tusker/departure_scheduler_test.go
      - cmd/tusker/daemon_control.go
    concurrency_group: daemon
    risk: high
    priority: p0
    size: xl
    domains: [project]

  - source_key: global-resource-leases
    requirement_refs: [R2]
    title: Arbitrate scarce build and release resources across projects
    outcome: Heavy gates and releases acquire atomic daemon-wide resource leases with bounded recovery instead of relying on unrelated repository lock files.
    acceptance:
      - id: A1
        outcome: Resource leases carry name, owner, purpose, project, departure, heartbeat, expiry, and generation and are acquired atomically across processes.
      - id: A2
        outcome: A healthy holder blocks a competing project with a stable cause and remedy while unrelated resources and light work remain concurrent.
      - id: A3
        outcome: Expired holders are reclaimed only after liveness or expiry policy proves recovery is safe, with an attributable takeover record.
      - id: A4
        outcome: Gate and release runners release leases on terminal outcomes and restart reconciliation recovers abandoned leases without overlapping work.
      - id: A5
        outcome: Existing project-local build-slot checks remain compatible but are not presented as daemon-wide arbitration.
    verification:
      - covers: A1,A2,A3,A4,A5
        check: "command: go test ./cmd/tusker -run '^TestResourceLease' -count=1"
    dependencies:
      - task: departure-runtime-store
        kind: hard
    artifact:
      kind: reliability_timeline
      path: cmd/tusker/resource_lease_test.go
      summary: Two-project contention, crash, expiry, takeover, and release timeline proving that heavy work never overlaps.
      acceptance_ids: [A1, A2, A3, A4, A5]
    owned_paths:
      - cmd/tusker/runtime_store.go
      - cmd/tusker/resource_lease.go
      - cmd/tusker/resource_lease_test.go
      - cmd/tusker/gate_tier.go
    concurrency_group: foundation
    risk: high
    priority: p0
    size: l
    domains: [project]

  - source_key: gated-staging-promotion
    requirement_refs: [R2]
    title: Stage continuously and promote only an exact full-green candidate
    outcome: Reviewed work integrates into delivery branches while the default branch moves only through a deterministic, full-gated, compare-and-swap promotion.
    acceptance:
      - id: A1
        outcome: Stage mode may land eligible reviewed tasks into their delivery branch but cannot move the configured default branch.
      - id: A2
        outcome: Promote mode reuses the serialized landing engine, staging worktree, batch bisection, gate ledger, and landing audit instead of implementing parallel merge machinery.
      - id: A3
        outcome: The full promotion gate binds the exact frozen candidate, command, profile, and toolchain, and focused staging proof cannot satisfy it.
      - id: A4
        outcome: Candidate, task, authorization, integration, gate, or default-ref drift before update produces a named recompute or refusal and never an optimistic push.
      - id: A5
        outcome: Successful promotion records the exact last successfully gated and promoted SHA only after the ref update and remains idempotent on replay.
      - id: A6
        outcome: Existing repositories without the opt-in policy retain the current reviewer and wave landing behavior.
    verification:
      - covers: A1,A2,A3,A4,A5,A6
        check: "command: go test ./cmd/tusker -run '^TestScheduledPromotionLanding' -count=1"
    dependencies:
      - task: implicit-singleton
        kind: hard
      - task: daemon-timetable
        kind: hard
      - task: global-resource-leases
        kind: hard
    artifact:
      kind: reliability_timeline
      path: cmd/tusker/scheduled_promotion_test.go
      summary: Reviewed task through staging, full gate, CAS main promotion, replay, drift refusal, and default-off compatibility timeline.
      acceptance_ids: [A1, A2, A3, A4, A5, A6]
    owned_paths:
      - cmd/tusker/v7_land_cmd.go
      - cmd/tusker/v7_land_recovery_test.go
      - cmd/tusker/scheduled_promotion.go
      - cmd/tusker/scheduled_promotion_test.go
      - cmd/tusker/armed_wave.go
    concurrency_group: landing
    risk: high
    priority: p0
    size: xl
    domains: [project]

  - source_key: red-failure-packet
    requirement_refs: [R2]
    title: Capture and deterministically classify red promotion evidence
    outcome: One structured failure packet lets Tusker distinguish infrastructure, known flakes, isolated task failures, and ambiguous integration failures without rediscovery.
    acceptance:
      - id: A1
        outcome: A red promotion stores exact candidate, gate, toolchain, runner, defect, last-green, bisection, task, touched-path, reproduction, and runtime artifact facts.
      - id: A2
        outcome: Raw logs remain runtime artifacts while tasks and briefs receive bounded actionable diagnostics and durable references.
      - id: A3
        outcome: Deterministic rules classify known infrastructure, configured flakes, and isolated task failures before any model launch.
      - id: A4
        outcome: Infrastructure routes to bounded retry or infrastructure repair, a flake follows configured quarantine or rerun policy, and an isolated defect returns only the owning task and hard downstream closure to rework.
      - id: A5
        outcome: Repeated instances update one open repair contract per stable defect identity rather than creating unbounded duplicate tasks.
    verification:
      - covers: A1,A2,A3,A4,A5
        check: "command: go test ./cmd/tusker -run '^TestPromotionFailure' -count=1"
    dependencies:
      - task: gated-staging-promotion
        kind: hard
    artifact:
      kind: behavior_matrix
      path: cmd/tusker/promotion_failure_test.go
      summary: Red-gate classification and routing matrix with complete structured packet examples and bounded task projections.
      acceptance_ids: [A1, A2, A3, A4, A5]
    owned_paths:
      - cmd/tusker/batch_gate.go
      - cmd/tusker/departure_planner.go
      - cmd/tusker/departure_planner_test.go
      - cmd/tusker/departure_scheduler.go
      - cmd/tusker/departure_store.go
      - cmd/tusker/gate_ledger.go
      - cmd/tusker/gate_ledger_toolchain_test.go
      - cmd/tusker/gate_scope.go
      - cmd/tusker/gate_tier.go
      - cmd/tusker/gate_tier_test.go
      - cmd/tusker/orchestration_epic_test.go
      - cmd/tusker/promotion_failure.go
      - cmd/tusker/promotion_failure_test.go
      - cmd/tusker/runtime_store.go
      - cmd/tusker/scheduled_promotion.go
      - cmd/tusker/scheduled_promotion_test.go
      - cmd/tusker/v7_land_cmd.go
      - cmd/tusker/workflow.go
      - cmd/tusker/workflow_validate.go
    concurrency_group: landing
    risk: high
    priority: p0
    size: xl
    domains: [project]

  - source_key: optional-model-triage
    requirement_refs: [R3]
    title: Dispatch paid triage only for ambiguous red promotions
    outcome: An explicitly enabled project may spend one bounded model attempt to turn an ambiguous failure packet into a scoped repair contract.
    acceptance:
      - id: A1
        outcome: Model triage defaults off and cannot launch for disabled, shadow-only, known infrastructure, known flake, or isolated task failures.
      - id: A2
        outcome: An ambiguous failure creates or updates a real integrator or repair task and dispatches through the normal claimed-run protocol rather than inventing a departure attempt.
      - id: A3
        outcome: The prompt contains the structured failure packet and governing policy but no secrets, arbitrary release command, raw transcript, or authority to move the default branch.
      - id: A4
        outcome: The result schema requires classification, confidence, affected tasks, likely root cause, reproduction, and repair acceptance; malformed or early exits park without fabricating a repair.
      - id: A5
        outcome: Per-departure and daily launch quotas fail closed with a spending hold and never rely on unauditable exact USD estimates.
    verification:
      - covers: A1,A2,A3,A4,A5
        check: "command: go test ./cmd/tusker -run '^TestPromotionTriage' -count=1"
    dependencies:
      - task: opt-in-policy
        kind: hard
      - task: red-failure-packet
        kind: hard
    artifact:
      kind: behavior_matrix
      path: cmd/tusker/promotion_triage_test.go
      summary: Spend/no-spend routing matrix and structured model-triage result contract for ambiguous red promotions.
      acceptance_ids: [A1, A2, A3, A4, A5]
    owned_paths:
      - cmd/tusker/daemon.go
      - cmd/tusker/promotion_triage.go
      - cmd/tusker/promotion_triage_test.go
      - cmd/tusker/runner.go
    concurrency_group: daemon
    risk: high
    priority: p1
    size: l
    domains: [project]

  - source_key: release-profiles
    requirement_refs: [R3]
    title: Bind optional releases to named authorized profiles
    outcome: A separately opted-in release runner deploys only the exact green promoted revision without exposing credentials or arbitrary shell authority to models.
    acceptance:
      - id: A1
        outcome: Promotion never implies release; absent, disabled, held, or unauthorized release configuration produces no external action.
      - id: A2
        outcome: Release configuration names a validated profile rather than embedding an arbitrary deploy shell command in the departure policy.
      - id: A3
        outcome: The release binds the promoted SHA, environment, credential provider, deterministic runner, idempotency key, rollback reference, and authorization provenance.
      - id: A4
        outcome: Secrets resolve only inside the release runner and are absent from prompts, records, task Markdown, logs, notifications, JSON APIs, and command previews.
      - id: A5
        outcome: Release hold, retry, duplicate trigger, partial failure, and rollback record one truthful durable outcome without repeating a successful release.
    verification:
      - covers: A1,A2,A3,A4,A5
        check: "command: go test ./cmd/tusker -run '^TestReleaseProfile' -count=1"
    dependencies:
      - task: opt-in-policy
        kind: hard
      - task: global-resource-leases
        kind: hard
      - task: gated-staging-promotion
        kind: hard
      - task: red-failure-packet
        kind: hard
      - task: optional-model-triage
        kind: hard
    artifact:
      kind: security_summary
      path: cmd/tusker/release_profile_test.go
      summary: Release authority, revision binding, secret-flow, idempotency, failure, and rollback security matrix.
      acceptance_ids: [A1, A2, A3, A4, A5]
    owned_paths:
      - cmd/tusker/workflow.go
      - cmd/tusker/runner_profiles.go
      - cmd/tusker/release_profile.go
      - cmd/tusker/release_profile_test.go
      - cmd/tusker/daemon.go
    concurrency_group: daemon
    risk: high
    priority: p1
    size: xl
    domains: [project]

  - source_key: morning-brief-api
    requirement_refs: [R4]
    title: Project the scheduled-promotion morning brief
    outcome: CLI and Serve expose one product-language brief showing what landed, what is blocked or repairing, and what requires a human decision.
    acceptance:
      - id: A1
        outcome: The brief has exactly three primary lists—Landed last night, Blocked or repairing, and Needs your decision—with stable ordering and empty states.
      - id: A2
        outcome: The projection composes wave brief, logbook, departure, gate, repair, release, and human-gate facts without recomputing proof or storing a duplicate narrative source of truth.
      - id: A3
        outcome: Every blocked item shows the first actionable cause, affected scope, current automatic action, and deep link; machine work never appears under human decisions.
      - id: A4
        outcome: Landed items bind exact promoted and optional released revisions and link accepted artifacts without claiming release when only promotion succeeded.
      - id: A5
        outcome: Disabled projects return a clear feature-off projection and no alarming pending state.
    verification:
      - covers: A1,A2,A3,A4,A5
        check: "command: go test ./cmd/tusker -run '^TestScheduledPromotionMorningBrief' -count=1"
    dependencies:
      - task: departure-runtime-store
        kind: hard
      - task: red-failure-packet
        kind: hard
      - task: release-profiles
        kind: soft
    artifact:
      kind: behavior_matrix
      path: cmd/tusker/morning_brief_test.go
      summary: Product-language morning brief fixtures covering landed, repairing, human decision, release, mixed, empty, and disabled days.
      acceptance_ids: [A1, A2, A3, A4, A5]
    owned_paths:
      - cmd/tusker/v7_wave_brief.go
      - cmd/tusker/v7_logbook_cmd.go
      - cmd/tusker/morning_brief.go
      - cmd/tusker/morning_brief_test.go
      - cmd/tusker/serve_command.go
      - cmd/tusker/serve_types.go
