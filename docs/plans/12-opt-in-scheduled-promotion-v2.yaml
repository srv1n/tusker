  - source_key: actionable-notifications
    requirement_refs: [R4]
    title: Notify only on red promotion, failed release, or spending hold
    outcome: Operators receive one actionable deep-linked notification for the three exceptional outcomes and silence for routine departures.
    acceptance:
      - id: A1
        outcome: Only promotion red, release failed, and spending or paid-launch hold events are eligible for scheduled-promotion push delivery.
      - id: A2
        outcome: Notifications are deduplicated by durable outcome, identify project and revision, state one bounded cause, and deep-link to the morning brief.
      - id: A3
        outcome: Green, empty, shadow, ordinary staging, operator-held, retrying, and repeated unchanged outcomes remain silent.
      - id: A4
        outcome: Notification preferences persist through the settings API, default to the documented safe values, and cannot enable scheduled promotion, model triage, or release.
      - id: A5
        outcome: Delivery failure is recorded for retry or inspection without changing the underlying promotion, release, or hold truth.
    verification:
      - covers: A1,A2,A3,A5
        check: "command: go test ./cmd/tusker -run '^TestPromotionNotification' -count=1"
      - covers: A4
        check: "command: cd internal/serve/ui && bun test tests/scheduled-promotion-notifications.test.ts"
    dependencies:
      - task: morning-brief-api
        kind: hard
      - task: serve-ui
        kind: hard
      - task: red-failure-packet
        kind: hard
      - task: release-profiles
        kind: soft
