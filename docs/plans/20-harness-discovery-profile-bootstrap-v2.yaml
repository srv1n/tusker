schema: tusker.delivery-plan/v2
scope: harness-discovery-profile-bootstrap/v1
title: Harness discovery and profile bootstrap
epic: ORC
spec_refs:
  - docs/specs/20-harness-discovery-profile-bootstrap.md
context_fingerprint: sha256:cb2c48897ca9ecbda06815b116eb898beea1de91661fa5c36a71c7c4677b89ec
factory_intake_contract_schema: tusker.factory-intake-contract/v1
factory_intake_contract_version: 1.1.0
factory_intake_contract_fingerprint: sha256:15ec23480f22cb10b83bc945465abedd279e3954e777dcecb0815571799fbe18
summary: >-
  Establish the read-only local harness catalog, semantic runner-profile
  bootstrap, V2-first authoring path, and route preview needed to dogfood
  Tusker safely with lower-tier execution defaults.
non_goals:
  - >-
    This plan does not enable project or registry automation, arm a wave,
    start/install a daemon, dispatch a model, move a ref, release, spend,
    configure credentials, or push.
  - >-
    This plan does not build the final Serve settings UI. It establishes the
    CLI contracts that the UI will consume in a subsequent dogfooded plan.
  - >-
    Discovery does not claim provider permanence. Codex live observations,
    Codex bundled fallback, and Claude declared capabilities retain distinct
    provenance and confidence.
  - >-
    Production feedback F1-F6 in the canonical scheduled-promotion spec §8 is
    accepted follow-on scope, not work in this bootstrap wave. Break-glass
    close, runner claim health, Tusker self-capabilities, cross-worktree
    registration, boarding census/receipts, and parked-run escalation require
    a separate reviewed V2 delivery plan after bootstrap dogfood.
requirements:
  - id: R1
    outcome: A provider-neutral read-only catalog reports locally available harness models, efforts, service tiers when known, defaults, visibility, source, confidence, version, and observation time.
  - id: R2
    outcome: Codex uses an installed-CLI live catalog with explicit bundled fallback, while Claude reports declared aliases and efforts without pretending to have a live model-list API.
  - id: R3
    outcome: Fresh initialization and explicit reconcile can generate a deterministic semantic role set while preserving explicit profiles and leaving automation disabled.
  - id: R4
    outcome: Runner policy accepts supported effort levels and model-neutral task complexity without embedding provider models in task contracts.
  - id: R5
    outcome: Delivery-plan scaffolding and installed guidance make source-keyed V2 DAGs the default multi-unit authoring contract.
  - id: R6
    outcome: Read-only route preview explains semantic role, selected profile, exact policy source, and precedence without claim or dispatch.
  - id: R7
    outcome: A disposable repository proves initialization, discovery, generated lower-tier profiles, V2 DAG validation/dry-run, and route preview while automation, daemon, runs, and refs remain untouched.
concurrency: 2
tasks:
  - source_key: harness-catalog-profile-bootstrap
    requirement_refs: [R1, R2, R3, R4]
    title: Discover harness capabilities and bootstrap semantic profiles
    outcome: >-
      Tusker exposes a provider-neutral local capability catalog and can
      preview or write deterministic semantic runner profiles without
      overwriting explicit policy or enabling automation.
    acceptance:
      - id: A1
        outcome: Catalog JSON isolates per-harness success/failure and records model, effort, known service tiers, default/hidden state, source, confidence, CLI version, and observation time; inspection performs no authentication, configuration write, or model launch.
      - id: A2
        outcome: Codex parses the installed CLI live catalog and explicitly labels bundled fallback; Claude returns only declared aliases and supported efforts with lower confidence because no machine-readable model-list endpoint exists.
      - id: A3
        outcome: >-
          Fresh init writes a balanced semantic role set when capabilities
          permit, and explicit profile bootstrap supports dry-run/write while
          preserving existing explicit profiles, routing, and
          `automation.enabled: false`.
      - id: A4
        outcome: Profile validation accepts low, medium, high, xhigh, max, and ultra where configured, rejects unknown effort strings, and task complexity accepts only routine, standard, complex, or frontier.
    verification:
      - covers: A1,A2,A3,A4
        check: "command: go test ./cmd/tusker -run '^(TestRunnerCatalog|TestRunnerProfile|TestSemanticBootstrap|TestSemanticEffort|TestFreshBootstrap|TestProfileReconcile)' -count=1 && go test ./internal/v7schema -count=1"
    artifact:
      kind: behavior_matrix
      path: cmd/tusker/runner_catalog_test.go
      summary: Live, bundled, declared, missing-harness, profile-preservation, effort, complexity, and automation-off behavior matrix.
      acceptance_ids: [A1, A2, A3, A4]
    owned_paths:
      - cmd/tusker/runner_catalog.go
      - cmd/tusker/runner_catalog_test.go
      - cmd/tusker/runner_profiles.go
      - cmd/tusker/runner_profiles_test.go
      - cmd/tusker/commands_create.go
      - cmd/tusker/commands_create_test.go
      - cmd/tusker/commands_v7.go
      - cmd/tusker/v7_validation.go
      - cmd/tusker/cli.go
      - internal/v7schema/schema.go
    concurrency_group: bootstrap-core
    risk: medium
    priority: p0
    size: xl
    domains: [project]

  - source_key: v2-planning-scaffold
    requirement_refs: [R5]
    title: Make V2 DAG authoring the installed default
    outcome: >-
      Tusker generates a context-bound V2 starting plan, and installed guidance
      tells planning agents to use source keys and dependencies for every
      multi-unit implementation.
    acceptance:
      - id: A1
        outcome: The generated scaffold declares `tusker.delivery-plan/v2`, the current context and factory-intake provenance, source-keyed requirements/tasks, observable acceptance, exact verification, an operator artifact, owned paths, and a hard-dependency example without final Tusker IDs.
      - id: A2
        outcome: Generated YAML round-trips through the strict V2 decoder, is explicitly inert, and requires the planner to replace its bounded authoring markers before doctor/import can pass.
      - id: A3
        outcome: Installed skill and onboarding guidance say multi-unit work defaults to a V2 DAG, a lone task is a wave of one, dependencies unlock frontiers, and agents use Tusker CLI lifecycle commands rather than arbitrary Markdown status edits.
    verification:
      - covers: A1,A2
        check: "command: go test ./cmd/tusker -run '^TestDeliveryPlanV2Scaffold' -count=1"
      - covers: A3
        check: "command: make skill-doctor"
    artifact:
      kind: knowledge_link
      path: skills/tusker/references/ORCHESTRATION.md
      summary: V2-first planning, source-key dependency, frontier, wave-of-one, and CLI lifecycle guidance.
      acceptance_ids: [A1, A2, A3]
    owned_paths:
      - cmd/tusker/delivery_cmd.go
      - cmd/tusker/delivery_cmd_test.go
      - skills/tusker/SKILL.md
      - skills/tusker/references/ORCHESTRATION.md
      - skills/tusker/assets/templates/onboard-prompt.md
    concurrency_group: v2-authoring
    risk: medium
    priority: p0
    size: l
    domains: [project]

  - source_key: explain-runner-route
    requirement_refs: [R4, R6]
    title: Explain semantic runner routing before dispatch
    outcome: >-
      An operator can preview the exact complexity-to-role-to-profile decision
      for a tracked task and lane without changing task or runtime state.
    acceptance:
      - id: A1
        outcome: >-
          `tusker runner route <TASK-ID> --lane execute --json` returns task
          complexity, semantic role, selected profile definition, source,
          matching rule, precedence, and any validation blocker.
      - id: A2
        outcome: Explicit task profile override wins over project routing, routing wins over lane role, lane role wins over default, and complexity selects a role only when no stronger explicit policy applies.
      - id: A3
        outcome: Preview is byte-for-byte state inert for the task, wave, runtime store, automation setting, and Git refs.
    verification:
      - covers: A1,A2,A3
        check: "command: go test ./cmd/tusker -run '^TestRunnerRoutePreview' -count=1"
    dependencies:
      - task: harness-catalog-profile-bootstrap
        kind: hard
      - task: v2-planning-scaffold
        kind: hard
    artifact:
      kind: behavior_matrix
      path: cmd/tusker/runner_route_preview_test.go
      summary: Routing precedence, semantic role mapping, invalid complexity, blocker, and read-only invariants.
      acceptance_ids: [A1, A2, A3]
    owned_paths:
      - cmd/tusker/runner_route_preview.go
      - cmd/tusker/runner_route_preview_test.go
      - cmd/tusker/runner_profiles.go
      - cmd/tusker/runner_profiles_test.go
      - cmd/tusker/delivery_cmd.go
      - cmd/tusker/delivery_cmd_test.go
      - cmd/tusker/delivery_v2.go
      - cmd/tusker/delivery_v2_test.go
      - cmd/tusker/cli.go
      - skills/tusker/references/ORCHESTRATION.md
    concurrency_group: route-preview
    risk: medium
    priority: p0
    size: m
    domains: [project]

  - source_key: lower-tier-disposable-dogfood
    requirement_refs: [R7]
    title: Prove the bootstrap in a disposable automation-off repository
    outcome: >-
      One hermetic fixture proves the user journey from init through catalog,
      semantic profiles, V2 DAG validation/dry-run, and lower-tier route
      previews without daemon authority or ref movement.
    acceptance:
      - id: A1
        outcome: The fixture creates a disposable Git repository, initializes Tusker with automation off, observes catalog provenance, and generates lower-tier `execute-fast` and `execute-standard` profiles without replacing explicit policy.
      - id: A2
        outcome: >-
          The fixture authors a four-frontier V2 DAG with parallel
          hello/goodbye work, router integration, parallel docs/end-to-end
          proof, and a final integration gate; doctor and dry-run succeed with
          deterministic frontiers, while product review renders the complete
          contract and correctly blocks Start because automation remains off.
      - id: A3
        outcome: Route previews choose the expected lower-tier roles and the final audit proves automation remains off, no daemon/service or run exists, and protected/default refs did not move.
    verification:
      - covers: A1,A2,A3
        check: "command: go test ./cmd/tusker -run '^TestFactoryBootstrapDisposableDogfood$' -count=1"
    dependencies:
      - task: v2-planning-scaffold
        kind: hard
      - task: explain-runner-route
        kind: hard
    artifact:
      kind: reliability_timeline
      path: cmd/tusker/factory_bootstrap_dogfood_test.go
      summary: Hermetic automation-off bootstrap journey, deterministic DAG frontiers, lower-tier routing, and no-side-effect audit.
      acceptance_ids: [A1, A2, A3]
    owned_paths:
      - cmd/tusker/factory_bootstrap_dogfood_test.go
      - docs/reports/factory-bootstrap-dogfood.md
    concurrency_group: dogfood-proof
    risk: low
    priority: p0
    size: m
    domains: [project]
