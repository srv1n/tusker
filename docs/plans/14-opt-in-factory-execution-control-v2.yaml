schema: tusker.delivery-plan/v2
scope: factory-execution-control/v1
title: Opt-in factory execution control
epic: ORC
spec_refs:
  - docs/specs/14-opt-in-factory-execution-control.md
context_fingerprint: sha256:328fd5d576f5008f4b6a02ebff21d21210ad7594642b65041cf8ffa01636f1a4
factory_intake_contract_schema: tusker.factory-intake-contract/v1
factory_intake_contract_version: 1.1.0
factory_intake_contract_fingerprint: sha256:0704d5ee907d738c496512b5ae948e96590a7b732c4ab774bee1de1429b5b13c
summary: Migrate the factory execution-control delivery wave to a requirement-traceable V2 contract while keeping automation, completion authority, release, spending, and notifications explicitly opt-in.
non_goals:
  - This migration does not enable automation, arm a wave, start a daemon, release, spend, notify, or move a default branch.
  - Authoritative completion remains disabled until a human selects a low-risk project after shadow and rollback readiness.
requirements:
  - id: R1
    outcome: Daemon dispatch and every modifying work session remain explicitly authorized, wave-scoped, and default-off.
  - id: R2
    outcome: The control plane preserves deterministic review, dependency, fairness, integration, and exactly-once completion behavior.
  - id: R3
    outcome: Operators and agents can verify the factory loop through trustworthy surfaces, end-to-end proof, and canonical guidance.
  - id: R4
    outcome: Shadow parity and rollback readiness remain independent default-off producer evidence for the later program-level dogfood authority transfer.
concurrency: 2
runner_profile: implementation-terra
tasks:
  - source_key: dispatch-scope-policy
    requirement_refs: [R1]
    title: Make daemon dispatch authority explicit and wave-scoped by default
    outcome: A repository can enable the resident daemon without authorizing arbitrary ready tasks, while existing explicitly broad automation remains compatible and visible.
    acceptance:
      - id: A1
        outcome: Fresh setup writes automation disabled with effective dispatch scope armed_waves, and absent setup never produces a background claim.
      - id: A2
        outcome: An enabled armed_waves project reuses already-held wave and member locks while preserving sorted acquisition for uncovered paths, atomically persists the exact armed fingerprint and readiness projection, restores eligible readiness on refusal without recursive CAS_BUSY or partial authorization, dispatches only ready or rework members of the current armed wave, and refuses unrelated eligible tasks with a stable reason.
      - id: A3
        outcome: The all_eligible scope is an explicit advanced mode, while existing enabled projects with no scope preserve prior behavior through a visible legacy-effective projection and doctor warning rather than silent authority drift.
      - id: A4
        outcome: Workflow inspection, automation planning, wave preflight, daemon status, and Serve expose configured and effective scope plus provenance and one exact repair.
      - id: A5
        outcome: Changing dispatch scope never enables automation, arms a wave, starts a daemon, satisfies a gate, changes runner permission, moves a Git ref, or authorizes release or paid work.
    verification:
      - covers: A1,A2,A3,A4,A5
        check: "command: go test ./cmd/tusker -run '^TestAutomationDispatchScope' -count=1"
      - covers: A2
        check: "command: go test ./cmd/tusker -run '^TestWaveArm' -count=1"
    artifact:
      kind: behavior_matrix
      path: cmd/tusker/dispatch_scope_test.go
      summary: Absent, disabled, atomic public arm, stale-wave, unrelated-ready, explicit all-eligible, legacy-effective, and no-side-effect dispatch authority matrix.
      acceptance_ids: [A1, A2, A3, A4, A5]
    owned_paths:
      - cmd/tusker/dispatch_scope.go
      - cmd/tusker/dispatch_scope_test.go
      - cmd/tusker/workflow.go
      - cmd/tusker/automation_commands.go
      - cmd/tusker/armed_wave.go
      - cmd/tusker/setup_doctor.go
      - cmd/tusker/setup_doctor_test.go
      - cmd/tusker/commands_create.go
      - cmd/tusker/delivery_cmd.go
      - cmd/tusker/automation_commands_test.go
      - cmd/tusker/v7_wave_authorization.go
      - cmd/tusker/v7_wave_authorization_test.go
      - cmd/tusker/serve_types.go
      - cmd/tusker/serve_command.go
      - cmd/tusker/serve_projects_test.go
    concurrency_group: factory-control
    knowledge_nodes:
      - .tusker/knowledge/domains/project/CANON.md
    risk: critical
    priority: p0
    size: xl
    domains: [project]

  - source_key: universal-work-session
    requirement_refs: [R1]
    title: Add one universal claimed work-session protocol
    outcome: Every modifying interactive or automated agent has one shared runtime owner, revision, workspace, branch, and terminal handoff without requiring project automation to be enabled.
    acceptance:
      - id: A1
        outcome: Work start atomically resolves readiness, ownership, task and source revision, workspace, branch, lease, attempt intent, and authorization source through the existing run-ownership service and returns a bounded packet and exact next action.
      - id: A2
        outcome: Interactive start works while project automation is disabled but cannot start a daemon, enable automation, arm a wave, launch a worker, or authorize any other task.
      - id: A3
        outcome: Healthy owners, owned-path conflicts, unsafe workspace state, unsatisfied dependencies, terminal tasks, and human gates refuse with stable causes, while only provably dead expired holders are reclaimable.
      - id: A4
        outcome: Status, heartbeat, submit, fail, and release enforce owner and revision compare-and-swap semantics and every terminal path releases or retires the live lease exactly once.
      - id: A5
        outcome: Legacy claim, attempt, and runs commands delegate or name the canonical replacement without creating contradictory active-work state, and guarded agent finish or review mutations require a live work session unless a human uses an explicit attributable break-glass path.
      - id: A6
        outcome: Canonical work-session mutations notify the resident daemon of the exact changed task but never cause an interactive session to dispatch or spawn a nested model.
    verification:
      - covers: A1,A2,A3,A4,A5,A6
        check: "command: go test ./cmd/tusker -run '^TestWorkSession' -count=1"
    dependencies:
      - task: dispatch-scope-policy
        kind: hard
    artifact:
      kind: behavior_matrix
      path: cmd/tusker/work_session_cmd_test.go
      summary: Interactive-disabled, daemon-owned, conflict, dead-reclaim, dependency, gate, submit, fail, release, legacy, and no-spawn work-session matrix.
      acceptance_ids: [A1, A2, A3, A4, A5, A6]
    owned_paths:
      - cmd/tusker/work_session_cmd.go
      - cmd/tusker/work_session_cmd_test.go
      - cmd/tusker/run_ownership.go
      - cmd/tusker/commands_pickup.go
      - cmd/tusker/cli.go
      - cmd/tusker/runtime_store.go
      - cmd/tusker/commands_v7.go
      - cmd/tusker/v7_control_cmd.go
    concurrency_group: factory-ownership
    knowledge_nodes:
      - .tusker/knowledge/domains/project/CANON.md
    risk: critical
    priority: p0
    size: xl
    domains: [project]

  - source_key: incremental-frontier-index
    requirement_refs: [R2]
    title: Reconcile changed DAG closures without reparsing whole projects
    outcome: Canonical task, proof, gate, dependency, wave, and runtime mutations wake only the affected project and graph closure while adaptive scans preserve correctness for raw edits and restart.
    acceptance:
      - id: A1
        outcome: The daemon control notification carries project, changed object IDs and kinds, resulting revisions, cause, and affected eligibility classes with backward-compatible handling of existing project-only notifications.
      - id: A2
        outcome: One in-memory per-project projection maintains parsed operational records, forward and reverse hard or soft edges, wave authorization, eligibility, and frontier generation without becoming durable source of truth.
      - id: A3
        outcome: A warm one-task CLI mutation in a 10000-task fixture reads and parses only changed records plus its bounded reverse dependency or wave closure and performs no note reads or parses in unrelated registered projects.
      - id: A4
        outcome: Raw edits, missed notifications, registry changes, restart, and cache mismatch fall back to adaptive reconciliation, and unchanged fallback scans remain stat-only with zero Markdown reads and YAML parses.
      - id: A5
        outcome: Incremental update, cold rebuild, and a clean full reconcile produce identical task eligibility, blockers, and ordered frontiers for hard, soft, gated, stale-wave, and terminal transitions.
      - id: A6
        outcome: Performance counters and benchmark output report records stated, read, parsed, graph nodes recomputed, projects woken, and elapsed time without writing per-poll history or logs into task records.
    verification:
      - covers: A1,A2,A3,A4,A5,A6
        check: "command: go test ./cmd/tusker -run '^TestIncrementalFrontierIndex' -count=1"
    dependencies:
      - task: dispatch-scope-policy
        kind: hard
    artifact:
      kind: benchmark
      path: cmd/tusker/testdata/incremental-frontier-benchmark.json
      summary: Cold, warm, one-change, reverse-closure, raw-edit, restart, and unrelated-project read, parse, recompute, and latency results at 10000 tasks.
      acceptance_ids: [A1, A2, A3, A4, A5, A6]
    owned_paths:
      - cmd/tusker/frontier_index.go
      - cmd/tusker/frontier_index_test.go
      - cmd/tusker/cli_mutation_notify.go
      - cmd/tusker/daemon_control.go
      - cmd/tusker/daemon.go
      - cmd/tusker/notes.go
      - cmd/tusker/adaptive_reconcile.go
      - cmd/tusker/testdata/incremental-frontier-benchmark.json
    concurrency_group: factory-reconcile
    risk: high
    priority: p0
    size: xl
    domains: [project]

  - source_key: typed-review-results
    requirement_refs: [R2]
    title: Replace reviewer prose and merge choreography with typed results
    outcome: An independent reviewer emits one attempt-bound pass, changes-requested, or blocked result that the deterministic control plane can validate and react to.
    acceptance:
      - id: A1
        outcome: Review submit persists one compare-and-swap result bound to task and work revision, implementation SHA, reviewer attempt and actor, runner profile, acceptance coverage, proof and gate fingerprints, verdict, bounded summary, findings, and evidence references.
      - id: A2
        outcome: Pass requires complete acceptance coverage and currently satisfied objective proof and gates, changes_requested requires at least one actionable finding, and blocked requires a typed machine, infrastructure, or genuine human blocker.
      - id: A3
        outcome: Stale task, source, attempt, proof, gate, or reviewer authority is refused and repeated submission of the exact result is idempotent without overwriting a conflicting verdict.
      - id: A4
        outcome: Reviewer prompts and skills restrict the reviewer to read-only inspection and typed result submission and remove instructions to merge, land, close, move refs, or edit implementation files.
      - id: A5
        outcome: Reviewer prose, an unmarked verification row, and process exit are never acceptance; exit without one valid result leaves review open and follows bounded retry or park policy.
      - id: A6
        outcome: Existing generated reviewer findings remain readable and migrate into the structured projection without losing task or attempt attribution.
    verification:
      - covers: A1,A2,A3,A4,A5,A6
        check: "command: go test ./cmd/tusker -run '^TestReviewResultProtocol' -count=1"
    dependencies:
      - task: universal-work-session
        kind: hard
    artifact:
      kind: behavior_matrix
      path: cmd/tusker/review_result_test.go
      summary: Pass, changes, blocked, incomplete coverage, stale binding, duplicate, conflicting, early-exit, legacy finding, and reviewer-authority matrix.
      acceptance_ids: [A1, A2, A3, A4, A5, A6]
    owned_paths:
      - cmd/tusker/review_result.go
      - cmd/tusker/review_result_test.go
      - cmd/tusker/reviewer_finding.go
      - cmd/tusker/workflow.go
      - cmd/tusker/runtime_store.go
      - cmd/tusker/cli.go
    concurrency_group: factory-review
    risk: critical
    priority: p0
    size: xl
    domains: [project]

  - source_key: fair-multi-project-dispatch
    requirement_refs: [R2]
    title: Schedule eligible project frontiers fairly under shared capacity
    outcome: Multiple enabled projects make bounded progress without registry-order starvation while wave, project, runner, path, and resource limits remain authoritative.
    acceptance:
      - id: A1
        outcome: At equal priority, a project with a waiting eligible frontier receives one global dispatch turn before another project consumes a second slot, with stable tie-breaking across restart.
      - id: A2
        outcome: Explicit priority, wave concurrency, project capacity, runner capacity, owned paths, disk pressure, and named resource leases constrain selection with a stable displayed reason.
      - id: A3
        outcome: One disabled, stale-wave, held, incompatible, corrupt, or quarantined project cannot block polling or dispatch for healthy sibling projects.
      - id: A4
        outcome: A targeted project mutation wakes only that project, while release of a named global resource wakes exactly the projects waiting for that resource.
      - id: A5
        outcome: Repeated poll, daemon restart, concurrent mutation, and capacity release cannot duplicate claims or skip a previously waiting project indefinitely.
    verification:
      - covers: A1,A2,A3,A4,A5
        check: "command: go test ./cmd/tusker -run '^TestFairMultiProjectDispatch' -count=1"
    dependencies:
      - task: incremental-frontier-index
        kind: hard
      - task: typed-review-results
        kind: hard
    artifact:
      kind: reliability_timeline
      path: cmd/tusker/fair_dispatch_test.go
      summary: Two- and three-project global-capacity, priority, quarantine, resource wait, targeted wake, restart, and concurrent-claim timelines.
      acceptance_ids: [A1, A2, A3, A4, A5]
    owned_paths:
      - cmd/tusker/daemon_scheduler.go
      - cmd/tusker/fair_dispatch_test.go
      - cmd/tusker/daemon.go
      - cmd/tusker/resource_lease.go
      - cmd/tusker/resource_lease_test.go
      - cmd/tusker/runtime_store.go
      - cmd/tusker/scheduled_promotion.go
    concurrency_group: factory-scheduler
    risk: high
    priority: p0
    size: xl
    domains: [project]

  - source_key: deterministic-review-completion
    requirement_refs: [R2]
    title: Make review-to-integration-to-done one deterministic transaction
    outcome: A valid review result is converted into an idempotent staged merge, objective gate, integrated task closure, and exactly-once successor unlock without asking a model to operate Git or lifecycle state.
    acceptance:
      - id: A1
        outcome: A passing result freezes source, review, proof, gate, and integration revisions, merges the exact task branch in a detached staging worktree, materializes review verification and task close there, runs the merged-state gate, and compare-and-swap updates the integration ref.
      - id: A2
        outcome: A changes-requested result idempotently records bounded findings, returns the task to rework, preserves its branch and workspace, releases review ownership, includes complete context in the next packet, and relocks affected soft dependents.
      - id: A3
        outcome: Merge conflict, red gate, stale source, stale review, proof or gate drift, and integration-base drift cannot close the task and instead produce one contextual rework or parked result with reproduction and stable defect identity.
      - id: A4
        outcome: A projected integrated done task immediately recomputes its affected hard and soft successor closure, dispatches only the newly eligible authorized frontier within capacity, and allows independent branches to continue.
      - id: A5
        outcome: Task completion moves only the wave integration ref and delegates default-branch movement to the configured immediate or scheduled promotion policy without widening release or paid-triage authority.
      - id: A6
        outcome: Crash and replay at result persistence, staging, merge, gate, close materialization, integration CAS, audit persistence, and successor wake converge without duplicate review, merge, close, terminal rewind, successor claim, or default-ref movement.
    verification:
      - covers: A1,A2,A3,A4,A5,A6
        check: "command: go test ./cmd/tusker -run '^TestDeterministicReviewCompletion' -count=1"
    dependencies:
      - task: typed-review-results
        kind: hard
      - task: fair-multi-project-dispatch
        kind: hard
    artifact:
      kind: reliability_timeline
      path: cmd/tusker/review_completion_test.go
      summary: Pass, changes, merge red, gate red, stale bindings, soft relock, hard unlock, independent continuation, scheduled-promotion handoff, and crash-replay timeline.
      acceptance_ids: [A1, A2, A3, A4, A5, A6]
    owned_paths:
      - cmd/tusker/review_completion.go
      - cmd/tusker/review_completion_test.go
      - cmd/tusker/v7_land_cmd.go
      - cmd/tusker/daemon.go
      - cmd/tusker/armed_wave.go
      - cmd/tusker/v7_dependencies.go
    concurrency_group: factory-completion
    knowledge_nodes:
      - .tusker/knowledge/domains/project/CANON.md
    risk: critical
    priority: p0
    size: xl
    domains: [project]

  - source_key: factory-operations-surface
    requirement_refs: [R3]
    title: Ship one outcome-first factory operations surface
    outcome: A user can see what delivered, what is working, what is in review or rework, what is blocked, what needs a decision, and what runs next without opening logs or task frontmatter.
    acceptance:
      - id: A1
        outcome: The read-only `tusker factory operations [--json]` command, stable JSON API, Serve, and desktop consume one versioned projection with ordered Delivered, Working now, In review or rework, Blocked, Needs your decision, and Next frontier sections.
      - id: A2
        outcome: Rows use product outcomes, bounded causes, affected dependency closure, automatic next action, accepted artifacts, and integration or default revisions while raw logs, prompts, transcripts, YAML, heartbeats, and token totals stay in diagnostics.
      - id: A3
        outcome: The surface shows automation enabled state, configured and effective dispatch scope, armed wave fingerprint health, integration and promotion mode, capacity, resource holds, and exact pause, resume, disarm, or repair action.
      - id: A4
        outcome: Machine review, repair, gate, capacity, and infrastructure work never appears under human decisions, while genuine human gates show owner, action, verification, and affected closure.
      - id: A5
        outcome: Disabled, disarmed, stale, idle, running, review, rework, parked, human-gated, integrated, and promoted fixtures remain understandable and accessible at desktop and narrow widths.
    verification:
      - covers: A1,A2,A3,A4
        check: "command: go test ./cmd/tusker -run '^TestFactoryOperationsProjection' -count=1"
      - covers: A1,A2,A3,A4,A5
        check: "command: cd internal/serve/ui && bun test tests/factory-operations.test.ts"
    dependencies:
      - task: deterministic-review-completion
        kind: hard
    artifact:
      kind: screenshot
      path: internal/serve/ui/tests/fixtures/factory-operations.svg
      summary: Wide and narrow objective fixture showing delivery, live work, review or rework, blocked closure, true human decisions, next frontier, and opt-in authority.
      acceptance_ids: [A1, A2, A3, A4, A5]
    owned_paths:
      - cmd/tusker/factory_operations.go
      - cmd/tusker/factory_operations_test.go
      - cmd/tusker/cli.go
      - cmd/tusker/serve_command.go
      - internal/serve/ui/src
      - internal/serve/ui/tests/factory-operations.test.ts
      - internal/serve/ui/tests/fixtures/factory-operations.svg
    concurrency_group: factory-surface
    risk: medium
    priority: p1
    size: xl
    domains: [project]

  - source_key: factory-execution-e2e
    requirement_refs: [R3]
    title: Prove the complete multi-project DAG control loop
    outcome: An executable reliability fixture proves that exact opt-in waves drain through parallel and serial frontiers, review, bounded rework, integration, crash recovery, and successor dispatch without unrelated work or duplicate side effects.
    acceptance:
      - id: A1
        outcome: A two-project fixture drains hard and soft dependency DAGs with parallel frontiers, provisional soft unlock, soft relock on reviewer changes, hard unlock only after integrated done, and independent branch continuation.
      - id: A2
        outcome: Interactive work start with automation off and daemon dispatch with armed_waves on use the same ownership service, while unrelated ready tasks, disarmed waves, stale fingerprints, and disabled sibling projects never dispatch.
      - id: A3
        outcome: Review pass, changes requested, reviewer exit without result, merge conflict, red gate, infrastructure failure, human gate, attempt cap, and resource contention produce the exact retry, rework, park, or human wait without false completion.
      - id: A4
        outcome: Daemon restart and crash injection around claim, result, rework, integration, close, audit, frontier wake, and project fairness converge with no duplicate worker, reviewer, merge, close, successor claim, or ref movement.
      - id: A5
        outcome: Canonical mutations use the incremental path, raw edits recover through adaptive scan, and cold rebuild matches the final projected graph and operations brief.
      - id: A6
        outcome: Existing direct singleton, explicit all_eligible, V1 delivery-plan, wave landing, and current disabled-project behavior remain compatible.
    verification:
      - covers: A1,A2,A3,A4,A5,A6
        check: "command: go test ./cmd/tusker -run '^TestFactoryExecutionControl$' -count=1"
    dependencies:
      - task: deterministic-review-completion
        kind: hard
      - task: factory-operations-surface
        kind: hard
    artifact:
      kind: reliability_timeline
      path: cmd/tusker/factory_execution_control_e2e_test.go
      summary: Two-project opt-in ownership, DAG frontier, review, rework, integration, crash, fairness, raw-edit recovery, compatibility, and exactly-once timeline.
      acceptance_ids: [A1, A2, A3, A4, A5, A6]
    owned_paths:
      - cmd/tusker/factory_execution_control_e2e_test.go
    concurrency_group: factory-e2e
    risk: critical
    priority: p0
    size: xl
    domains: [project]

  - source_key: canonical-factory-execution-guidance
    requirement_refs: [R3]
    title: Make claimed DAG execution the canonical installed-skill contract
    outcome: Every installed Tusker agent plans multi-task work as an inert DAG, claims modifying work through the shared session protocol, and leaves routine review, landing, and successor scheduling to the opted-in daemon.
    acceptance:
      - id: A1
        outcome: The operator skill uses normative must-language for multi-task delivery-plan DAGs, inert import, epic versus wave authority, project opt-in, armed-wave dispatch scope, and one fingerprint-bound Start action.
      - id: A2
        outcome: Interactive guidance requires work start and direct implementation without starting a daemon or nested runner, while dispatched-worker guidance verifies the injected claim and never claims again.
      - id: A3
        outcome: Implementation guidance submits proof, reviewer guidance submits only a typed verdict, and all guidance assigns clean merge, close, integration, and successor scheduling to deterministic Tusker handlers.
      - id: A4
        outcome: Guidance asks users for requirements, acceptance, important tests, constraints, and genuine decisions and never makes them operate task IDs, dependency syntax, workspaces, runners, retries, review cycles, or frontiers.
      - id: A5
        outcome: Setup and rollout doctor distinguish current, stale, missing, incompatible, and locally modified canonical, symlinked, copied, and bundled installs and provide one safe sync or policy repair.
      - id: A6
        outcome: Guidance tests fail on any path that implies automatic project enablement, whole-epic execution, arbitrary lifecycle scripts, reviewer Git choreography, release authority, paid work, or unclaimed modifying work.
    verification:
      - covers: A1,A2,A3,A4,A5,A6
        check: "command: go test ./cmd/tusker -run '^TestFactoryExecutionSkillContract' -count=1"
      - covers: A1,A2,A3,A4,A5,A6
        check: "command: make skill-doctor && tusker validate --json"
    dependencies:
      - task: factory-execution-e2e
        kind: hard
    artifact:
      kind: knowledge_link
      path: skills/tusker/references/FACTORY_EXECUTION.md
      summary: Canonical route, authority, work-session, review-result, deterministic completion, failure, and user-attention contract consumed by installed agents and doctor.
      acceptance_ids: [A1, A2, A3, A4, A5, A6]
    owned_paths:
      - skills/tusker/SKILL.md
      - skills/tusker/references/FACTORY_EXECUTION.md
      - skills/tusker/references/COMMANDS.md
      - skills/tusker/references/ORCHESTRATION.md
      - skills/tusker/assets/repo-contract/AGENTS.workflow-snippet.md
      - skills/tusker/assets/repo-contract/docs/agent-workflow.md
      - docs/system/orchestration.md
      - docs/agent-workflow.md
      - cmd/tusker/skill_lifecycle_test.go
      - .tusker/knowledge/domains/project/CANON.md
    concurrency_group: factory-guidance
    knowledge_nodes:
      - .tusker/knowledge/domains/project/CANON.md
    risk: high
    priority: p0
    size: xl
    domains: [project]

  - source_key: factory-execution-dogfood-cutover
    requirement_refs: [R4]
    title: Prove factory-control shadow and rollback readiness
    outcome: Tusker can prove the new reactor's parity, isolation, and rollback readiness while legacy execution remains authoritative and automation stays disabled.
    acceptance:
      - id: A1
        outcome: A read-only doctor checks managed daemon health, project registration, automation and dispatch scope, wave authorization, runner approval, workspace isolation, integration cleanliness, skill version, review-result support, and completion-reactor feature state.
      - id: A2
        outcome: Shadow mode compares frontier, ownership, review reaction, integration decision, and successor wake without claiming, reviewing, mutating tasks, merging, closing, moving refs, or consuming model capacity.
      - id: A3
        outcome: A low-risk candidate can be assessed through shadow fixtures, operations surface, and reliability evidence without arming a wave, enabling automation, or making the reactor authoritative.
      - id: A4
        outcome: The shadow contract keeps current authoritative execution available, prevents both control loops from owning the same task or integration transaction, and routes any authority transfer to Plan 17.
      - id: A5
        outcome: Rollback stops fresh new-reactor actions while preserving live leases, task and review history, integration refs, audit facts, and one documented recovery path.
      - id: A6
        outcome: Rollout never automatically enables another repository, arms another wave, broadens all_eligible scope, starts a daemon from an agent session, disables a legacy conductor, promotes main, releases, or authorizes spending without its separate explicit boundary.
    verification:
      - covers: A1,A2,A3,A4,A5,A6
        check: "command: go test ./cmd/tusker -run '^TestFactoryExecutionCutoverDoctor' -count=1"
      - covers: A2,A3,A4,A5,A6
        check: "command: go test ./e2e/... -run '^TestFactoryExecutionShadowCutover' -count=1"
    dependencies:
      - task: factory-operations-surface
        kind: hard
      - task: canonical-factory-execution-guidance
        kind: hard
    artifact:
      kind: reliability_summary
      path: docs/runbooks/factory-execution-cutover.md
      summary: Default-off setup, shadow parity, isolation, rollback, and no-cadence-gap readiness proof and operating checklist.
      acceptance_ids: [A1, A2, A3, A4, A5, A6]
    owned_paths:
      - cmd/tusker/factory_execution_doctor.go
      - cmd/tusker/factory_execution_doctor_test.go
      - e2e/factory_execution_cutover_test.go
      - docs/runbooks/factory-execution-cutover.md
    concurrency_group: factory-rollout
    risk: critical
    priority: p0
    size: xl
    domains: [project]

  - source_key: factory-control-shadow-ready
