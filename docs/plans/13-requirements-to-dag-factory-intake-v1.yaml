schema: tusker.delivery-plan/v1
scope: factory-intake/v1
title: Requirements-to-DAG factory intake
epic: ORC
spec_refs:
  - docs/specs/13-requirements-to-dag-factory-intake.md
concurrency: 2
tasks:
  - source_key: factory-intake-contract
    title: Define the canonical factory-intake routing contract
    outcome: Every installed Tusker agent follows one machine-auditable decision table that defaults multi-task planning to an inert delivery DAG while preserving read-only analysis and lightweight singleton work.
    acceptance:
      - id: A1
        outcome: Requests to plan, decompose, task, build out, or create multi-unit implementation work route to a versioned delivery plan without requiring the user to mention Tusker, a DAG, tasks, waves, or the daemon.
      - id: A2
        outcome: Evaluation-only requests remain read-only, one genuine singleton may use the direct path, and structural scope rather than a keyword-only heuristic determines the route.
      - id: A3
        outcome: Plan creation and import grant no execution authority, while unattended work names one exact fingerprint-bound Start delivery action and never treats project setup, daemon state, release, or paid work as implied.
      - id: A4
        outcome: The contract distinguishes product questions the user owns from task IDs, epics, dependencies, runners, workspaces, proof modes, and other factory mechanics the agent must resolve.
      - id: A5
        outcome: Representative routing scenarios have stable expected modes and remedies that can be consumed by guidance tests and setup diagnostics.
    verification:
      - covers: A1,A2,A3,A4,A5
        check: "command: go test ./cmd/tusker -run '^TestFactoryIntakeContract' -count=1"
    artifact:
      kind: behavior_matrix
      path: skills/tusker/assets/factory-intake-contract.yaml
      summary: Canonical scenario-to-route matrix covering analysis, singleton, planned delivery, unattended delivery, ambiguity, and authority boundaries.
      acceptance_ids: [A1, A2, A3, A4, A5]
    owned_paths:
      - skills/tusker/assets/factory-intake-contract.yaml
      - cmd/tusker/factory_intake_contract.go
      - cmd/tusker/factory_intake_contract_test.go
      - docs/system/factory-intake.md
    concurrency_group: factory-foundation
    knowledge_nodes:
      - .tusker/knowledge/domains/project/CANON.md
    risk: high
    priority: p0
    size: l
    domains: [project]

  - source_key: delivery-plan-v2
    title: Add requirements-traceable delivery-plan V2 import
    outcome: Tusker atomically owns requirements, optional epic allocation, tasks, human gates, and wave identity from a source-keyed V2 plan while preserving V1 compatibility.
    acceptance:
      - id: A1
        outcome: V2 plans declare stable requirement outcomes and every executable task traces to at least one requirement, while uncovered or unknown requirement references fail validation.
      - id: A2
        outcome: A plan may reuse an existing epic or supply a source-keyed epic contract whose final identity is allocated by Tusker without collision or model-fabricated lifecycle metadata.
      - id: A3
        outcome: Source-keyed human gates bind exact tasks and acceptance outcomes, import atomically with the wave, and block only the affected dependency closure.
      - id: A4
        outcome: Repeated import with the same stable scope and source keys converges; changed contracts update the same records and stale authorization; conflicting scope reuse fails without partial writes.
      - id: A5
        outcome: Existing valid V1 plans continue to dry-run, import, reconcile, and fingerprint with unchanged semantics.
      - id: A6
        outcome: Strict decoding rejects unknown V2 fields and no plan input can assign final epic, task, gate, wave, event, revision, or runtime identities.
    verification:
      - covers: A1,A2,A3,A4,A5,A6
        check: "command: go test ./cmd/tusker -run '^TestDeliveryPlanV2' -count=1"
    artifact:
      kind: behavior_matrix
      path: cmd/tusker/delivery_v2_test.go
      summary: V1/V2 compatibility, traceability, atomic epic/gate/task import, idempotency, collision, rollback, and strict-decoding matrix.
      acceptance_ids: [A1, A2, A3, A4, A5, A6]
    owned_paths:
      - cmd/tusker/delivery_cmd.go
      - cmd/tusker/delivery_v2.go
      - cmd/tusker/delivery_v2_test.go
      - internal/v7schema/schema.go
    concurrency_group: factory-foundation
    knowledge_nodes:
      - .tusker/knowledge/domains/project/CANON.md
    risk: high
    priority: p0
    size: xl
    domains: [project]

  - source_key: planning-context-packet
    title: Produce a bounded deterministic planning-context packet
    outcome: An agent can ground a delivery DAG in current repository facts through one read-only packet instead of broad source or tracker excavation.
    acceptance:
      - id: A1
        outcome: The context packet binds project identity, governing spec fingerprints, relevant epic and duplicate clues, routed knowledge, test and gate commands, runners, workspace and landing policy, protected refs, and known shared resources.
      - id: A2
        outcome: Context selection is bounded to cited specs and routed domains and excludes secrets, environment values, raw logs, transcripts, unrelated tasks, and broad source contents.
      - id: A3
        outcome: Missing test, runner, knowledge, or project facts remain typed unknowns with actionable discovery or gate remedies and are never converted to invented verification.
      - id: A4
        outcome: Human-readable and stable JSON outputs explain provenance for every resolved fact and remain entirely read-only when project automation or the daemon is enabled.
      - id: A5
        outcome: Repeated context generation on unchanged inputs is stable and a material spec, configuration, test-command, or relevant knowledge change produces a new context fingerprint.
    verification:
      - covers: A1,A2,A3,A4,A5
        check: "command: go test ./cmd/tusker -run '^TestDeliveryPlanningContext' -count=1"
    dependencies:
      - task: factory-intake-contract
        kind: hard
      - task: delivery-plan-v2
        kind: hard
    artifact:
      kind: behavior_matrix
      path: cmd/tusker/delivery_context_test.go
      summary: Bounded context and provenance fixtures covering configured, unknown, secret-bearing, duplicate, stale, and automation-enabled repositories.
      acceptance_ids: [A1, A2, A3, A4, A5]
    owned_paths:
      - cmd/tusker/cli.go
      - cmd/tusker/delivery_context_cmd.go
      - cmd/tusker/delivery_context_test.go
      - cmd/tusker/delivery_cmd.go
    concurrency_group: factory-planning
    risk: high
    priority: p0
    size: xl
    domains: [project]

  - source_key: delivery-plan-doctor
    title: Reject operationally unsafe delivery DAGs before import
    outcome: A plan doctor turns requirements, acceptance, tests, dependencies, path ownership, resources, gates, and execution capacity into complete stable findings before any task record is written.
    acceptance:
      - id: A1
        outcome: The doctor reports every uncovered requirement, unmapped acceptance outcome, unfilled or unsupported proof, invalid artifact, cycle, dangling edge, assumption presented as fact, and unsupported runner in one pass.
      - id: A2
        outcome: Simultaneously runnable tasks with overlapping owned paths, generated outputs, migration allocation, or declared scarce resources are rejected unless an explicit integrator or serialization strategy makes the frontier safe.
      - id: A3
        outcome: Human-owned proof requires a source-keyed gate with an owner, action, verification, why-agent-cannot statement, and exact affected acceptance and dependency closure.
      - id: A4
        outcome: Concurrency above project, runner, resource, or global capacity is reduced or rejected with provenance rather than optimistically promised.
      - id: A5
        outcome: JSON findings use stable codes, paths, affected source keys, and exact remedies, and dry-run returns all findings without mutation.
    verification:
      - covers: A1,A2,A3,A4,A5
        check: "command: go test ./cmd/tusker -run '^TestDeliveryPlanDoctor' -count=1"
    dependencies:
      - task: delivery-plan-v2
        kind: hard
    artifact:
      kind: behavior_matrix
      path: cmd/tusker/delivery_doctor_test.go
      summary: Complete plan-quality and operational-conflict matrix with stable finding codes and remedies.
      acceptance_ids: [A1, A2, A3, A4, A5]
    owned_paths:
      - cmd/tusker/delivery_doctor.go
      - cmd/tusker/delivery_doctor_test.go
      - cmd/tusker/delivery_cmd.go
      - cmd/tusker/delivery_v2.go
      - cmd/tusker/run_ownership.go
    concurrency_group: factory-planning
    risk: high
    priority: p0
    size: xl
    domains: [project]

  - source_key: delivery-review-brief
    title: Render one product-language delivery review
    outcome: A user can understand and approve a valid factory plan from requirements, proof, decisions, and delivery flow without reading YAML or operational records.
    acceptance:
      - id: A1
        outcome: The review has exactly five primary sections—What will be delivered, How it will be proven, How work flows, What needs your decision, and Start boundary—with stable empty states and ordering.
      - id: A2
        outcome: Requirement outcomes link to task acceptance, exact important tests, artifacts, and non-goals without exposing task frontmatter, raw logs, transcripts, or routine orchestration mechanics.
      - id: A3
        outcome: The flow view shows dependency frontiers, expected concurrency, serialized integration work, rollout phases, and only conflicts or resource constraints that materially affect delivery.
      - id: A4
        outcome: The decision section contains only genuine product, authority, credential, legal, or subjective gates; machine work and internal Tusker choices never appear there.
      - id: A5
        outcome: The Start boundary binds plan and context fingerprints, reports project readiness without claiming execution, and exposes one exact next action or first actionable blocker in terminal and versioned JSON output.
    verification:
      - covers: A1,A2,A3,A4,A5
        check: "command: go test ./cmd/tusker -run '^TestDeliveryPlanReview' -count=1"
    dependencies:
      - task: planning-context-packet
        kind: hard
      - task: delivery-plan-doctor
        kind: hard
    artifact:
      kind: behavior_matrix
      path: cmd/tusker/testdata/delivery_review.txt
      summary: Golden product-language delivery review covering valid, blocked, gated, singleton, parallel, rollout, and no-decision plans.
      acceptance_ids: [A1, A2, A3, A4, A5]
    owned_paths:
      - cmd/tusker/cli.go
      - cmd/tusker/delivery_review_cmd.go
      - cmd/tusker/delivery_review_test.go
      - cmd/tusker/testdata/delivery_review.txt
    concurrency_group: factory-review
    risk: medium
    priority: p0
    size: l
    domains: [project]

  - source_key: delivery-start-transaction
    title: Add one fingerprint-bound Start delivery transaction
    outcome: One explicit user action safely reconciles a reviewed plan, preflights the resulting wave, and arms the exact fingerprint without enabling or bypassing factory infrastructure.
    acceptance:
      - id: A1
        outcome: Start requires a human actor and confirmed plan fingerprint, revalidates plan and context, atomically imports or reconciles held records, and arms only the exact resulting wave after every preflight check passes.
      - id: A2
        outcome: A changed plan, context, task contract, gate, dependency, spec, runner, workspace, or integration base refuses Start with the first actionable recompute or repair rather than using stale consent.
      - id: A3
        outcome: Repeated Start requests converge on one wave and authorization and cannot duplicate tasks, gates, daemon claims, integrations, or human events.
      - id: A4
        outcome: When import succeeds but environmental preflight fails, all members remain held and disarmed and the result names one setup action without promising autonomous completion.
      - id: A5
        outcome: Start never registers or enables a project, starts a daemon, changes runner permissions, satisfies gates, includes unrelated work, authorizes release or spend, or moves source, integration, or default refs.
      - id: A6
        outcome: A successful result reports the exact wave, authorization fingerprint, first frontier, concurrency, integration lane, and human-facing status link.
    verification:
      - covers: A1,A2,A3,A4,A5,A6
        check: "command: go test ./cmd/tusker -run '^TestDeliveryStart' -count=1"
    dependencies:
      - task: delivery-review-brief
        kind: hard
    artifact:
      kind: reliability_timeline
      path: cmd/tusker/delivery_start_test.go
      summary: Review, import, preflight, arm, replay, drift, environmental failure, and authority-boundary timeline.
      acceptance_ids: [A1, A2, A3, A4, A5, A6]
    owned_paths:
      - cmd/tusker/cli.go
      - cmd/tusker/delivery_start_cmd.go
      - cmd/tusker/delivery_start_test.go
      - cmd/tusker/v7_wave_authorization.go
    concurrency_group: factory-start
    risk: high
    priority: p0
    size: xl
    domains: [project]

  - source_key: canonical-factory-guidance
    title: Make DAG planning the canonical installed-skill default
    outcome: Canonical and generated agent guidance consistently turns multi-task requirements into held delivery DAGs and limits direct task creation to documented singleton exceptions.
    acceptance:
      - id: A1
        outcome: The operator skill uses normative must-language for multi-task factory planning, final ID ownership, dry-run/import, inertness, review, and fingerprinted Start while preserving read-only and singleton routes.
      - id: A2
        outcome: Formal intake, quick mode, command references, resources, system documentation, and repository workflow snippets use one decision table and contain no competing manual multi-task creation path.
      - id: A3
        outcome: Guidance tells agents to ask only material product questions, derive factory mechanics from repository context, and never make the user choose task IDs, epic acronyms, dependency syntax, runners, workspaces, or proof modes.
      - id: A4
        outcome: Guidance handles missing tests, ambiguity, direct implementation, unattended requests, one-node DAGs, stable re-planning, stale authorization, and unrelated existing work without widening authority.
      - id: A5
        outcome: A guidance audit fails when canonical or generated instructions omit or contradict the factory-intake contract and reports the exact source file and repair.
    verification:
      - covers: A1,A2,A3,A4,A5
        check: "command: go test ./cmd/tusker -run '^TestFactoryIntakeSkillContract' -count=1"
    dependencies:
      - task: factory-intake-contract
        kind: hard
      - task: delivery-plan-v2
        kind: hard
      - task: delivery-review-brief
        kind: hard
      - task: delivery-start-transaction
        kind: hard
    artifact:
      kind: behavior_matrix
      path: skills/tusker/references/FACTORY_INTAKE.md
      summary: Human-readable routing, planning, review, and authorization matrix consumed by every installed Tusker agent.
      acceptance_ids: [A1, A2, A3, A4, A5]
    owned_paths:
      - skills/tusker/SKILL.md
      - skills/tusker/references/FACTORY_INTAKE.md
      - skills/tusker/references/COMMANDS.md
      - skills/tusker/references/FORMAL_INTAKE.md
      - skills/tusker/references/QUICK_MODE.md
      - skills/tusker/references/RESOURCES.md
      - skills/tusker/assets/repo-contract/AGENTS.workflow-snippet.md
      - skills/tusker/assets/repo-contract/docs/agent-workflow.md
      - docs/system/skills.md
      - docs/agent-workflow.md
      - cmd/tusker/skill_lifecycle_test.go
    concurrency_group: factory-guidance
    knowledge_nodes:
      - .tusker/knowledge/domains/project/CANON.md
    risk: high
    priority: p0
    size: xl
    domains: [project]

  - source_key: serve-factory-intake
    title: Ship delivery review and Start in Serve
    outcome: The factory intake is usable as a product surface where a user reviews outcomes, proof, flow, and genuine decisions and starts the exact delivery without opening a terminal or YAML.
    acceptance:
      - id: A1
        outcome: Serve renders the same versioned five-section review projection as the CLI and deep-links requirements, tests, artifacts, gates, and the eventual wave without recomputing planning truth.
      - id: A2
        outcome: The Start delivery control displays the exact fingerprint and permitted effect, requires explicit confirmation, and calls the same import, preflight, and arm transaction as the CLI.
      - id: A3
        outcome: Invalid, changed, disabled, daemon-off, runner-blocked, shared-workspace, gated, importing, armed, running, parked, and completed states have accessible labels and one truthful next action.
      - id: A4
        outcome: Starting delivery cannot enable project automation, install the daemon, change runner permissions, satisfy a gate, authorize release or spend, or absorb unrelated tasks.
      - id: A5
        outcome: Desktop and narrow-width fixtures keep requirements, proof, decisions, and Start hierarchy understandable without exposing raw orchestration records.
    verification:
      - covers: A1,A2,A3,A4,A5
        check: "command: cd internal/serve/ui && bun test tests/factory-intake.test.ts"
    dependencies:
      - task: delivery-review-brief
        kind: hard
      - task: delivery-start-transaction
        kind: hard
    artifact:
      kind: screenshot
      path: internal/serve/ui/tests/fixtures/factory-intake-review.svg
      summary: Wide and narrow objective fixture for requirements, proof, flow, decisions, blockers, and fingerprinted Start delivery.
      acceptance_ids: [A1, A2, A3, A4, A5]
    owned_paths:
      - cmd/tusker/serve_actions.go
      - cmd/tusker/serve_types.go
      - cmd/tusker/serve_server.go
      - internal/serve/ui/src/types/domain.ts
      - internal/serve/ui/src/features/ops/ProjectOps.tsx
      - internal/serve/ui/src/features/factory/
      - internal/serve/ui/tests/factory-intake.test.ts
      - internal/serve/ui/tests/fixtures/factory-intake-review.svg
    concurrency_group: factory-surface
    risk: medium
    priority: p1
    size: xl
    domains: [project]

  - source_key: onboarding-plan-migration
    title: Migrate repository onboarding to the delivery-plan language
    outcome: Onboarding produces conservative knowledge proposals and optional requirements-traceable executable DAGs instead of a parallel task-list format with weaker validation.
    acceptance:
      - id: A1
        outcome: The onboarding prompt emits project observations, assumptions, questions, proposed epic contracts, source-keyed gates, and V2 delivery plans for executable work without assigning final Tusker identities.
      - id: A2
        outcome: Unknown commands, ownership, credentials, product decisions, and source-of-truth conflicts remain explicit questions or gates and never become fake verification or dispatchable work.
      - id: A3
        outcome: The old standalone task-list and separate executable-epic path is removed or retained only behind an explicitly labeled non-executable legacy compatibility adapter.
      - id: A4
        outcome: Imported onboarding plans are held, trace to packet evidence or labeled assumptions, and pass the same doctor, review, import, and Start boundaries as ordinary factory intake.
      - id: A5
        outcome: Existing onboarding packets remain readable and migration reports every field that cannot be converted without human intent.
    verification:
      - covers: A1,A2,A3,A4,A5
        check: "command: go test ./cmd/tusker -run '^TestOnboardDeliveryPlan' -count=1"
    dependencies:
      - task: delivery-plan-v2
        kind: hard
      - task: canonical-factory-guidance
        kind: hard
    artifact:
      kind: behavior_matrix
      path: skills/tusker/assets/templates/onboard-prompt.md
      summary: Packet-to-knowledge, requirement, gate, and executable-plan output contract with honest unknown handling.
      acceptance_ids: [A1, A2, A3, A4, A5]
    owned_paths:
      - skills/tusker/assets/templates/onboard-prompt.md
      - skills/tusker/references/REPO_CONTRACT.md
      - cmd/tusker/onboard_delivery_plan_test.go
      - docs/specs/10-repo-bootstrap-and-existing-repo-onboarding.md
    concurrency_group: factory-rollout
    risk: medium
    priority: p1
    size: l
    domains: [project]

  - source_key: skill-distribution-freshness
    title: Detect and repair stale factory-intake skill installs
    outcome: Symlink, copied, bundled, and generated Tusker skill installs expose verifiable planning-contract provenance and cannot silently retain the pre-DAG intake behavior.
    acceptance:
      - id: A1
        outcome: Canonical skill metadata names the factory-intake contract schema and source fingerprint used by planning and wave preflight.
      - id: A2
        outcome: Symlink installs resolve the canonical contract immediately while copied and bundled installs record their materialized source fingerprint and contract version.
      - id: A3
        outcome: Setup and rollout doctor distinguish current, stale, missing, incompatible, and locally modified installs and provide the exact safe skill-sync or source repair.
      - id: A4
        outcome: A wave planned under the factory contract cannot preflight with an installed skill that predates or contradicts that contract.
      - id: A5
        outcome: Sync refreshes generated installs without overwriting project knowledge, unrelated instructions, secrets, or user-authored plugin and skill content.
    verification:
      - covers: A1,A2,A3,A4,A5
        check: "command: go test ./cmd/tusker -run '^TestFactoryIntakeSkillDistribution' -count=1"
    dependencies:
      - task: canonical-factory-guidance
        kind: hard
    artifact:
      kind: reliability_summary
      path: cmd/tusker/skill_lifecycle_test.go
      summary: Symlink, copy, bundle, stale-source, local-modification, sync-repair, and preflight-compatibility proof.
      acceptance_ids: [A1, A2, A3, A4, A5]
    owned_paths:
      - cmd/tusker/install.go
      - cmd/tusker/install_test.go
      - cmd/tusker/setup_doctor.go
      - cmd/tusker/setup_doctor_test.go
      - cmd/tusker/skill_lifecycle_test.go
      - skills/tusker/SKILL.md
    concurrency_group: factory-rollout
    risk: high
    priority: p1
    size: l
    domains: [project]

  - source_key: factory-intake-e2e
    title: Prove requirements-to-delivery factory behavior end to end
    outcome: Disposable repositories prove that normal requirement language becomes a safe reviewed DAG and one authorization drains it, while analysis, singletons, drift, gates, stale skills, and absent infrastructure retain their intended boundaries.
    acceptance:
      - id: A1
        outcome: Scenario fixtures route evaluation to read-only, a small bug to singleton, multi-task planning to a held V2 DAG, and unattended delivery to review plus one fingerprint-bound Start action.
      - id: A2
        outcome: A requirements document produces complete requirement-to-task-to-acceptance-to-verification-to-artifact traceability and no user-facing step requires IDs, epics, dependency syntax, runners, workspaces, or proof modes.
      - id: A3
        outcome: After one valid Start, the managed fixture daemon drains parallel and serial frontiers through independent proof, review, rework, integration, landing, and an artifact-first brief without further routine approval.
      - id: A4
        outcome: Missing tests, human decisions, unrelated ready tasks, stale plans, stale copied skills, daemon-off state, routine machine failure, and exhausted work produce the exact safe gate, refusal, repair, or parked result without false completion.
      - id: A5
        outcome: V1 plans and direct singleton behavior remain compatible while no legacy onboarding or manual multi-task guidance bypasses the V2 doctor and review path.
      - id: A6
        outcome: A rollout runbook proves canonical symlink behavior, copy refresh, existing-project compatibility, rollback, and zero automatic enablement of project automation, scheduled promotion, release, or spend.
    verification:
      - covers: A1,A2,A3,A4,A5
        check: "command: go test ./e2e/... -run '^TestFactoryIntake' -count=1"
      - covers: A6
        check: "command: go test ./cmd/tusker -run '^TestFactoryIntakeRollout' -count=1"
    dependencies:
      - task: factory-intake-contract
        kind: hard
      - task: delivery-plan-v2
        kind: hard
      - task: planning-context-packet
        kind: hard
      - task: delivery-plan-doctor
        kind: hard
      - task: delivery-review-brief
        kind: hard
      - task: delivery-start-transaction
        kind: hard
      - task: canonical-factory-guidance
        kind: hard
      - task: serve-factory-intake
        kind: hard
      - task: onboarding-plan-migration
        kind: hard
      - task: skill-distribution-freshness
        kind: hard
    artifact:
      kind: reliability_timeline
      path: e2e/factory_intake_test.go
      summary: Requirement intake through planning, review, authorization, DAG draining, failure containment, delivery, stale-skill rollout, and rollback timeline.
      acceptance_ids: [A1, A2, A3, A4, A5, A6]
    owned_paths:
      - e2e/factory_intake_test.go
      - cmd/tusker/factory_intake_rollout_test.go
      - docs/runbooks/factory-intake-rollout.md
      - docs/specs/13-requirements-to-dag-factory-intake.md
    concurrency_group: factory-e2e
    knowledge_nodes:
      - .tusker/knowledge/domains/project/CANON.md
    risk: high
    priority: p0
    size: xl
    domains: [project]
