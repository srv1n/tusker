<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1100" viewBox="0 0 1600 1100" preserveAspectRatio="xMidYMid meet">
  <rect width="1600" height="1100" fill="#FAFAF7"/>
  <defs>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.9" fill="rgba(26,26,23,0.06)"/>
    </pattern>
  </defs>
  <rect x="80" y="240" width="1440" height="800" fill="url(#dots)"/>
  <foreignObject x="0" y="0" width="1600" height="1100">
    <div xmlns="http://www.w3.org/1999/xhtml" class="rzn"
         style="width:1600px;height:1100px;font-size:16px;line-height:1.2;font-family:'Geist Mono',ui-monospace,Menlo,monospace;color:#1A1A17;">
      <style type="text/css">
        .rzn, .rzn * { font-family:'Geist Mono',ui-monospace,Menlo,monospace; box-sizing:border-box; margin:0; padding:0; }
        .rzn .canvas { width:1600px; height:1100px; padding:64px 96px 56px; display:flex; flex-direction:column; }
        .rzn .body { flex:1; min-height:0; display:flex; flex-direction:column; gap:32px; margin-top:48px; }

        .rzn .stages { display:flex; align-items:center; padding:8px 0; }
        .rzn .stage { flex:1; display:flex; justify-content:center; }
        .rzn .node { padding:22px 26px; border:1.5px solid #3A352D; border-radius:10px; background:#FAFAF7; min-width:200px; text-align:center; }
        .rzn .node.active { border-color:#3F6F1A; background:rgba(63,111,26,0.08); }
        .rzn .node.terminal { border-color:#1A1A17; background:#1A1A17; color:#FAFAF7; }
        .rzn .node .name { font-size:22px; font-weight:700; letter-spacing:-0.01em; }
        .rzn .node .tech { font-size:13px; color:#6B6558; margin-top:6px; }
        .rzn .node.terminal .tech { color:rgba(250,250,247,0.55); }
        .rzn .gap { flex:0 0 80px; height:0; border-top:2px solid #3A352D; position:relative; }
        .rzn .gap::after { content:""; position:absolute; right:-1px; top:-7px; width:0; height:0; border-left:10px solid #3A352D; border-top:7px solid transparent; border-bottom:7px solid transparent; }
        .rzn .gap.acc { border-top-color:#3F6F1A; }
        .rzn .gap.acc::after { border-left-color:#3F6F1A; }
        .rzn .gap-label { position:absolute; top:-30px; left:50%; transform:translateX(-50%); font-size:11px; font-weight:600; letter-spacing:0.20em; text-transform:uppercase; color:#6B6558; background:#FAFAF7; padding:0 8px; white-space:nowrap; }

        .rzn .branches { display:grid; grid-template-columns: repeat(3, 1fr); gap:24px; }
        .rzn .branch { padding:20px 22px; border:1.5px dashed rgba(26,26,23,0.25); border-radius:10px; background:#FAFAF7; }
        .rzn .branch .head { display:flex; align-items:center; justify-content:space-between; margin-bottom:10px; }
        .rzn .branch .name { font-size:20px; font-weight:700; color:#1A1A17; }
        .rzn .branch .tag { font-size:10px; font-weight:600; letter-spacing:0.20em; text-transform:uppercase; color:#6B6558; }
        .rzn .branch .desc { font-size:14px; color:#3A352D; line-height:1.55; }

        .rzn .verify { display:flex; align-items:center; gap:20px; padding:20px 26px; border:1.5px solid #3F6F1A; background:rgba(63,111,26,0.08); border-radius:10px; }
        .rzn .verify .pin { width:14px; height:14px; border-radius:999px; background:#3F6F1A; flex:0 0 auto; }
        .rzn .verify .text { font-size:16px; color:#1A1A17; line-height:1.5; flex:1; }
        .rzn .verify .text .v { font-weight:700; }
      </style>
      <div class="canvas">
        <div style="font-size:13px;font-weight:600;letter-spacing:0.20em;color:#3A352D;text-transform:uppercase;display:flex;align-items:center;gap:14px;line-height:1;">
          <span style="width:10px;height:10px;background:#3F6F1A;border-radius:999px;display:inline-block;"></span>
          <span>TUSKER &#160;·&#160; 04</span>
        </div>
        <div style="font-size:52px;font-weight:700;letter-spacing:-0.015em;line-height:1.05;color:#1A1A17;margin-top:24px;">Agents drive. Humans gate.</div>
        <div style="font-size:18px;font-weight:400;line-height:1.45;color:#3A352D;max-width:1200px;margin-top:16px;">Each transition writes a row to <code style="font-family:inherit;color:#3F6F1A;font-weight:600;">transitions[]</code>. At <code style="font-family:inherit;font-weight:600;">risk &gt;= high</code> the validator blocks <code style="font-family:inherit;font-weight:600;">done</code> until a verification and docs impact resolve.</div>

        <div class="body">
          <div class="stages">
            <div class="stage"><div class="node"><div class="name">intake</div><div class="tech">spec written</div></div></div>
            <div class="gap"><span class="gap-label">review</span></div>
            <div class="stage"><div class="node active"><div class="name">active</div><div class="tech">agent runs</div></div></div>
            <div class="gap"><span class="gap-label">verify</span></div>
            <div class="stage"><div class="node"><div class="name">review</div><div class="tech">evidence ready</div></div></div>
            <div class="gap acc"><span class="gap-label" style="color:#3F6F1A;">close gate</span></div>
            <div class="stage"><div class="node terminal"><div class="name">done</div><div class="tech">locked</div></div></div>
          </div>

          <div class="verify">
            <span class="pin"></span>
            <div class="text">
              <span class="v">risk &gt;= high</span> — the validator refuses <code style="font-family:inherit;">status: done</code> without a verification. <span class="v">critical</span> also requires a rollback-owner review.
            </div>
          </div>

          <div class="branches">
            <div class="branch">
              <div class="head"><span class="name">blocked</span><span class="tag">↔ ACTIVE</span></div>
              <div class="desc">Sets <code style="font-family:inherit;">blocked_since</code>. Use for upstream incidents or awaiting input.</div>
            </div>
            <div class="branch">
              <div class="head"><span class="name">rework</span><span class="tag">REVIEW → ACTIVE</span></div>
              <div class="desc">Reviewer rejected verification. Loops back to <code style="font-family:inherit;">active</code>; evidence is preserved.</div>
            </div>
            <div class="branch">
              <div class="head"><span class="name">cancelled</span><span class="tag">TERMINAL</span></div>
              <div class="desc">Sets <code style="font-family:inherit;">cancelled_at</code>. Spec stays in the vault — git remembers the reasoning.</div>
            </div>
          </div>
        </div>

        <div style="height:40px;display:flex;align-items:center;justify-content:space-between;border-top:1px solid rgba(26,26,23,0.12);padding-top:18px;font-size:12px;font-weight:500;letter-spacing:0.18em;color:#6B6558;text-transform:uppercase;margin-top:24px;">
          <span>TUSKER &#160;·&#160; TASK LIFECYCLE</span><span>04 / 04</span>
        </div>
      </div>
    </div>
  </foreignObject>
</svg>
