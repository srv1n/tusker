<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1100" viewBox="0 0 1600 1100" preserveAspectRatio="xMidYMid meet">
  <rect width="1600" height="1100" fill="#FAFAF7"/>
  <defs>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.9" fill="rgba(26,26,23,0.06)"/>
    </pattern>
  </defs>
  <rect x="80" y="240" width="1440" height="800" fill="url(#dots)"/>
  <foreignObject x="0" y="0" width="1600" height="1100">
    <div xmlns="http://www.w3.org/1999/xhtml" class="rzn"
         style="width:1600px;height:1100px;font-size:16px;line-height:1.2;font-family:'Geist Mono',ui-monospace,Menlo,monospace;color:#1A1A17;">
      <style type="text/css">
        .rzn, .rzn * { font-family:'Geist Mono',ui-monospace,Menlo,monospace; box-sizing:border-box; margin:0; padding:0; }
        .rzn .canvas { width:1600px; height:1100px; padding:64px 96px 56px; display:flex; flex-direction:column; }
        .rzn .body { flex:1; min-height:0; display:grid; grid-template-columns: 1fr 220px 1fr; gap:0; align-items:center; margin-top:48px; }

        .rzn .col-eyebrow { font-size:13px; font-weight:600; letter-spacing:0.20em; text-transform:uppercase; color:#6B6558; margin-bottom:20px; display:flex; align-items:center; gap:12px; }
        .rzn .col-eyebrow .swatch { width:12px; height:12px; border-radius:999px; display:inline-block; }

        .rzn .repos { display:flex; flex-direction:column; gap:20px; }
        .rzn .repo { border:1.5px solid #3F6F1A; border-radius:10px; background:#FAFAF7; overflow:hidden; }
        .rzn .repo-header { padding:14px 20px; background:rgba(63,111,26,0.08); border-bottom:1px solid rgba(63,111,26,0.20); }
        .rzn .repo-name { font-size:18px; font-weight:700; color:#1A1A17; }
        .rzn .tree { padding:14px 20px; font-size:15px; line-height:1.85; color:#3A352D; }
        .rzn .tree .dim { color:#6B6558; }
        .rzn .tree .hl { color:#1A1A17; font-weight:700; }
        .rzn .tree .br { color:#3F6F1A; font-weight:600; }

        .rzn .vault { border:1.5px solid #1A4596; border-radius:10px; background:#FAFAF7; overflow:hidden; }
        .rzn .vault-header { padding:16px 22px; border-bottom:1px solid rgba(26,69,150,0.20); background:rgba(26,69,150,0.08); }
        .rzn .vault-name { font-size:20px; font-weight:700; color:#1A1A17; }
        .rzn .vault-tag { font-size:11px; font-weight:600; letter-spacing:0.18em; text-transform:uppercase; color:#1A4596; margin-top:4px; }
        .rzn .vault-body { padding:18px 22px; font-size:16px; line-height:1.85; color:#3A352D; }
        .rzn .vault-body .row { display:flex; align-items:center; gap:10px; }
        .rzn .vault-body .arrow { color:#6B6558; }
        .rzn .vault-body .target { color:#1A4596; }
        .rzn .vault-body .name { color:#1A1A17; font-weight:700; }
        .rzn .vault-foot { padding:14px 22px; border-top:1px solid rgba(26,26,23,0.10); font-size:13px; color:#6B6558; line-height:1.55; }

        .rzn .conn { display:flex; flex-direction:column; align-items:stretch; justify-content:center; gap:48px; height:100%; padding:32px 12px; }
        .rzn .link-block { display:flex; flex-direction:column; gap:8px; }
        .rzn .link-row { display:flex; align-items:center; }
        .rzn .link { flex:1; height:0; border-top:1.5px dashed #1A4596; }
        .rzn .head-right { width:0; height:0; border-left:10px solid #1A4596; border-top:6px solid transparent; border-bottom:6px solid transparent; }
        .rzn .link-label { text-align:center; font-size:11px; font-weight:600; letter-spacing:0.20em; text-transform:uppercase; color:#1A4596; }
      </style>
      <div class="canvas">
        <div style="font-size:13px;font-weight:600;letter-spacing:0.20em;color:#3A352D;text-transform:uppercase;display:flex;align-items:center;gap:14px;line-height:1;">
          <span style="width:10px;height:10px;background:#3F6F1A;border-radius:999px;display:inline-block;"></span>
          <span>TUSKER &#160;·&#160; 02</span>
        </div>
        <div style="font-size:52px;font-weight:700;letter-spacing:-0.015em;line-height:1.05;color:#1A1A17;margin-top:24px;">Repo is truth. Obsidian is view.</div>
        <div style="font-size:18px;font-weight:400;line-height:1.45;color:#3A352D;max-width:1200px;margin-top:16px;">Each repo's <code style="font-family:inherit;color:#3F6F1A;font-weight:600;">tusker/</code> folder ships with the code. One Obsidian vault symlinks every repo. Edits land back through the link.</div>

        <div class="body">
          <div>
            <div class="col-eyebrow"><span class="swatch" style="background:#3F6F1A;"></span>SOURCE OF TRUTH</div>
            <div class="repos">
              <div class="repo">
                <div class="repo-header"><span class="repo-name">~/code/app-a</span></div>
                <div class="tree">
                  <div><span class="dim">├──</span> src/</div>
                  <div><span class="dim">└──</span> <span class="hl">tusker/</span> <span class="br">← committed</span></div>
                </div>
              </div>
              <div class="repo">
                <div class="repo-header"><span class="repo-name">~/code/app-b</span></div>
                <div class="tree">
                  <div><span class="dim">├──</span> src/</div>
                  <div><span class="dim">└──</span> <span class="hl">tusker/</span></div>
                </div>
              </div>
              <div class="repo">
                <div class="repo-header"><span class="repo-name">~/code/mobile</span></div>
                <div class="tree">
                  <div><span class="dim">├──</span> ios/</div>
                  <div><span class="dim">└──</span> <span class="hl">tusker/</span></div>
                </div>
              </div>
            </div>
          </div>

          <div class="conn">
            <div class="link-block">
              <div class="link-label">SYMLINK</div>
              <div class="link-row"><div class="link"></div><div class="head-right"></div></div>
            </div>
            <div class="link-block">
              <div class="link-label">SYMLINK</div>
              <div class="link-row"><div class="link"></div><div class="head-right"></div></div>
            </div>
            <div class="link-block">
              <div class="link-label">SYMLINK</div>
              <div class="link-row"><div class="link"></div><div class="head-right"></div></div>
            </div>
          </div>

          <div>
            <div class="col-eyebrow"><span class="swatch" style="background:#1A4596;"></span>ONE VIEW</div>
            <div class="vault">
              <div class="vault-header">
                <div class="vault-name">~/Obsidian/Work</div>
                <div class="vault-tag">VAULT · iCLOUD OPTIONAL</div>
              </div>
              <div class="vault-body">
                <div class="row"><span class="name">app-a</span><span class="arrow">→</span><span class="target">/code/app-a/tusker/</span></div>
                <div class="row"><span class="name">app-b</span><span class="arrow">→</span><span class="target">/code/app-b/tusker/</span></div>
                <div class="row"><span class="name">mobile</span><span class="arrow">→</span><span class="target">/code/mobile/tusker/</span></div>
              </div>
              <div class="vault-foot">
                One window. Many repos. Edits flow back through the symlink. The vault stores no canon — only views.
              </div>
            </div>
          </div>
        </div>

        <div style="height:40px;display:flex;align-items:center;justify-content:space-between;border-top:1px solid rgba(26,26,23,0.12);padding-top:18px;font-size:12px;font-weight:500;letter-spacing:0.18em;color:#6B6558;text-transform:uppercase;margin-top:24px;">
          <span>TUSKER &#160;·&#160; SOURCE AND VIEW</span><span>02 / 04</span>
        </div>
      </div>
    </div>
  </foreignObject>
</svg>
