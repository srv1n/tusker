non_goals:
- Do not dispatch workers, enable automation or publish as part of planning.
- Do not omit contract content to meet a token target or substitute static evidence for live acceptance.
- Do not duplicate CFX-T-0001 or the existing FLW-T-0002 through FLW-T-0005 repairs.
requirements:
- id: R1
  outcome: The installed CLI, skills and UI pass the declared support matrix, including failure/recovery and measured
    cost; release limitations are explicit.
concurrency: 1
summary: The installed CLI, skills and UI pass the declared support matrix, including failure/recovery and measured
  cost; release limitations are explicit.
tasks:
- source_key: full-journey
  title: Prove spec-to-task-to-execution-to-reviewed-proof end to end
  outcome: 'Run a representative project from constraints and a locked decision through imported DAG, safe parallel
    work, a real failure, recovery, independent review, evidence, closeout and documentation update. Token objective:
    Report all retries and recovery context in the same cost ledger as the happy path.'
  acceptance:
  - id: A1
    outcome: Run a representative project from constraints and a locked decision through imported DAG, safe parallel
      work, a real failure, recovery, independent review, evidence, closeout and documentation update.
  - id: A2
    outcome: Inject stale plans, false artifacts, revoked authority, provider interruption and overlapping ownership.
      Require zero unauthorized starts, lost changes, false completions or stale-review acceptance.
  - id: A3
    outcome: Make every failure actionable and resumable; publish an outcome/evidence matrix and distinguish deterministic
      fixtures, compiled tests, live harness proof and human acceptance.
  verification:
  - covers: A1
    check: 'command: go test ./e2e/contractconvergence -run "^TestContractConvergence$" -count=1 -v && go test ./e2e/crashrecovery -run "^TestSpecToWaveDelivery$" -count=1 -v'
    notes: 'Future regression must execute, not match zero tests. Required scenario evidence: Reproducible offline
      integration journey plus the supported live-provider journey; the full Go suite must be green or the release
      fails.'
  - covers: A2
    check: 'command: go test ./cmd/tusker -run "^(TestDeliveryPlanV2RefusesFrozenV1WaveContractSwap|TestV7LandingAuthorityRejectsForgedReceiptAndRuntimeRecord|TestV7FullGateProviderOutcomeJournalRejectsTampering)$" -count=1 -v'
    notes: 'Future regression must execute, not match zero tests. Required scenario evidence: Reproducible offline
      integration journey plus the supported live-provider journey; the full Go suite must be green or the release
      fails.'
  - covers: A3
    check: 'command: go test ./e2e/executionobservability -run "^TestExecutionObservability$" -count=1 -v'
    notes: 'Future regression must execute, not match zero tests. Required scenario evidence: Reproducible offline
      integration journey plus the supported live-provider journey; the full Go suite must be green or the release
      fails.'
  artifact:
    kind: diff_summary
    path: docs/reports/trust-evidence/full-journey.md
    summary: Reproducible offline integration journey plus the supported live-provider journey; the full Go suite
      must be green or the release fails. Include actual commands, executed cases, revision, host, results and durable
      artifact links; do not claim a planned check passed.
    acceptance_ids:
    - A1
    - A2
    - A3
  owned_paths:
  - e2e/contractconvergence/contract_convergence_test.go
  - e2e/crashrecovery/crash_recovery_test.go
  - docs/reports/trust-evidence/full-journey.md
