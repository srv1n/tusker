- source_key: installed-pilot
  title: Validate installation, upgrades and a real downstream pilot
  outcome: 'Validate shipped binary, installed skill and Mac bundle versions together from a fresh install and an
    existing-project upgrade; preserve task/spec/proof identities and data with a tested recovery path. Token objective:
    Compare actual pilot context/usage with W0 fixtures and retain uncertainty where provider accounting is absent.'
  acceptance:
  - id: A1
    outcome: Validate shipped binary, installed skill and Mac bundle versions together from a fresh install and
      an existing-project upgrade; preserve task/spec/proof identities and data with a tested recovery path.
  - id: A2
    outcome: Run at least one real downstream repository with bounded concurrency and explicit supported harness/version
      matrix. Any missing credentials, spend authorization or subjective acceptance becomes a specific real gate
      when encountered.
  - id: A3
    outcome: 'Publish go/no-go evidence: all required tests pass, no unresolved trust/data-loss defect, no hidden
      unavailable capability, fresh-agent journey succeeds, token targets pass and human proof is inspectable. Repeat
      the affected gate after a fix; do not rerun unrelated expensive suites.'
  verification:
  - covers: A1
    check: 'command: go test ./cmd/tusker -run "^(TestFreshCloneBaselineCLIRunsHelpAndV7Init|TestInstalledCapabilityManifest|TestSkillBundleProvenanceIsPortable)$" -count=1 -v'
    notes: 'Future regression must execute, not match zero tests. Required scenario evidence: Installed-runtime
      smoke and upgrade preservation checks, pilot transcripts, artifact inspection and a signed-off release checklist
      tied to exact versions.'
  - covers: A2
    check: 'command: go test ./cmd/tusker -run "^(TestInstallCommandInstallsRepoSkillsWithoutBinary|TestInstallCommandCopyModeMaterializesRepoSkills|TestSkillBundleMaterializesPortableCopies)$" -count=1 -v'
    notes: 'Future regression must execute, not match zero tests. Required scenario evidence: Installed-runtime
      smoke and upgrade preservation checks, pilot transcripts, artifact inspection and a signed-off release checklist
      tied to exact versions.'
  - covers: A3
    check: 'command: go test ./cmd/tusker -run "^(TestInstalledCapabilityManifest|TestSkillBundleProvenanceIsPortable|TestV7FullGateProviderFixtureReceiptSatisfiesLifecycleContract)$" -count=1 -v'
    notes: 'Future regression must execute, not match zero tests. Required scenario evidence: Installed-runtime
      smoke and upgrade preservation checks, pilot transcripts, artifact inspection and a signed-off release checklist
      tied to exact versions.'
  artifact:
    kind: diff_summary
    path: docs/reports/trust-evidence/installed-pilot.md
    summary: Installed-runtime smoke and upgrade preservation checks, pilot transcripts, artifact inspection and
      a signed-off release checklist tied to exact versions. Include actual commands, executed cases, revision,
      host, results and durable artifact links; do not claim a planned check passed.
    acceptance_ids:
    - A1
    - A2
    - A3
