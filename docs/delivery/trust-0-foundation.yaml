- source_key: state-integrity
  title: Make state revisions, reconciliation and snapshot invalidation reliable
  outcome: 'Stale body edits fail compare-and-swap; successful mutations recompute revisions under lock and publish
    exactly the state actually saved. Token objective: Prevents repeat reads, unnecessary refresh events and recovery
    loops.'
  acceptance:
  - id: A1
    outcome: Stale body edits fail compare-and-swap; successful mutations recompute revisions under lock and publish
      exactly the state actually saved.
  - id: A2
    outcome: Targeted reconciliation changes only the selected record; dry-run reports stale terminal records without
      writes; stale attempts repair once; identical refresh emits no event and changed snapshots do.
  - id: A3
    outcome: Interrupted writes and competing mutations preserve the last committed state, fail visibly and recover
      idempotently; no unrelated task or user file is lost.
  verification:
  - covers: A1
    check: 'command: go test ./cmd/tusker -run "^(TestV7DocumentCASRejectsBodyOnlyHumanEditWithStaleStateRev|TestV7ModelTaskWriteRoundTripKeepsStateRev|TestV7DocumentCASConcurrentProcessesAllowExactlyOneWriter)$" -count=1 -v'
    notes: 'Future regression must execute, not match zero tests. Required scenario evidence: Reproduce the six
      state/snapshot failures listed in the audit and add the smallest adversarial interleaving regression at the
      shared mutation boundary. Resolve actual source owner paths before editing.'
  - covers: A2
    check: 'command: go test ./cmd/tusker -run "^(TestServeSnapshotCacheReusesBuildAndInvalidatesPerProject|TestServeSnapshotIdenticalRefreshEmitsNoProjectionEvent|TestV7TargetedReconcileRepairsOnlySelectedTask|TestV7ReconcileDryRunEnumeratesInvalidStateRevsWithoutWrites|TestV7ReconcileRepairsStaleObjectStateRevAndEmitsEvent)$" -count=1 -v'
    notes: 'Future regression must execute, not match zero tests. Required scenario evidence: Reproduce the six
      state/snapshot failures listed in the audit and add the smallest adversarial interleaving regression at the
      shared mutation boundary. Resolve actual source owner paths before editing.'
  - covers: A3
    check: 'command: go test ./cmd/tusker -run "^(TestV7DocumentCASAtomicFailuresPreserveOriginal|TestV7DocumentCASParentDirectorySyncFailureIsReportedAfterRename|TestV7DocumentCASConcurrentProcessesAllowExactlyOneWriter)$" -count=1 -v'
    notes: 'Future regression must execute, not match zero tests. Required scenario evidence: Reproduce the six
      state/snapshot failures listed in the audit and add the smallest adversarial interleaving regression at the
      shared mutation boundary. Resolve actual source owner paths before editing.'
  artifact:
