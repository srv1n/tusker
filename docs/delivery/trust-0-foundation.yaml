- source_key: token-baseline
  title: Measure total downstream workflow context and token cost
  outcome: 'Capture versioned fixtures for small/medium/large task contracts and 10/100/1000-document repositories,
    including a long contract, branching DAG, blocked gate, failed proof and resumed job. Token objective: This
    task supplies the denominator for every savings claim.'
  acceptance:
  - id: A1
    outcome: Capture versioned fixtures for small/medium/large task contracts and 10/100/1000-document repositories,
      including a long contract, branching DAG, blocked gate, failed proof and resumed job.
  - id: A2
    outcome: 'Measure cold and warm bootstrap, discovery, next, packet, verification, review, recovery and completion:
      input/output bytes, declared tokenizer counts when available, tool calls, turns, elapsed time and repeated
      context. Store raw bounded transcripts or hashes plus reproducible extraction.'
  - id: A3
    outcome: Report real provider usage separately as cached input, uncached input and output when supplied; absent
      usage remains unknown. Offline fixture size is never labelled billed cost. Use at least five identical-condition
      repetitions for latency medians and record variance.
  - id: A4
    outcome: Freeze the candidate budgets in this roadmap against the measured baseline before optimization. Document
      any necessary revision and rationale; do not lower a target merely to pass.
  verification:
  - covers: A1
    check: 'command: python3 scripts/measure-agent-workflows.py --check --baseline docs/reports/agent-efficiency/token-baseline.json --fixtures docs/reports/agent-efficiency/fixtures-v2.json'
