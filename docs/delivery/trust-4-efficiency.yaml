tasks:
- source_key: compact-cli
  title: Make routine CLI reads bounded and directly actionable
  outcome: 'Reuse current capsule, next, proof-status and structured output before adding switches. Default agent
    reads contain stable IDs, revision, state/reason, next action and only relevant routing links. Token objective:
    Candidate ceilings: routine next/status <=350 tokens, capsule <=500 tokens; mandatory contract packets are excluded.'
  acceptance:
  - id: A1
    outcome: Reuse current capsule, next, proof-status and structured output before adding switches. Default agent
      reads contain stable IDs, revision, state/reason, next action and only relevant routing links.
  - id: A2
    outcome: Lists are bounded with explicit truncation and complete follow-up navigation; a single routine status
      call does not dump bodies, logs, whole waves or repeated global instructions.
  - id: A3
    outcome: Meet the frozen routine-output budgets against small and large fixtures; errors stay parseable and
      actionable with matching human-readable meaning.
  verification:
  - covers: A1
    check: 'command: go test ./cmd/tusker -run "^TestTrustCompactCli$" -count=1 -v'
    notes: 'Future regression must execute, not match zero tests. Required scenario evidence: Golden semantic field
      assertions plus measured output budgets; large-vault fixture proves bounded response and navigable remainder.'
  - covers: A2
    check: 'command: go test ./cmd/tusker -run ^TestTrustCompactCli$ -count=1 -v'
    notes: 'Future regression must execute, not match zero tests. Required scenario evidence: Golden semantic field
      assertions plus measured output budgets; large-vault fixture proves bounded response and navigable remainder.'
  - covers: A3
    check: 'command: go test ./cmd/tusker -run ^TestTrustCompactCli$ -count=1 -v'
    notes: 'Future regression must execute, not match zero tests. Required scenario evidence: Golden semantic field
      assertions plus measured output budgets; large-vault fixture proves bounded response and navigable remainder.'
  artifact:
    kind: diff_summary
    path: docs/reports/trust-evidence/compact-cli.md
    summary: Golden semantic field assertions plus measured output budgets; large-vault fixture proves bounded response
      and navigable remainder. Include actual commands, executed cases, revision, host, results and durable artifact
      links; do not claim a planned check passed.
    acceptance_ids:
    - A1
    - A2
    - A3
