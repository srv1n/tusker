  outcome: 'Adopt one spec/decision resolver and compatible scaffolds across skills, docs commands and traceability;
    retain existing paths/aliases and do not silently bless arbitrary source files as governing specs. Token objective:
    Candidate routing metadata average <=50 tokens/document and initial shortlist <=800 tokens; full documents remain
    retrievable.'
  acceptance:
  - id: A1
    outcome: Adopt one spec/decision resolver and compatible scaffolds across skills, docs commands and traceability;
      retain existing paths/aliases and do not silently bless arbitrary source files as governing specs.
  - id: A2
    outcome: For 100/1000 documents, return a small relevant shortlist with read/skip guidance and stable links;
      selected nodes reveal details on demand. Preserve constraints, decisions and supersession relations.
  - id: A3
    outcome: Verify FLW-T-0005 metadata search and measure routing relevance as well as size; the right mandatory
      spec/decision is found in all curated regression scenarios without listing the entire tree.
