- source_key: context-reuse
  title: Avoid resending unchanged context across harness calls
  outcome: 'Identify repeated content in measured traces; first remove duplication and reuse existing packet/revision
    machinery. Add cache/delta logic only where those changes cannot meet the frozen workflow budget. Token objective:
    Candidate >=30% reduction in median routine Tusker context tokens versus W0; no higher tool-call count solely
    to hide context.'
  acceptance:
  - id: A1
    outcome: Identify repeated content in measured traces; first remove duplication and reuse existing packet/revision
      machinery. Add cache/delta logic only where those changes cannot meet the frozen workflow budget.
  - id: A2
    outcome: Reuse stable content only under task/spec/capability revision identity. Material edits, stale cursors,
      lost sessions and changed authority force a complete safe refresh; a fresh harness never receives an unexplained
      delta.
  - id: A3
    outcome: Use native prompt caching only for adapters that actually support it. Record cached versus uncached
      usage where available; maintain a full-content fallback and cap retrieval round trips.
  verification:
  - covers: A1
    check: 'command: python3 scripts/measure-agent-workflows.py --check --baseline docs/reports/agent-efficiency/token-baseline.json --fixtures docs/reports/agent-efficiency/fixtures-v2.json'
    notes: 'Future regression must execute, not match zero tests. Required scenario evidence: Cold/warm/edited/restarted
      session equivalence checks on complete mandatory content, plus workflow token/tool-call comparisons.'
  - covers: A2
    check: 'command: go test ./cmd/tusker -run "^(TestExecutionGraphMemoizedWalkMatchesNaiveWalk|TestCodexPayloadStringBoundsDepthAndVisits|TestV7PacketPreservesCompleteTaskContract)$" -count=1 -v'
    notes: 'Future regression must execute, not match zero tests. Required scenario evidence: Cold/warm/edited/restarted
      session equivalence checks on complete mandatory content, plus workflow token/tool-call comparisons.'
  - covers: A3
    check: 'command: go test ./cmd/tusker -run "^(TestV7ModelTaskWriteRoundTripKeepsStateRev|TestProfileRunRecordAndReviewPacketIncludeProfileHarnessModel|TestExecutionLifecycleUnknownSessionMergesPriorEvidence)$" -count=1 -v'
    notes: 'Future regression must execute, not match zero tests. Required scenario evidence: Cold/warm/edited/restarted
      session equivalence checks on complete mandatory content, plus workflow token/tool-call comparisons.'
  artifact:
    kind: diff_summary
    path: docs/reports/trust-evidence/context-reuse.md
    summary: Cold/warm/edited/restarted session equivalence checks on complete mandatory content, plus workflow
