- source_key: efficiency-gate
  title: Enforce total workflow cost and completeness regression budgets
  outcome: 'Run the same baseline corpus through the new workflow: onboarding, discovery, success, proof failure,
    gate and resume. Publish before/after input, output, calls, turns, latency and completeness, with exact versions.
    Token objective: Candidate warm bootstrap <=1200 tokens; p95 tools/latency no >10% regression on deterministic
    comparable workloads; report total agent-job cost separately.'
  acceptance:
  - id: A1
    outcome: 'Run the same baseline corpus through the new workflow: onboarding, discovery, success, proof failure,
      gate and resume. Publish before/after input, output, calls, turns, latency and completeness, with exact versions.'
  - id: A2
    outcome: Meet frozen targets; require zero omitted normative requirements and zero false closes. Large mandatory
      contracts may exceed size targets only with an explicit report; never truncate them.
  - id: A3
    outcome: Add a cheap deterministic CI regression gate for fixture context size and semantics; reserve billed/live
      runs for release checkpoints. Detect repeated context regressions and tokenizer/version changes.
  verification:
  - covers: A1
    check: 'command: python3 scripts/measure-agent-workflows.py --check --baseline docs/reports/agent-efficiency/token-baseline.json --fixtures docs/reports/agent-efficiency/fixtures-v2.json'
