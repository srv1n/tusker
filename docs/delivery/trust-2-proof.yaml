non_goals:
- Do not dispatch workers, enable automation or publish as part of planning.
- Do not omit contract content to meet a token target or substitute static evidence for live acceptance.
- Do not duplicate CFX-T-0001 or the existing FLW-T-0002 through FLW-T-0005 repairs.
requirements:
- id: R1
  outcome: Completion requires current, criterion-covered artifacts and an independent review; wrong, missing or
    stale proof cannot close a task.
concurrency: 1
summary: Completion requires current, criterion-covered artifacts and an independent review; wrong, missing or stale
  proof cannot close a task.
tasks:
- source_key: artifact-contract
  title: Bind proof to the promised artifact and current task
  outcome: 'Enforce the existing artifact contract: required kind, acceptance coverage, path policy, readable durable
    artifact and applicable task/code revision. Unrelated artifact-bearing evidence cannot satisfy it. Token objective:
    Return missing criterion IDs and exact repair actions rather than replaying all evidence.'
  acceptance:
  - id: A1
    outcome: 'Enforce the existing artifact contract: required kind, acceptance coverage, path policy, readable
      durable artifact and applicable task/code revision. Unrelated artifact-bearing evidence cannot satisfy it.'
  - id: A2
    outcome: Reject unknown proof requirement classes when authored with an actionable error; legacy handling is
      explicit and never quietly treated as passing.
  - id: A3
    outcome: Missing, replaced, stale, mismatched-type and out-of-scope artifacts fail completion; successful evidence
      survives scratch cleanup and records a hash or equivalent immutable identity.
  verification:
  - covers: A1
    check: 'command: go test ./cmd/tusker -run "^TestTrustArtifactContract$" -count=1 -v'
    notes: 'Future regression must execute, not match zero tests. Required scenario evidence: Public close attempts
      with each invalid artifact and one valid artifact; preserve evidence ordering and CAS recovery invariants.'
  - covers: A2
    check: 'command: go test ./cmd/tusker -run "^TestTrustArtifactContract$" -count=1 -v'
    notes: 'Future regression must execute, not match zero tests. Required scenario evidence: Public close attempts
      with each invalid artifact and one valid artifact; preserve evidence ordering and CAS recovery invariants.'
  - covers: A3
    check: 'command: go test ./cmd/tusker -run "^TestTrustArtifactContract$" -count=1 -v'
    notes: 'Future regression must execute, not match zero tests. Required scenario evidence: Public close attempts
      with each invalid artifact and one valid artifact; preserve evidence ordering and CAS recovery invariants.'
  artifact:
    kind: diff_summary
    path: docs/reports/trust-evidence/artifact-contract.md
    summary: Public close attempts with each invalid artifact and one valid artifact; preserve evidence ordering
      and CAS recovery invariants. Include actual commands, executed cases, revision, host, results and durable
      artifact links; do not claim a planned check passed.
    acceptance_ids:
    - A1
    - A2
    - A3
  owned_paths:
  - cmd/tusker/v7_proof_cmd.go
  - cmd/tusker/trust_artifact_contract_test.go
  - docs/reports/trust-evidence/artifact-contract.md
