- source_key: proof-categories
  title: Define useful visual, performance, backend and migration proof
  outcome: 'Visual changes require comparable before/after views; new UI needs an after view plus stated absence
    of a baseline. Performance proof includes before/after workload, units, method, environment and revision. Token
    objective: Small typed summaries link to full evidence; avoid screenshot/log dumps in every agent context.'
  acceptance:
  - id: A1
    outcome: Visual changes require comparable before/after views; new UI needs an after view plus stated absence
      of a baseline. Performance proof includes before/after workload, units, method, environment and revision.
  - id: A2
    outcome: Backend proof covers observable behavior and relevant negative cases; migration proof checks preservation,
      interruption and recovery/rollback expectations using realistic data.
  - id: A3
    outcome: Use existing artifact/evidence records with only fields needed to validate these requirements; automated
      checks establish structure and provenance, while subjective quality remains an explicit acceptance decision.
  verification:
  - covers: A1
    check: 'command: go test ./cmd/tusker -run "^TestTrustProofCategories$" -count=1 -v'
    notes: 'Future regression must execute, not match zero tests. Required scenario evidence: One passing and one
      materially misleading failing fixture for each category, including a benchmark whose workload changed and
      a migration losing data.'
  - covers: A2
    check: 'command: go test ./cmd/tusker -run "^TestTrustProofCategories$" -count=1 -v'
    notes: 'Future regression must execute, not match zero tests. Required scenario evidence: One passing and one
      materially misleading failing fixture for each category, including a benchmark whose workload changed and
      a migration losing data.'
  - covers: A3
    check: 'command: go test ./cmd/tusker -run "^TestTrustProofCategories$" -count=1 -v'
    notes: 'Future regression must execute, not match zero tests. Required scenario evidence: One passing and one
      materially misleading failing fixture for each category, including a benchmark whose workload changed and
      a migration losing data.'
  artifact:
    kind: diff_summary
    path: docs/reports/trust-evidence/proof-categories.md
    summary: One passing and one materially misleading failing fixture for each category, including a benchmark
      whose workload changed and a migration losing data. Include actual commands, executed cases, revision, host,
      results and durable artifact links; do not claim a planned check passed.
    acceptance_ids:
    - A1
    - A2
    - A3
