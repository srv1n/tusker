- source_key: review-closeout
  title: Require fresh independent review and readable completion receipts
  outcome: 'A review is bound to the reviewed material and evidence; subsequent meaningful changes invalidate it,
    and the implementing attempt cannot masquerade as independent review. Token objective: Review packets contain
    current relevant evidence once, with drilldown for logs.'
  acceptance:
  - id: A1
    outcome: A review is bound to the reviewed material and evidence; subsequent meaningful changes invalidate it,
      and the implementing attempt cannot masquerade as independent review.
  - id: A2
    outcome: A reviewer sees full relevant acceptance and proof without unrelated history; unresolved findings prevent
      close and rework clears the obsolete approval.
  - id: A3
    outcome: The final human receipt lists outcomes, exact checks, artifact links, remaining limitations and human
      gates; wave totals never relabel or inflate proof.
  verification:
  - covers: A1
    check: 'command: go test ./cmd/tusker -run "^TestTrustReviewCloseout$" -count=1 -v'
    notes: 'Future regression must execute, not match zero tests. Required scenario evidence: Implement-review-edit-close
      and reject-rework-review-close walkthroughs, plus rendered/readable completion receipt inspection.'
  - covers: A2
    check: 'command: go test ./cmd/tusker -run "^TestTrustReviewCloseout$" -count=1 -v'
    notes: 'Future regression must execute, not match zero tests. Required scenario evidence: Implement-review-edit-close
      and reject-rework-review-close walkthroughs, plus rendered/readable completion receipt inspection.'
  - covers: A3
    check: 'command: go test ./cmd/tusker -run "^TestTrustReviewCloseout$" -count=1 -v'
    notes: 'Future regression must execute, not match zero tests. Required scenario evidence: Implement-review-edit-close
      and reject-rework-review-close walkthroughs, plus rendered/readable completion receipt inspection.'
  artifact:
    kind: diff_summary
    path: docs/reports/trust-evidence/review-closeout.md
    summary: Implement-review-edit-close and reject-rework-review-close walkthroughs, plus rendered/readable completion
      receipt inspection. Include actual commands, executed cases, revision, host, results and durable artifact
      links; do not claim a planned check passed.
    acceptance_ids:
    - A1
    - A2
    - A3
