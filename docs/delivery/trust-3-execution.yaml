- source_key: workspace-recovery
  title: Preserve work through crashes, caps and shared Git activity
  outcome: 'Reverify FLW-T-0004 and active-owner pruning fixes; failed Git setup never launches a worker and corrupt
    runtime state never authorizes deletion. Token objective: Reuse workspaces and resumable context safely; avoid
    full reimplementation after restart.'
  acceptance:
  - id: A1
    outcome: Reverify FLW-T-0004 and active-owner pruning fixes; failed Git setup never launches a worker and corrupt
      runtime state never authorizes deletion.
  - id: A2
    outcome: Crash/restart retains unlanded work, checkpoints and task ownership; cleanup requires established ownership
      and safe disposal. Test dirty, active, orphaned and missing workspaces.
  - id: A3
    outcome: Shared-checkout Git mutations serialize while disjoint source edits remain possible; worktree/disk
      caps account for active work and preserve reuse of existing build caches without inventing a new cache service.
  verification:
  - covers: A1
    check: 'command: go test ./cmd/tusker -run "^TestTrustWorkspaceRecovery$" -count=1 -v'
    notes: 'Future regression must execute, not match zero tests. Required scenario evidence: Temporary real Git
      repositories, killed/restarted worker fixtures, cap pressure and conflicting Git operations; inspect preserved
      files and durable records.'
  - covers: A2
    check: 'command: go test ./cmd/tusker -run "^TestTrustWorkspaceRecovery$" -count=1 -v'
    notes: 'Future regression must execute, not match zero tests. Required scenario evidence: Temporary real Git
      repositories, killed/restarted worker fixtures, cap pressure and conflicting Git operations; inspect preserved
      files and durable records.'
  - covers: A3
    check: 'command: go test ./cmd/tusker -run "^TestTrustWorkspaceRecovery$" -count=1 -v'
    notes: 'Future regression must execute, not match zero tests. Required scenario evidence: Temporary real Git
