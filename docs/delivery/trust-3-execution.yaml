- source_key: daemon-process
  title: Make resident daemon and worker lifecycle observable and recoverable
  outcome: 'Interactive commands never spawn a resident daemon or nested worker implicitly. Only enabled automation
    with a valid authorized claim dispatches; read-only plan, doctor and status remain inert. Token objective: Bound
    idle wakeups, retry context and log tails; no repeated full snapshots while nothing changed.'
  acceptance:
  - id: A1
    outcome: Interactive commands never spawn a resident daemon or nested worker implicitly. Only enabled automation
      with a valid authorized claim dispatches; read-only plan, doctor and status remain inert.
  - id: A2
    outcome: Test start, stop, graceful shutdown, forced termination, restart and stale PID/process identity. Cancellation
      reaches owned child processes; unrelated processes survive; stopped work cannot later report success.
  - id: A3
    outcome: Recover durable attempts after restart without duplicate launches; use bounded retry/backoff and a
      terminal actionable failure. A failed task does not cause daemon-wide busy loops or starve independent work.
  - id: A4
    outcome: Expose one compact health/status view joining daemon identity, queue/frontier, active attempts, last
      meaningful failure and next action. Idle unchanged operation emits no repetitive agent prompts or human notifications;
      logs are bounded and on demand.
  verification:
  - covers: A1
    check: 'command: go test ./cmd/tusker -run "^TestTrustDaemonProcess$" -count=1 -v'
    notes: 'Future regression must execute, not match zero tests. Required scenario evidence: Process-level temporary-project
      test with real child process termination/restart and fake providers; assert process ownership, launch counts,
      durable outcomes and idle polling/event volume.'
  - covers: A2
    check: 'command: go test ./cmd/tusker -run "^TestTrustDaemonProcess$" -count=1 -v'
    notes: 'Future regression must execute, not match zero tests. Required scenario evidence: Process-level temporary-project
      test with real child process termination/restart and fake providers; assert process ownership, launch counts,
      durable outcomes and idle polling/event volume.'
  - covers: A3
    check: 'command: go test ./cmd/tusker -run "^TestTrustDaemonProcess$" -count=1 -v'
    notes: 'Future regression must execute, not match zero tests. Required scenario evidence: Process-level temporary-project
      test with real child process termination/restart and fake providers; assert process ownership, launch counts,
      durable outcomes and idle polling/event volume.'
  - covers: A4
    check: 'command: go test ./cmd/tusker -run "^TestTrustDaemonProcess$" -count=1 -v'
    notes: 'Future regression must execute, not match zero tests. Required scenario evidence: Process-level temporary-project
      test with real child process termination/restart and fake providers; assert process ownership, launch counts,
      durable outcomes and idle polling/event volume.'
  artifact:
