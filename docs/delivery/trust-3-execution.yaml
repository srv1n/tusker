tasks:
- source_key: dag-leases
  title: Execute only safe authorized DAG frontiers
  outcome: 'Independent ready branches can progress while a sibling waits or fails; dependent work cannot start
    early and nothing launches outside the armed scope. Token objective: A bounded frontier/next response replaces
    full graph reloads and polling loops.'
  acceptance:
  - id: A1
    outcome: Independent ready branches can progress while a sibling waits or fails; dependent work cannot start
      early and nothing launches outside the armed scope.
  - id: A2
    outcome: Two workers racing for a task or shared capacity yield at most one valid claim; expired leases cannot
      commit results after reassignment.
  - id: A3
    outcome: Owned paths, generated outputs, migration keys and named resources constrain concurrency across waves;
      collisions serialize without globally serializing unrelated tasks.
  verification:
  - covers: A1
    check: 'command: go test ./cmd/tusker -run "^TestTrustDagLeases$" -count=1 -v'
    notes: 'Future regression must execute, not match zero tests. Required scenario evidence: Deterministic scheduler
      fixtures with a branching DAG, races, failure and lease expiry; assert actual starts and blocked reasons.'
  - covers: A2
    check: 'command: go test ./cmd/tusker -run "^TestTrustDagLeases$" -count=1 -v'
    notes: 'Future regression must execute, not match zero tests. Required scenario evidence: Deterministic scheduler
      fixtures with a branching DAG, races, failure and lease expiry; assert actual starts and blocked reasons.'
  - covers: A3
    check: 'command: go test ./cmd/tusker -run "^TestTrustDagLeases$" -count=1 -v'
    notes: 'Future regression must execute, not match zero tests. Required scenario evidence: Deterministic scheduler
      fixtures with a branching DAG, races, failure and lease expiry; assert actual starts and blocked reasons.'
  artifact:
    kind: diff_summary
    path: docs/reports/trust-evidence/dag-leases.md
    summary: Deterministic scheduler fixtures with a branching DAG, races, failure and lease expiry; assert actual
      starts and blocked reasons. Include actual commands, executed cases, revision, host, results and durable artifact
      links; do not claim a planned check passed.
    acceptance_ids:
    - A1
    - A2
    - A3
