non_goals:
  - Do not change the CFX-T-0001 or FLW-T-0002 through FLW-T-0029 source keys; tracker IDs may be freshly allocated after a verified current-only reinitialization.
  - Do not keep version-suffixed shadow scopes or duplicate live tasks; old IDs remain only in the external export and source-key mapping.
  - Do not erase active contracts, proof, evidence, attempts, or leases before a verified export.
  - Do not enable automation, arm a wave, dispatch a daemon worker, or create a human receipt.
requirements:
  - id: R1
    outcome: The repository is deliberately current-only, with unused V5/V6/V7 compatibility surfaces removed only after a source-bound reachability inventory.
summary: Remove unused compatibility surfaces for the current-only target while preserving the current V7 contract and every retained task source key.
concurrency: 1
tasks:
  - source_key: current-only-cleanup
    title: Remove unused V5/V6/V7 compatibility surfaces for the current-only target
    outcome: The current source and its documentation describe one supported V7 target; unused V5/V6/V7 compatibility code, scaffolds, and tests are removed after reachability evidence, while required current behavior remains covered.
    acceptance:
      - id: A1
        outcome: Inventory every V5/V6/V7 compatibility surface in the current source, tests, generated contracts, and docs; classify each as reachable current behavior, required migration input, or unused deletion candidate with file-level evidence.
      - id: A2
        outcome: Remove only verified-unused compatibility surfaces and update current-only contracts and docs; preserve CFX-T-0001, FLW-T-0002 through FLW-T-0029, and their source keys and evidence obligations.
      - id: A3
        outcome: Run real current-source tests and validation for the affected paths, record exact commands and observed output, and prove that no planned selector matches zero tests or an artificial aggregator.
    verification:
      - covers: A1
        check: 'command: go test ./cmd/tusker -run ''^(TestV7NewTaskRejectsLegacyTaskIDBeforeWriting|TestV7ValidateReportsMixedLayoutTaskCollisionRepair)$'' -count=1 -v'
        notes: 'These are existing source tests for current V7 collision boundaries; supplement with the file-level inventory and reachability manifest.'
      - covers: A2
        check: 'command: go test ./cmd/tusker -run ''^(TestFreshCloneBaselineCLIRunsHelpAndV7Init|TestV7GuardrailTopLevelHelpAndBootstrapDoNotExposeLegacyDocsTaxonomy)$'' -count=1 -v'
        notes: 'These are existing current-source initialization and guardrail scenarios; record any deliberately retained migration input separately.'
      - covers: A3
        check: 'command: go test ./cmd/tusker -run ''^(TestV7VerificationGrammarIsToolIndependent|TestV7GuardrailVerificationTablePassRowsAreStructuredProof)$'' -count=1 -v'
        notes: 'The command must execute named tests and report PASS/FAIL; zero-match or wrapper-only output is insufficient.'
    artifact:
      kind: diff_summary
      path: docs/reports/trust-evidence/current-only-cleanup.md
      summary: Source-bound compatibility inventory, deletion/reachability decisions, current-only contract changes, exact test output, and preserved task/evidence keys.
      acceptance_ids:
        - A1
        - A2
        - A3
    owned_paths:
      - cmd/tusker/removed_surfaces.go
      - cmd/tusker/frontmatter.go
      - cmd/tusker/config.go
      - cmd/tusker/commands_index.go
      - cmd/tusker/runner_profiles.go
      - docs/reports/trust-evidence/current-only-cleanup.md
    domains:
      - project
    complexity: complex
    risk: high
