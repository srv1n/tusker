- source_key: enforcement-lint
  title: Enforce real boundaries without becoming a bureaucratic middleman
  outcome: 'Publish one rule inventory with owner, rationale, severity and enforcement point. Hard failures are
    limited to malformed execution contracts, invalid authority, unsafe ownership/state and unmet explicit completion
    requirements; prose style and advisory quality suggestions remain warnings. Token objective: Lint saves troubleshooting
    turns and remains scoped; metadata and warnings do not become repetitive prompt payloads.'
  acceptance:
  - id: A1
    outcome: Publish one rule inventory with owner, rationale, severity and enforcement point. Hard failures are
      limited to malformed execution contracts, invalid authority, unsafe ownership/state and unmet explicit completion
      requirements; prose style and advisory quality suggestions remain warnings.
  - id: A2
    outcome: CLI, daemon, process handoff and closeout call the same applicable checks. A worker cannot bypass a
      hard invariant by choosing another entry point, and read-only discovery is not blocked by unrelated warning
      debt.
  - id: A3
    outcome: Lint supports scoped deterministic findings, stable codes, source locations and a repair action. Repeated
      unchanged warnings are summarized once; no blanket full-repo lint, report, approval or documentation ceremony
      is required for a routine low-risk change.
  - id: A4
    outcome: 'Compare routine success and failure journeys before/after: no duplicated state reporting, no mandatory
      empty fields or speculative gates, no extra human intervention, and no safety regression. Provide a documented
      narrow exception only for advisory rules; never a universal bypass for authority or data safety.'
  verification:
  - covers: A1
    check: 'command: go test ./cmd/tusker -run "^(TestTrustEnforcementLintRejectsUnknownProofRequirement|TestTrustEnforcementLintRejectsMalformedEvidenceIdentity)$" -count=1 -v'
    notes: 'Future regression must execute, not match zero tests. Required scenario evidence: Cross-entry-point
      invariant tests plus a tiny valid change with existing unrelated warning debt; count mandatory commands and
      human interventions.'
  - covers: A2
    check: 'command: go test ./cmd/tusker -run "^(TestV7ProofMutationsRejectForgedActors|TestV7ValidationRejectsSecretsInAnyRecordKind|TestV7ValidationFlagsVagueAndMisroutedHumanGates)$" -count=1 -v'
    notes: 'Future regression must execute, not match zero tests. Required scenario evidence: Cross-entry-point
      invariant tests plus a tiny valid change with existing unrelated warning debt; count mandatory commands and
      human interventions.'
  - covers: A3
    check: 'command: go test ./cmd/tusker -run "^(TestV7ProofMatchingRejectsKeywordTheater|TestV7ProofReportKeepsMachineProofMissingActionable|TestV7VerificationDiagnosticsCarryGrammar)$" -count=1 -v'
    notes: 'Future regression must execute, not match zero tests. Required scenario evidence: Cross-entry-point
      invariant tests plus a tiny valid change with existing unrelated warning debt; count mandatory commands and
      human interventions.'
  - covers: A4
    check: 'command: go test ./cmd/tusker -run "^(TestV7CloseRequiresAcceptanceCoverageOrWaiver|TestV7CloseRequiresReviewStatus|TestV7AttemptHandoffRequiresProofBeforeReview)$" -count=1 -v'
    notes: 'Future regression must execute, not match zero tests. Required scenario evidence: Cross-entry-point
      invariant tests plus a tiny valid change with existing unrelated warning debt; count mandatory commands and
      human interventions.'
