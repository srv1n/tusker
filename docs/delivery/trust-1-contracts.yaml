- source_key: human-receipts
  title: Accept conversational human decisions with verifiable authority
  outcome: 'Use one authority rule for every human-owned gate. An agent actor or arbitrary human: string cannot
    satisfy a human decision, including generic signoff gates. Token objective: Settled decisions are reused at
    their exact scope; genuine new material still requires a new answer.'
  acceptance:
  - id: A1
    outcome: 'Use one authority rule for every human-owned gate. An agent actor or arbitrary human: string cannot
      satisfy a human decision, including generic signoff gates.'
  - id: A2
    outcome: Reuse a trusted interaction receipt mechanism if one exists; otherwise implement the smallest receipt
      producer and verifier bound to the specific gate, material revision, action and human answer, with replay
      protection and revocation/expiry rules documented.
  - id: A3
    outcome: 'Exercise an actual supported human interaction surface: a human answers yes once and the assistant
      records it without asking them to run CLI commands. Altered, stale, cross-task and replayed receipts fail.
      If no trusted producer is available, retain an explicit unsupported state and do not claim conversational
      approval shipped.'
  verification:
  - covers: A1
    check: 'command: go test ./cmd/tusker -run "^(TestV7GateCreationRejectsVagueHumanGates|TestV7ProposalActorRejectsHumanImpersonationInAgentSessionEvenWithForceOrLocal|TestV7ProofMutationsRejectForgedActors)$" -count=1 -v'
    notes: 'Future regression must execute, not match zero tests. Required scenario evidence: Forged/stale/replayed
      receipt negative tests plus one end-to-end trusted-producer interaction; capture a redacted receipt and visible
      gate result.'
  - covers: A2
    check: 'command: go test ./cmd/tusker -run "^TestTrustHumanReceipts$" -count=1 -v'
    notes: 'Future regression must execute, not match zero tests. Required scenario evidence: Forged/stale/replayed
      receipt negative tests plus one end-to-end trusted-producer interaction; capture a redacted receipt and visible
      gate result.'
  - covers: A3
    check: 'manual proof: Launch the current TuskerBar human-action surface, answer one current gate once, capture the redacted receipt and visible gate result, then retry the same receipt and record the typed replay refusal.'
    notes: 'Future regression must execute, not match zero tests. Required scenario evidence: Forged/stale/replayed
      receipt negative tests plus one end-to-end trusted-producer interaction; capture a redacted receipt and visible
      gate result.'
  artifact:
    kind: diff_summary
    path: docs/reports/trust-evidence/human-receipts.md
    summary: Forged/stale/replayed receipt negative tests plus one end-to-end trusted-producer interaction; capture
      a redacted receipt and visible gate result. Include actual commands, executed cases, revision, host, results
      and durable artifact links; do not claim a planned check passed.
    acceptance_ids:
    - A1
    - A2
    - A3
