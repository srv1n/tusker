  outcome: 'Creation, status-ready, next, dispatch and delivery preview/write agree on malformed contracts and frozen-plan
    refusals, with stable reason codes and a next action. Token objective: One compact actionable refusal replaces
    trial-and-error commands.'
  acceptance:
