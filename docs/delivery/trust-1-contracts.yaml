    outcome: Creation, status-ready, next, dispatch and delivery preview/write agree on malformed contracts and
      frozen-plan refusals, with stable reason codes and a next action.
  - id: A2
    outcome: A complete dependent task remains valid while waiting on dependencies; contract validity is not conflated
      with readiness or wave authorization.
  - id: A3
    outcome: Race a preview against material edits and require mutation-time revalidation. Exercise current CFX
      immutable-base behavior without duplicating or weakening it.
  verification:
  - covers: A1
    check: 'command: go test ./cmd/tusker -run "^TestTrustPreflight$" -count=1 -v'
