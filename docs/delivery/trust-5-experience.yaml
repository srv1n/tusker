- source_key: fresh-agent
  title: Pass a cold-start downstream agent usability trial
  outcome: 'A fresh agent with only shipped bootstrap guidance completes one routine task, one blocked/recovered
    task and one evidence-rejected/reworked task in a temporary downstream repo. Token objective: The acceptance
    metric is correct jobs completed per total context/cost, not smallest individual response.'
  acceptance:
  - id: A1
    outcome: A fresh agent with only shipped bootstrap guidance completes one routine task, one blocked/recovered
      task and one evidence-rejected/reworked task in a temporary downstream repo.
  - id: A2
    outcome: No source excavation, private commands, maintainer coaching, forged approval or unauthorized daemon
      launch is needed. Record any intervention as failure, with the first misleading instruction.
  - id: A3
    outcome: Compare at least two supported harnesses and cold/warm sessions; report task success, human interventions,
      calls, tokens when measurable and time. Product uncertainty prompts one targeted question, not a generic approval
      loop.
  verification:
  - covers: A1
    check: 'command: go test ./e2e/contractconvergence -run "^TestContractConvergence$" -count=1 -v'
    notes: 'Future regression must execute, not match zero tests. Required scenario evidence: Offline/scripted walkthrough
      first, then actual available harness trials with redacted transcripts and evidence; if a supported live harness
      is unavailable because credentials or spend authorization are missing, record that encountered boundary as a
      named gate.'
  - covers: A2
    check: 'command: go test ./cmd/tusker -run "^(TestSkillTaskManagementProtocol|TestExecutionModeInstructionsForbidNestedRunners|TestInteractiveExecutionContract)$" -count=1 -v'
    notes: 'Future regression must execute, not match zero tests. Required scenario evidence: Offline/scripted walkthrough
      first, then actual available harness trials with redacted transcripts and evidence; if a supported live harness
      is unavailable because credentials or spend authorization are missing, record that encountered boundary as a
      named gate.'
  - covers: A3
    check: 'command: python3 scripts/measure-agent-workflows.py --check --baseline docs/reports/agent-efficiency/token-baseline.json --fixtures docs/reports/agent-efficiency/fixtures-v2.json'
    notes: 'Future regression must execute, not match zero tests. Required scenario evidence: Offline/scripted walkthrough
      first, then actual available harness trials with redacted transcripts and evidence; if a supported live harness
      is unavailable because credentials or spend authorization are missing, record that encountered boundary as a
      named gate.'
  artifact:
    kind: diff_summary
    path: docs/reports/trust-evidence/fresh-agent.md
    summary: Offline/scripted walkthrough first, then actual available harness trials with redacted transcripts
      and evidence; record a named gate only if a missing credential or spend authorization is encountered. Include actual commands, executed
      cases, revision, host, results and durable artifact links; do not claim a planned check passed.
    acceptance_ids:
    - A1
    - A2
    - A3
