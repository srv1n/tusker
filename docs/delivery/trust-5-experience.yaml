- source_key: docs-lifecycle
  title: Keep the complete documentation and instruction chain authoritative
  outcome: 'Define the ownership chain for root bootstrap instructions, installed operator skill, project skill/canon,
    product specs, decisions, runbooks and evidence. Each meaning has one owning source and conditional links; shipped/generated
    copies expose provenance and update safely without overwriting user-owned instructions. Token objective: Measure
    the full bootstrap-to-canon route including tool calls; avoid both giant manuals and tiny-file fetch chains.'
  acceptance:
  - id: A1
    outcome: Define the ownership chain for root bootstrap instructions, installed operator skill, project skill/canon,
      product specs, decisions, runbooks and evidence. Each meaning has one owning source and conditional links;
      shipped/generated copies expose provenance and update safely without overwriting user-owned instructions.
  - id: A2
    outcome: Scaffold readable what/why/constraints before technical detail; support durable decisions, diagrams,
      sources and Obsidian links. Search, backlinks, supersession and generated maps agree with actual files and
      share the resolver from document-routing.
  - id: A3
    outcome: Change one public behavior and show exactly which owning doc and shipped example need updating. Freshness
      reflects checked source/version evidence rather than mass timestamp updates; deprecations retain discoverable
      replacement routes.
  - id: A4
    outcome: A routine code-only fix requires a doc change only when its public behavior, contract or operating
      knowledge changed. Broken mandatory routes fail the affected contract; unrelated old/style warnings stay advisory.
      Prune duplicated/no-op instructions and verify installed examples from a fresh downstream workspace.
  verification:
  - covers: A1
    check: 'command: go test ./cmd/tusker -run "^(TestV7SkillKnowledgeEndToEnd|TestV7SkillDoctorRouteAndPack|TestSkillBundleProvenanceIsPortable)$" -count=1 -v'
    notes: 'Future regression must execute, not match zero tests. Required scenario evidence: Source-to-installed
      provenance and user-customization preservation fixtures; rename/supersede/broken-route tests; a documentation-required
      change and a documentation-not-needed change.'
  - covers: A2
    check: 'command: go test ./cmd/tusker -run "^TestTrustDocsLifecycle$" -count=1 -v'
    notes: 'Future regression must execute, not match zero tests. Required scenario evidence: Source-to-installed
      provenance and user-customization preservation fixtures; rename/supersede/broken-route tests; a documentation-required
      change and a documentation-not-needed change.'
  - covers: A3
    check: 'command: go test ./cmd/tusker -run "^(TestV7SpecRefsFrontmatterAndValidation|TestV7SpecRefsSurfaceInCapsulePacketAndAutomationPlan)$" -count=1 -v'
    notes: 'Future regression must execute, not match zero tests. Required scenario evidence: Source-to-installed
      provenance and user-customization preservation fixtures; rename/supersede/broken-route tests; a documentation-required
      change and a documentation-not-needed change.'
  - covers: A4
    check: 'command: go test ./cmd/tusker -run "^(TestTrustDocsLifecycle|TestV7SkillKnowledgeEndToEnd|TestSkillBundleProvenanceIsPortable)$" -count=1 -v'
    notes: 'Future regression must execute, not match zero tests. Required scenario evidence: Source-to-installed
      provenance and user-customization preservation fixtures; rename/supersede/broken-route tests; a documentation-required
      change and a documentation-not-needed change.'
  artifact:
    kind: diff_summary
    path: docs/reports/trust-evidence/docs-lifecycle.md
    summary: Source-to-installed provenance and user-customization preservation fixtures; rename/supersede/broken-route
      tests; a documentation-required change and a documentation-not-needed change. Include actual commands, executed
      cases, revision, host, results and durable artifact links; do not claim a planned check passed.
    acceptance_ids:
    - A1
    - A2
    - A3
    - A4
