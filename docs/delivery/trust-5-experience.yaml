tasks:
- source_key: graph-ui
  title: Show consistent diagrams, backlinks and proof in the Mac interface
  outcome: 'Expose the same defined relationships in CLI graph JSON, Mermaid and UI; unresolved links are visible
    and navigation preserves the selected task/spec context. Token objective: Humans inspect artifacts directly;
    agents fetch concise structured state instead of screenshotting the entire UI.'
  acceptance:
  - id: A1
    outcome: Expose the same defined relationships in CLI graph JSON, Mermaid and UI; unresolved links are visible
      and navigation preserves the selected task/spec context.
  - id: A2
    outcome: Render Mermaid safely and provide a readable fallback; task detail connects intent, blockers, current
      attempt and evidence without exposing implementation jargon in routine flows.
  - id: A3
    outcome: Capture before/after screenshots of changed flows and inspect keyboard navigation, focus, contrast
      and error states. Preserve unrelated current UI edits by confirming file ownership first.
  verification:
  - covers: A1
    check: 'command: go test ./cmd/tusker -run "^(TestV7SpecRefsSurfaceInCapsulePacketAndAutomationPlan|TestServeHumanActionContractAndReviewProjection)$" -count=1 -v'
    notes: 'Future regression must execute, not match zero tests. Required scenario evidence: Graph fixture equivalence,
      rendering/security checks and actual UI walkthrough with saved screenshot evidence.'
  - covers: A2
    check: 'command: cd internal/serve/ui && bun test tests/graph-ui.test.ts tests/task-search.test.ts tests/wave-brief.test.ts'
    notes: 'Future regression must execute, not match zero tests. Required scenario evidence: Graph fixture equivalence,
      rendering/security checks and actual UI walkthrough with saved screenshot evidence.'
  - covers: A3
    check: 'command: cd internal/serve/ui && bun test tests/graph-ui.test.ts tests/task-search.test.ts tests/wave-brief.test.ts tests/human-action.test.ts'
    notes: 'Future regression must execute, not match zero tests. Required scenario evidence: Graph fixture equivalence,
      rendering/security checks and actual UI walkthrough with saved screenshot evidence.'
  artifact:
    kind: diff_summary
    path: docs/reports/trust-evidence/graph-ui.md
    summary: Graph fixture equivalence, rendering/security checks and actual UI walkthrough with saved screenshot
      evidence. Include actual commands, executed cases, revision, host, results and durable artifact links; do
      not claim a planned check passed.
    acceptance_ids:
    - A1
    - A2
    - A3
