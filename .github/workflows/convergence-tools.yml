name: convergence-tools

on:
  pull_request:

permissions:
  contents: read

jobs:
  reproduction-tools:
    if: github.head_ref == 'srv1nc/tusker-convergence-finish'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version-file: go.mod
      - name: Prepare public toolchain and dependency cache for offline test reproduction
        env:
          GOMODCACHE: ${{ runner.temp }}/convergence-modules
        run: |
          go mod download
          mkdir -p "$RUNNER_TEMP/convergence-tools"
          tar -czf "$RUNNER_TEMP/convergence-tools/go.tar.gz" -C "$(go env GOROOT)" .
          tar -czf "$RUNNER_TEMP/convergence-tools/modules.tar.gz" -C "$GOMODCACHE" .
          go version > "$RUNNER_TEMP/convergence-tools/version.txt"
          sha256sum "$RUNNER_TEMP/convergence-tools/"*.tar.gz > "$RUNNER_TEMP/convergence-tools/checksums.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: convergence-offline-tools
          path: ${{ runner.temp }}/convergence-tools
          retention-days: 1
          if-no-files-found: error
