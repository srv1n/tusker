name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Install pinned Minisign
        run: |
          scripts/install-pinned-minisign.sh "${RUNNER_TEMP}/tusker-tools"
          echo "${RUNNER_TEMP}/tusker-tools" >>"${GITHUB_PATH}"

      - name: Validate protected signed release tag
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
          RELEASE_TRUSTED_TAG_SIGNER: ${{ vars.TUSKER_RELEASE_TAG_SIGNER_FINGERPRINT }}
        run: |
          set -eu
          scripts/release-validate.sh --check-only
          test "$(git rev-parse "${RELEASE_VERSION}^{commit}")" = "${GITHUB_SHA}"
          test -n "${RELEASE_TRUSTED_TAG_SIGNER}" || { echo 'Trusted tag signer fingerprint is not configured.' >&2; exit 1; }
          scripts/release-verify-tag.sh "${RELEASE_VERSION}"

      - name: Run check suite
        run: make check

      - name: Build release artifacts
        env:
          RELEASE_MINISIGN_SECRET_KEY: ${{ secrets.TUSKER_MINISIGN_SECRET_KEY }}
          RELEASE_TRUSTED_TAG_SIGNER: ${{ vars.TUSKER_RELEASE_TAG_SIGNER_FINGERPRINT }}
        run: |
          set -eu
          test -n "${RELEASE_MINISIGN_SECRET_KEY}" || { echo 'TUSKER_MINISIGN_SECRET_KEY is required; release signing is fail-closed.' >&2; exit 1; }
          umask 077
          signing_key="$(mktemp)"
          cleanup() { rm -f "${signing_key}"; }
          trap cleanup EXIT
          trap 'exit 129' HUP
          trap 'exit 130' INT
          trap 'exit 143' TERM
          printf '%s' "${RELEASE_MINISIGN_SECRET_KEY}" >"${signing_key}"
          chmod 600 "${signing_key}"
          RELEASE_MINISIGN_SECRET_KEY_FILE="${signing_key}" make release-artifacts RELEASE_VERSION="${GITHUB_REF_NAME}"

      - name: Upload release bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ github.ref_name }}
          path: dist/releases/${{ github.ref_name }}/*
          if-no-files-found: error

  publish:
    runs-on: ubuntu-24.04
    needs: build
    environment: release
    permissions:
      contents: write
    steps:
      - name: Check out trusted tag policy
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0

      - name: Download release bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-${{ github.ref_name }}
          path: dist/releases/${{ github.ref_name }}

      - name: Install pinned Minisign
        run: |
          scripts/install-pinned-minisign.sh "${RUNNER_TEMP}/tusker-tools"
          echo "${RUNNER_TEMP}/tusker-tools" >>"${GITHUB_PATH}"

      - name: Verify signed release envelope
        env:
          TAG_NAME: ${{ github.ref_name }}
          RELEASE_TRUSTED_TAG_SIGNER: ${{ vars.TUSKER_RELEASE_TAG_SIGNER_FINGERPRINT }}
        run: |
          set -eu
          test "$(git rev-parse "${TAG_NAME}^{commit}")" = "${GITHUB_SHA}"
          scripts/release-verify-tag.sh "${TAG_NAME}"
          release_dir="dist/releases/${TAG_NAME}"
          minisign -Vm "${release_dir}/MANIFEST.sha256" -p scripts/release-minisign.pub -x "${release_dir}/MANIFEST.sha256.minisig"
          (cd "${release_dir}" && sha256sum -c MANIFEST.sha256)

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -eu
          if gh release view "${TAG_NAME}" >/dev/null 2>&1; then
            echo "Release ${TAG_NAME} already exists; immutable publishing refuses replacement." >&2
            exit 1
          fi
          gh release create "${TAG_NAME}" dist/releases/"${TAG_NAME}"/* --title "${TAG_NAME}" --generate-notes
