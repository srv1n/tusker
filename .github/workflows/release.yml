name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Run check suite
        run: make check

      - name: Build release artifacts
        run: make release-artifacts RELEASE_VERSION="${GITHUB_REF_NAME}"

      - name: Upload release bundle
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ github.ref_name }}
          path: dist/releases/${{ github.ref_name }}/*
          if-no-files-found: error

  publish:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download release bundle
        uses: actions/download-artifact@v8
        with:
          name: release-${{ github.ref_name }}
          path: dist/releases/${{ github.ref_name }}

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -eu
          if gh release view "${TAG_NAME}" >/dev/null 2>&1; then
            gh release upload "${TAG_NAME}" dist/releases/"${TAG_NAME}"/* --clobber
          else
            gh release create "${TAG_NAME}" dist/releases/"${TAG_NAME}"/* --title "${TAG_NAME}" --generate-notes
          fi
