name: convergence-apply

on:
  pull_request:

permissions:
  contents: read

jobs:
  publish-tested-source:
    if: github.repository == 'srv1n/tusker' && github.event.pull_request.number == 8 && github.event.pull_request.head.repo.full_name == 'srv1n/tusker' && github.head_ref == 'srv1nc/tusker-convergence-finish'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
      - name: Apply the exact locally tested source patch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, pathlib, subprocess
          blobs = [
              '4229664452f305db2d62d804fb34539e9f3df444',
              'f84106468a93b06ee7f1d0f67e817e02b12ced88',
              'd831a370b9509c15df5a35b232c48e7ebcae7060',
              'cbecf347cb6cd68ad4712f25aa7f39355caca873',
          ]
          patch = b''
          for sha in blobs:
              blob = json.loads(subprocess.check_output(['gh', 'api', 'repos/srv1n/tusker/git/blobs/' + sha]))
              assert blob['encoding'] == 'base64', 'unexpected blob encoding'
              data = base64.b64decode(blob['content'])
              identity = hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest()
              assert identity == sha, 'blob identity mismatch'
              patch += data
          assert hashlib.sha256(patch).hexdigest() == '90ed4267b7223d04ba28416f3aa2d21d1e233b7ab627a356eea16aca23ce1e6b', 'patch checksum mismatch'
          subprocess.run(['git', 'apply', '--check', '--index', '-'], input=patch, check=True)
          subprocess.run(['git', 'apply', '--index', '--whitespace=error', '-'], input=patch, check=True)
          expected = {
              'cmd/tusker/acp_conformance_test.go': '2a348dc6d9469608f842009e065e839f1b65f467704b0a974f58cfd2a2ff933e',
              'cmd/tusker/daemon.go': '0eaa0dc09f714391cf94a9cc5d791a7e5be5a5a8e551ab084a4f760d5f8fa64a',
              'cmd/tusker/delivery_amendment.go': '999b016fe2bf496297f56207e4199fd44b3db6881f6803cd5e01d9d91f1a8016',
              'cmd/tusker/delivery_amendment_history_test.go': '3f00163ce91419cf6fc396d283961d7bc03023fb8a538ace5a5a10dd0c44b0be',
              'cmd/tusker/delivery_amendment_test.go': 'f37eaa5b1465aac8e7375463b129d719b7d86c249b8d8cc950d8fe9c184aef10',
              'cmd/tusker/delivery_cmd.go': 'cb1998bd49ee8a0b501dd7a38a356e42af12273ac71356974f3b7a9538c78390',
              'cmd/tusker/delivery_cmd_test.go': '21842491bc27fc56bd5d64388d4184aaff5158ce2c4500fe1bf03abdc33c1595',
              'cmd/tusker/delivery_context_test.go': 'adc4beb0f19a2c4495a4c05f9da049232219efd17b0544ccce498e2e4691671e',
              'cmd/tusker/delivery_start_cmd_test.go': 'a268fc3eae682553e32bf595051f53b42d7f47050be027da94357bc307047a8d',
              'cmd/tusker/delivery_v2.go': '68b3b9d0fd7589d9ab736241e7d525399a70279662b177e5abd759b87879d96d',
              'cmd/tusker/delivery_v2_test.go': '2a15045b850d4960b7f27c14138810fed2066fc72dd4ce92a774cd83e4b69219',
              'cmd/tusker/resume_project_identity_test.go': '28cc9b20145692457e62f900e2780c7d6f5ffd23eca0fd43ddfcdc6f1bed54e0',
              'cmd/tusker/review_proposal.go': '8451a0c1b264def8a3cf1ded139207e612fc3763a9868f09b9f869061115d22a',
              'cmd/tusker/review_result.go': '365567058e959c6e3b8b14814557a9fb98339d010f63dfa05196d50a998f91b2',
              'cmd/tusker/review_verification_workspace.go': 'c5131547af3b136bfd6813d8edb8709a6fa3714818f97aeae4a1a7c871b62dfe',
              'cmd/tusker/runner_acp_test.go': '83b91e5965d584175b31257e6d503088a826ca7df5bc432cfb8263e54e30bd6c',
              'cmd/tusker/serve_delivery_test.go': 'a7ca376851d051a0c4cdf3b7504379f96c0f4412ea6e78602bc8f8cc874ae0c2',
              'cmd/tusker/test_helpers_test.go': 'f7aab5c156f9ee6f09528d8bab9f61914831aa1d9e84187041af030ce2b7af14',
              'cmd/tusker/test_helpers_v7_test.go': '17b1283fae5177365cbf21429ceaf61b9e848848962d3dea2a38367e83677780',
              'cmd/tusker/trust_context_reuse_test.go': '501154d7b242b0a768613b763668568cc8ac1aee6ae19d492fe59db0fe29e867',
              'cmd/tusker/trust_full_journey_test.go': '898ccc5f9e15f936a96c7025bf4167e6ad06d2a500c3bddca776e3acd77f2ca5',
              'cmd/tusker/trust_preflight_test.go': '244084d76a2055718de616f8211ecd6edc110a82f487e8571630432c8c03c7b5',
              'cmd/tusker/trust_token_baseline_test.go': '6e5ad0edc8c174f39b1dc21332d2fab763e38e7d9148f574f1aadf00f0a7cf0b',
              'cmd/tusker/v7_verification_execution.go': 'b4b1656538f2b3c9a62a18f18ace4875703174db63b55e8165bed867ad2dd893',
              'cmd/tusker/work_session_cmd.go': '63e1b4a01a084e01d0d595ac09827980a2d65a7011f8e57c73e655171677a085',
              'cmd/tusker/work_session_cmd_test.go': '0e9417a96e67ca1bf967f7fb2d05713c92860e8dc0328352efbcecfe3f4fc9d4',
              'cmd/tusker/worker_authority_boundary_test.go': '880ee438f1adcfa1df6a06f18b5d2ea8536550ed3e4c77aeba96e6e373dffc18',
              'internal/docgraph/resolver_test.go': '8a9f5f841fa86978c766cd1d5db72c1e1b6606221e66c8d5401ef0e2d1b4706e',
              'skills/tusker/references/REPO_ONBOARDING.md': '70d257be5f5fd1fd716baa4890c90766713b0c5f07911fc342dd3d64eed07435',
              'skills/tusker/testdata/progressive-disclosure-budget.json': '039d7a4df262c3c523fb03a14550ebc3cf55efa7ff95f07d908c93100e216538',
          }
          changed = subprocess.check_output(['git', 'diff', '--cached', '--name-only', '-z']).decode().strip('\0').split('\0')
          assert set(changed) == set(expected), 'unexpected changed paths'
          for path, digest in expected.items():
              assert hashlib.sha256(pathlib.Path(path).read_bytes()).hexdigest() == digest, 'candidate checksum mismatch: ' + path
          subprocess.run(['git', 'diff', '--cached', '--check'], check=True)
          print('Verified all 30 locally tested candidate files.')
          PY
      - name: Remove this one-time publisher and fast-forward only the PR branch
        run: |
          git config user.name "$(git log -1 --format=%an)"
          git config user.email "$(git log -1 --format=%ae)"
          git rm -- .github/workflows/convergence-apply.yml
          git commit -m "fix: preserve convergence history and bind review proof to implementation"
          git push origin HEAD:refs/heads/srv1nc/tusker-convergence-finish
