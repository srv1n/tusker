name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GOFLAGS: -trimpath

jobs:
  ui-linux:
    name: UI (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - name: Run UI release checks
        working-directory: internal/serve/ui
        run: |
          bun install --frozen-lockfile
          bun test
          bun run build
      - name: Verify embedded UI bundle is current
        run: git diff --exit-code -- internal/serve/ui/dist

  release-linux:
    name: Go release gate (Linux)
    runs-on: ubuntu-latest
    needs: ui-linux
    timeout-minutes: 35
    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
      - name: Enforce Tusker branch policy
        if: github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'tusker-state-change')
        run: go run ./cmd/tusker validate --branch-policy-only --base origin/main
      - name: Format, test, vet, validate, and build
        run: |
          test -z "$(gofmt -l $(git ls-files '*.go'))"
          go test -timeout=20m -p=1 -parallel=1 ./cmd/tusker ./internal/... ./skills/tusker
          go vet -p=1 ./...
          go run ./cmd/tusker validate --branch-policy --json
          go build -trimpath ./cmd/tusker
      - name: Run strict V7 skill doctor
        run: |
          go run ./cmd/tusker skill doctor --strict --json
          tmp="$(mktemp -d)"
          go run ./cmd/tusker publish skill --v7 --out "$tmp/project-skill" --quiet
          go run ./cmd/tusker skill doctor --package "$tmp/project-skill" --strict --json

  go-matrix:
    name: Go tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 1
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
      - name: Run supported Go tests
        shell: bash
        run: |
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            # cmd/tusker has Unix-only syscall/build surfaces; keep Windows as
            # a real compile/test signal for the portable internal packages.
            go test -timeout=20m -p=1 ./internal/...
          else
            go test -timeout=20m -p=1 ./...
          fi

  e2e-linux:
    name: Linux end-to-end tests
    runs-on: ubuntu-latest
    needs: release-linux
    timeout-minutes: 35
    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 1
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
      - name: Run Linux e2e suite
        run: go test -timeout=25m -p=1 ./e2e/...

  race-linux:
    name: Go race detector (Linux)
    runs-on: ubuntu-latest
    needs: go-matrix
    timeout-minutes: 40
    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 1
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
      - name: Run race-enabled tests
        run: go test -race -timeout=25m -p=1 ./cmd/tusker ./internal/...

  govulncheck:
    name: Go vulnerability gate
    runs-on: ubuntu-latest
    needs: release-linux
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 1
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
      - name: Run pinned govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./...
