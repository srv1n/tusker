flicts without replay. Use contract/runtime APIs rather than a second browser state authority. Required tests: AgentAccessApprovalUI in agent-access-approval.test.ts; browser scenarios include a second agent and a no-callback route.\n\nArtifact: docs/reports/agent-access/approval-ui.md.",
