tasks:
  - source_key: task-WUX-T-0019
    title: Ship selectable project visibility
    outcome: "People who initialize a folder see it in Tusker automatically and can choose whether it stays on the main screen. Every registered folder remains recoverable in All Projects, and changing that check box never changes automation. Done means the choice survives restart, broken folders cannot crash the service, and the desktop keeps the current page during service recovery.\n\n## Implementation notes\nPersist one visibility bit in the existing machine project registry and migrate old rows to visible. Reuse the existing project summary, mutation, settings, and navigation-filter paths. Apply a logical project's choice to its grouped checkouts. Register from init by default with an explicit no-register escape hatch. Keep visibility independent from the existing automation-enabled field. Quarantine unreadable project work during reconciliation and avoid reloading committed WebKit content after runtime recovery. Rebuild the existing embedded web assets; add no dependency or secondary preference store."
    acceptance:
      - id: A1
        outcome: Running init registers the folder for app discovery, shows it by default, and leaves automation disabled.
      - id: A2
        outcome: Global Settings lists every registration and its error state; checking or unchecking one logical project changes only main-screen membership for all grouped checkouts.
      - id: A3
        outcome: Existing registrations migrate without disappearing, and hidden registrations remain stored and recoverable.
      - id: A4
        outcome: A missing project cannot terminate reconciliation, and runtime recovery does not reload a committed main window or panel.
    verification:
      - covers: A1,A2,A3,A4
        check: "command: go test ./cmd/tusker -run 'Test(ProjectVisibilityPersistsWithoutChangingAutomation|ArchitectWaveReportsSkipBrokenProject|DaemonQuarantineBrokenProject)$' -count=1"
      - covers: A2,A3
        check: "command: cd internal/serve/ui && bun test test/project-strip-state.test.ts test/project-strip-shell.test.ts && bun run build"
      - covers: A4
        check: "command: swift test --package-path apps/mac/TuskerBar --filter TuskerBarTests.testRuntimeShellLoadsStoredUIOptimisticallyAndNeverCoversCommittedContent"
    artifact:
