he demo/runtime code. Use an isolated disposable repository and explicit isolated state only if exercising a mutating example; never drive the user's running fixture. Source/help-only checks remain labeled. This supplies the prose/example subset of FLW-T-0011, not its wider CLI implementation. Save an acceptance-linked before/after example and command/source comparison in workflows.md. Report current unknowns instead of inventing commands. No application build is required for prose changes.\n\n## Independent review checks\nThe independent reviewer follows the prepare-work and record-command-proof examples against the named binary/help or isolated fixture, compares conditions with source, and records expected versus observed results in workflows.md.",
