<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#fafafa" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#16161a" />
    <link rel="icon" type="image/png" href="/tusker-icon.png" />
    <link rel="apple-touch-icon" href="/tusker-icon.png" />
    <title>tusker · serve</title>
    <script>
      // Set the theme attribute before first paint to avoid a flash.
      (function () {
        try {
          var t = localStorage.getItem("tusker-theme");
          if (t === "light" || t === "dark") {
            document.documentElement.setAttribute("data-theme", t);
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
